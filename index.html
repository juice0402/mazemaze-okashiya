<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="棚にお菓子を並べて値段を決めると、お客さんが好みで買っていくドット絵のお店ゲーム。">
<meta name="theme-color" content="#2b1a12">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>まぜまぜおかし屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 縦長1画面：上に帳場（お金と毎秒の売上）、まん中に今いる部屋、下に部屋の絵（入荷・厨房・売り場・レジ）とお店の帳面。ドット絵のお店1つの世界なので色は1つにしぼる */
:root{
  --cocoa:#2b1a12;
  --walnut:#4a2c1c;
  --walnut-hi:#7a4b2e;
  --milk:#fdf2f4;
  --milk-2:#f6dfe5;
  --line:#f0c9d4;
  --ink:#3a2318;
  --ink-soft:#7a5a4a;
  --ink-faint:#b8a0a6;
  --berry:#e0507a;
  --berry-dk:#a8304f;
  --mint:#bfe3cf;
  --gold:#f6c94c;
  --paper:#ffffff;
  --font:"DotGothic16","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--cocoa);color:var(--milk);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:relative;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:10px 8px}
#money{display:flex;align-items:center;gap:6px;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;transform-origin:left center}
#money img{width:21px;height:21px;image-rendering:pixelated}
#money small{font-size:15px}
#money.bump{animation:bump .22s steps(2)}
@keyframes bump{50%{transform:scale(1.08)}}
#rate{text-align:right;font-size:13px;color:var(--mint);line-height:1.15}
#rate b{font-weight:400;font-size:22px;color:var(--milk);font-variant-numeric:tabular-nums}
#stage{position:relative;flex:1;min-height:0}
#scene{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;box-shadow:0 0 0 3px var(--walnut),0 0 0 6px var(--cocoa);cursor:pointer}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:8px 14px;font-size:15px;white-space:nowrap;pointer-events:none}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:6px 12px;font-size:14px;white-space:nowrap;pointer-events:none}
#ov{position:absolute;pointer-events:none}
#foot{flex:none;display:flex;align-items:flex-end;gap:8px;padding-block:18px 8px}
#rooms{flex:1;min-width:0;display:flex;align-items:flex-end;border-bottom:4px solid var(--walnut-hi)}
.room{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:0 0 3px;font:inherit;color:var(--milk-2);cursor:pointer}
.room canvas{width:51px;height:51px;image-rendering:pixelated;transition:transform .12s steps(2)}
.room span{font-size:12px;line-height:1.2;opacity:.7}
.room .ptr{position:absolute;top:-15px;left:50%;width:14px;height:8px;margin-left:-7px;image-rendering:pixelated;visibility:hidden}
.room.on canvas{transform:translateY(-4px)}
.room.on span{opacity:1;color:var(--milk)}
.room.on .ptr{visibility:visible}
#shopBtn{flex:none;display:flex;align-items:center;gap:6px;height:44px;margin-bottom:4px;padding-inline:10px;font-size:15px;color:var(--milk);border-color:var(--walnut-hi);background:var(--walnut)}
#shopBtn img{width:20px;height:20px;image-rendering:pixelated}
#shopBtn.can{background:var(--berry);border-color:var(--berry-dk);color:var(--paper)}
.panel{background:var(--milk);color:var(--ink);border:4px solid var(--walnut);box-shadow:inset 0 0 0 2px var(--paper)}
.pop{position:absolute;z-index:5;padding:6px}
#chooser{display:flex;gap:4px}
#chooser button{display:flex;align-items:flex-end;justify-content:center;width:66px;height:62px;padding:0 0 3px;background:var(--paper);border:3px solid var(--walnut);border-bottom-width:5px;cursor:pointer}
#chooser button.on{border-color:var(--berry);border-bottom-color:var(--berry-dk)}
#chooser button:active{border-bottom-width:3px;transform:translateY(2px)}
#chooser img{width:57px;height:51px;image-rendering:pixelated}
#chooser button:focus-visible,.step:focus-visible,.btn:focus-visible,.led:focus-visible,.room:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.pr-row{display:flex;align-items:center;gap:6px}
.step{width:36px;height:36px;flex:none;font:inherit;font-size:20px;line-height:1;color:var(--ink);background:var(--milk-2);border:3px solid var(--walnut);border-bottom-width:5px;cursor:pointer;touch-action:none}
.step:active{border-bottom-width:3px;transform:translateY(2px)}
.step:disabled{opacity:.35}
#pVal{min-width:4.6em;text-align:center;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
#pVal.loss{color:var(--berry-dk)}
.hearts{display:flex;justify-content:center;gap:2px;margin-top:6px}
.hearts img{width:14px;height:12px;image-rendering:pixelated}
.btn{flex:1;height:48px;font:inherit;font-size:17px;cursor:pointer}
.btn.main{background:var(--berry);color:var(--paper);border:3px solid var(--berry-dk);border-bottom-width:6px}
.btn.main:disabled{opacity:.45}
.btn.sub{background:transparent;color:var(--ink);border:3px solid var(--walnut);border-bottom-width:6px}
.btn:active:not(:disabled){border-bottom-width:3px;transform:translateY(3px)}
#ledger{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;padding:10px}
#ledger{bottom:8px;max-height:calc(100% - 86px)}
.led-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-inline:2px}
.led-head h2{margin:0;font-size:16px;font-weight:400}
.led-total{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.book{flex:1;min-height:0;overflow-y:auto;margin-block:6px 10px;border-block:2px solid var(--ink-soft);border-inline:3px double var(--berry);overscroll-behavior:contain}
.led{display:grid;grid-template-columns:34px 1fr 6.4em;align-items:center;gap:8px;width:100%;padding:0 0 0 8px;background:none;border:0;border-bottom:2px solid var(--line);font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.led>*{padding-block:6px}
.led .ic{width:30px;height:30px;image-rendering:pixelated}
.led .nm{font-size:15px}
.led .cnt{font-size:13px;color:var(--ink-soft);margin-left:6px;font-variant-numeric:tabular-nums}
.led .ef{display:block;font-size:12px;color:var(--ink-soft)}
.led .pr{align-self:stretch;display:flex;align-items:center;justify-content:flex-end;gap:3px;padding-inline:6px;border-left:2px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.led .pr img{width:14px;height:14px;image-rendering:pixelated}
.led:disabled{cursor:default}
.led:disabled .pr{color:var(--ink-faint)}
.led:active:not(:disabled){background:var(--milk-2)}
.led.big .nm{color:var(--berry-dk)}
.led.locked .nm,.led.locked .ef{color:var(--ink-faint)}
.led.locked .ic{opacity:.25}
.led.lack .ef{color:var(--berry-dk)}
.led.lack .ic{opacity:.5}
.led.maxed .pr img{visibility:hidden}
@media (prefers-reduced-motion:reduce){#money.bump{animation:none}.pick img,.room canvas{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="money"><img id="coinImg" alt=""><span id="moneyVal">0</span><small>円</small></div>
    <div id="rate">毎秒 <b id="rateVal">0</b>円</div>
  </header>
  <main id="stage">
    <canvas id="scene" width="128" height="176" role="img" aria-label="売り場：棚とお客さん"></canvas>
    <div id="ov"></div>
    <div id="toast" class="panel" hidden></div>
    <div id="hint" class="panel" hidden></div>
    <div id="chooser" class="pop panel" hidden role="group" aria-label="並べるお菓子"></div>
    <div id="pricer" class="pop panel" hidden role="group" aria-label="値段">
      <div class="pr-row"><button class="step" id="pMinus" type="button" aria-label="値下げ">−</button><output id="pVal">0円</output><button class="step" id="pPlus" type="button" aria-label="値上げ">＋</button></div>
      <div id="hearts" class="hearts" aria-label="売れやすさ"></div>
    </div>
  </main>
  <footer id="foot">
    <nav id="rooms" aria-label="部屋をえらぶ"></nav>
    <button class="btn sub" id="shopBtn" type="button"><img id="shopIcon" alt="">お店</button>
  </footer>


  <section id="ledger" class="panel" hidden aria-label="お店の帳面">
    <div class="led-head"><h2>お店の帳面</h2><span class="led-total" id="ledTotal"></span></div>
    <div id="ledList" class="book"></div>
    <button class="btn sub" id="ledClose">とじる</button>
  </section>

</div>

<script>
(() => {
'use strict';
const W = 128, KEY = 'mazemaze-okashiya';
const MPS = 3;          // お客さんの来るペースの単位（1秒＝3）。日数・時計はない
const BAKE_T = 8;       // 1回焼くのにかかる秒
const DELIV_T = 4;      // 注文してから箱が届くまでの秒
const PAT = 25;         // レジで待てる秒（こえると帰る。持っていたお菓子はむだになる）
const QVIS = 6;         // レジの列で絵に出す人数
const $ = id => document.getElementById(id);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const clampInt = (v, lo, hi, def) => Number.isFinite(v) ? Math.min(hi, Math.max(lo, Math.floor(v))) : def;

/* 大きな数字：10万からは「万・億・兆・京」 */
function fmt(n) {
  n = Math.floor(n);
  if (n < 1e5) return n.toLocaleString('ja-JP');
  const units = [[1e16, '京'], [1e12, '兆'], [1e8, '億'], [1e4, '万']];
  for (const [u, s] of units) if (n >= u) {
    const v = n / u;
    return (v >= 1000 ? Math.floor(v).toLocaleString('ja-JP') : v >= 100 ? Math.floor(v) : v >= 10 ? (Math.floor(v * 10) / 10) : (Math.floor(v * 100) / 100)) + s;
  }
  return String(n);
}

/* ---------- ドット絵 ---------- */
function fromMap(map, pal) {
  const h = map.length, w = map[0].length, c = mk(w, h), x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const k = map[j][i];
    if (k === '.' || !pal[k]) continue;
    x.fillStyle = pal[k]; x.fillRect(i, j, 1, 1);
  }
  return c;
}
function outline(src, col) {
  const w = src.width, h = src.height, d = src.getContext('2d').getImageData(0, 0, w, h).data;
  const a = (i, j) => (i < 0 || j < 0 || i >= w || j >= h) ? 0 : d[(j * w + i) * 4 + 3];
  const c = mk(w, h), x = c.getContext('2d');
  x.fillStyle = col;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    if (a(i, j)) continue;
    if (a(i - 1, j) || a(i + 1, j) || a(i, j - 1) || a(i, j + 1)) x.fillRect(i, j, 1, 1);
  }
  x.drawImage(src, 0, 0);
  return c;
}
function big(src, s) {
  const c = mk(src.width * s, src.height * s), x = c.getContext('2d');
  x.imageSmoothingEnabled = false; x.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL();
}
function crop(src, sx, sy, w, h) { const c = mk(w, h); c.getContext('2d').drawImage(src, -sx, -sy); return c; }

const SWEETS = {
  cookie: { name: 'クッキー', value: 100,
    map: ['..........','..oooooo..','.olllbbbo.','olcllbbcbo','obllbbbbbo','obbbbcbbbo','ocbbbbbbbo','obbbcbbcbo','.obbbbbbo.','..oooooo..'],
    pal: { o: '#5a3418', b: '#c98a4b', l: '#e4b273', c: '#3b2414' } },
  donut: { name: 'ドーナツ', value: 150,
    map: ['..oooooo..','.oPPppypo.','oPpgpppwpo','oppyoopppo','opgo..oypo','oppo..opgo','odpwoopppo','oddpppgpdo','.oddddddo.','..oooooo..'],
    pal: { o: '#7a3a4a', p: '#f28cab', P: '#f9c6d6', d: '#d79a5c', y: '#ffd75e', g: '#6fd1bd', w: '#ffffff' } },
  purin: { name: 'プリン', value: 200,
    map: ['...oooo...','..oCccco..','..occcco..','.oYyyyyso.','.oYyyyyso.','oYyyyyyyso','oyyyyyyyso','osssssssso','WwwwwwwwwW','.WWWWWWWW.'],
    pal: { o: '#6b3d1a', c: '#8a4a1c', C: '#b8682a', y: '#f6d36b', Y: '#fcebb0', s: '#dfae46', w: '#ffffff', W: '#b9cad6' } },
};
const ORDER = ['cookie', 'donut', 'purin'];
const SPR = {};
for (const id of ORDER) SPR[id] = fromMap(SWEETS[id].map, SWEETS[id].pal);

/* 材料：1こ作るのに、レシピの材料を1つずつ使う（値段は1つ分） */
const MATS = {
  komugi: { name: '小麦粉', price: 10, label: '#e6d9bd',
    map: ['...oooo...','..oWWWWo..','...oWWo...','..oWWWWo..','.oWWWWWWo.','oWWWyyWWWo','oWWyWWyWWo','oWWWyyWWWo','oWWWWWWWWo','.oooooooo.'],
    pal: { o: '#7a6a58', W: '#f7f1e3', y: '#d9a84a' } },
  tamago: { name: '卵', price: 32, label: '#f6c27a',
    map: ['...oooo...','..oWWWWo..','.oWHWWWWo.','.oWHWWWWo.','oWWWWWWWWo','oWWWWWWWWo','oWWWWWWWso','.oWWWWWso.','..osssso..','...oooo...'],
    pal: { o: '#a8743c', W: '#fbe7c6', H: '#ffffff', s: '#e8c79a' } },
  gyunyu: { name: '牛乳', price: 30, label: '#8fc1ee',
    map: ['....oo....','...oWWo...','..oWWWWo..','.oWWWWWWo.','.oooooooo.','.oWWWWWWo.','.obbbbbbo.','.obWWWWbo.','.obbbbbbo.','.oooooooo.'],
    pal: { o: '#3a4a6a', W: '#ffffff', b: '#6fa8e0' } },
  sato: { name: '砂糖', price: 8, label: '#f7a8c2',
    map: ['..oooooo..','..oppppo..','.oPPPPPPo.','.oPwPPwPo.','oPPPPPPPPo','oPPwPPPwPo','oPPPPwPPPo','oPwPPPPPPo','oPPPPPPPPo','.oooooooo.'],
    pal: { o: '#8a3a5a', p: '#e07aa0', P: '#f9c6d6', w: '#ffffff' } },
  bata: { name: 'バター', price: 12, label: '#f6d36b',
    map: ['..........','..........','...oooooo.','..oYYYYYyo','.oYYYYYyyo','.ooooooyyo','.oyyyyyoyo','.oyyyyyyo.','WooooooooW','.WWWWWWWW.'],
    pal: { o: '#a5761c', Y: '#fff3a8', y: '#f6d36b', W: '#b9cad6' } },
};
const MORDER = Object.keys(MATS);
const MSPR = {};
for (const m of MORDER) MSPR[m] = fromMap(MATS[m].map, MATS[m].pal);
const RECIPE = { cookie: ['komugi', 'bata', 'sato'], donut: ['komugi', 'tamago', 'sato'], purin: ['tamago', 'gyunyu', 'sato'] };
for (const id of ORDER) SWEETS[id].cost = RECIPE[id].reduce((a, m) => a + MATS[m].price, 0);   // 30・50・70円

/* 段ボール箱：前の紙に材料の色 */
function boxSprite(label, w, h) {
  const c = mk(w, h), x = c.getContext('2d');
  const r = (col, X, Y, ww, hh) => { x.fillStyle = col; x.fillRect(X, Y, ww, hh); };
  r('#6b4426', 0, 0, w, h);
  r('#d8ad74', 1, 1, w - 2, h - 2);
  r('#e8c48e', 1, 1, w - 2, 2);
  r('#6b4426', 1, 3, w - 2, 1);
  r('#c08a4e', (w >> 1) - 1, 1, 2, 2);
  r('#b88a52', 1, h - 2, w - 2, 1);
  if (label) { r('#ffffff', 3, 5, w - 6, h - 7); r(label, 4, 6, w - 8, h - 9); }
  return c;
}
const BOXSPR = {};
for (const m of MORDER) BOXSPR[m] = boxSprite(MATS[m].label, 14, 11);
const MINIBOX = boxSprite(null, 8, 6);

const COIN = fromMap(['..ooo..','.oyyyo.','oyYyyyo','oyYyyyo','oyyyyyo','.oyyyo.','..ooo..'], { o: '#a36d0e', y: '#f6c94c', Y: '#fff0a8' });
const HEART_MAP = ['.rr.rr.','rRrrrrr','rrrrrrr','.rrrrr.','..rrr..','...r...'];
const HEART_ON = fromMap(HEART_MAP, { r: '#e0507a', R: '#ffc2d2' });
const HEART_OFF = fromMap(HEART_MAP, { r: '#e4cfd5', R: '#e4cfd5' });
const PTR = fromMap(['bbbbbbb','.bbbbb.','..bbb..','...b...'], { b: '#e0507a' });
const BUB_BASE = ['.ooooooooo.','owwwwwwwwwo','owwwwwwwwwo','owwwwwwwwwo','owwwwwwwwwo','owwwwwwwwwo','.ooowooooo.','...owo.....','....o......'];
const BUB_SIGN = fromMap(BUB_BASE, { o: '#e0507a', w: '#ffffff' });   // 下の部屋の絵の知らせ（暗い背景でも見えるふち）
function bubble(icon, pal) {
  const b = fromMap(BUB_BASE, { o: '#3a2318', w: '#ffffff' }), x = b.getContext('2d');
  x.drawImage(fromMap(icon, pal), 3, 1);
  return b;
}
const BUB = {
  heart: bubble(['.r.r.','rrrrr','rrrrr','.rrr.','..r..'], { r: '#e0507a' }),
  drop: bubble(['..b..','..b..','.bbb.','bbBbb','.bbb.'], { b: '#4f8fd6', B: '#bfe0ff' }),
  dots: bubble(['.....','.....','k.k.k','.....','.....'], { k: '#3a2318' }),
  excl: bubble(['..r..','..r..','..r..','.....','..r..'], { r: '#e0507a' }),
  angry: bubble(['rr.rr','r...r','.....','r...r','rr.rr'], { r: '#d8304a' }),
};

/* 部屋の絵（下に並ぶ） */
const ROOM_ICON = {
  nyuka: fromMap(['............','............','.oooooooooo.','.okkkTTkkko.','.okkkTTkkko.','.oooooooooo.','.oddddddddo.','.oddwwwwddo.','.oddwccwddo.','.oddwwwwddo.','.oooooooooo.','............'],
    { o: '#5a3420', k: '#e6c08a', T: '#c08a4e', d: '#d2a46a', w: '#ffffff', c: '#f6c27a' }),
  chubo: fromMap(['oooooooooooo','oggggggggggo','ogkgkgggggro','oooooooooooo','owwwwwwwwwwo','owoooooooowo','owoyyyyyyowo','owoyYYyyyowo','owoooooooowo','owwwwwwwwwwo','oooooooooooo','.oo......oo.'],
    { o: '#3a3540', g: '#9aa3ad', k: '#2b2630', r: '#e0507a', w: '#d9dee3', y: '#f6a04c', Y: '#ffd36b' }),
  uriba: fromMap(['oooooooooooo','oBBBBBBBBBBo','oBccBddBppBo','oBccBddBppBo','oLLLLLLLLLLo','oBBBBBBBBBBo','oBppBccBddBo','oBppBccBddBo','oLLLLLLLLLLo','oBBBBBBBBBBo','oooooooooooo','.o........o.'],
    { o: '#3f2416', B: '#8a5a3b', L: '#d29a68', c: '#c98a4b', d: '#f28cab', p: '#f6d36b' }),
  reji: fromMap(['......ooooo.','......oGGGo.','......ooooo.','.......oo...','.oooooooooo.','.orrrrrrrro.','.orwrwrwrro.','.orrrrrrrro.','oooooooooooo','oddddddddddo','oddddyyddddo','oooooooooooo'],
    { o: '#3a2318', G: '#7fe3a8', r: '#e0507a', w: '#ffffff', d: '#8a5a3b', y: '#f6c94c' }),
};

/* 帳面の絵 */
const ICONS = {
  kanban: fromMap(['..........','.oooooooo.','.obbbbbbo.','.obwwwwbo.','.obbbbbbo.','.oooooooo.','...o..o...','...o..o...','..oo..oo..','..........'], { o: '#5a3420', b: '#e0507a', w: '#ffffff' }),
  kago: fromMap(['...oooo...','..o....o..','.o......o.','oooooooooo','obybybybyo','oybybybybo','.obybybyo.','.oybybybo.','..oooooo..','..........'], { o: '#7a4b2e', b: '#c98a4b', y: '#e4b273' }),

/* ---------- セーブ ---------- */
const zeroOf = keys => Object.fromEntries(keys.map(k => [k, 0]));
function newGame() {
  return {
    v: 3, money: 500, stage: 1, eq: zeroOf(EQUIP.map(e => e.id)),
    slots: [{ id: 'cookie', n: 6 }, { id: 'donut', n: 4 }, { id: 'purin', n: 3 }, { id: null, n: 0 }, { id: null, n: 0 }, { id: null, n: 0 }],
    prices: { cookie: 100, donut: 150, purin: 200 },
    stock: { komugi: 12, tamago: 6, gyunyu: 6, sato: 18, bata: 6 },
    inv: zeroOf(ORDER),
    ovens: [{ id: null, t: 0, n: 0 }], deliv: [], boxes: [], queue: [],
    total: { sold: 0, revenue: 0, lost: 0 }, tips: {},
  };
}
function sanitize(o) {
  const d = newGame();
  if (!o || o.v !== 3 || !Array.isArray(o.slots)) return d;   // 第2版までのセーブは読まずに新しく始める（11/4 しょーくん）
  const num = (v, def) => Number.isFinite(v) ? v : def;
  const arr = v => Array.isArray(v) ? v.slice(0, 200) : [];
  const s = {
    v: 3, money: Math.max(0, num(o.money, d.money)), stage: clampInt(o.stage, 1, STAGES.length - 1, 1),
    eq: zeroOf(EQUIP.map(e => e.id)), prices: {}, stock: {}, inv: {},
    total: Object.assign({ sold: 0, revenue: 0, lost: 0 }, o.total || {}), tips: Object.assign({}, o.tips || {}),
  };
  if (o.eq) for (const e of EQUIP) s.eq[e.id] = clampInt(o.eq[e.id], 0, e.max ?? 9999, 0);
  const capN = STAGES[s.stage].cap + 9 * s.eq.tanaita;
  s.slots = Array.from({ length: STAGES[s.stage].tiers * 3 }, (_, i) => {
    const x = o.slots[i];
    if (!x || !SWEETS[x.id]) return { id: null, n: 0 };
    return { id: x.id, n: clampInt(x.n, 0, capN, 0) };
  });
  for (const id of ORDER) s.prices[id] = clampInt(o.prices && o.prices[id], 10, 99990, d.prices[id]);
  for (const m of MORDER) s.stock[m] = clampInt(o.stock && o.stock[m], 0, 1e15, 0);
  for (const id of ORDER) s.inv[id] = clampInt(o.inv && o.inv[id], 0, 1e15, 0);
  s.ovens = Array.from({ length: 1 + s.eq.oven }, (_, i) => {
    const v = arr(o.ovens)[i];
    return v && SWEETS[v.id] ? { id: v.id, t: Math.min(BAKE_T, Math.max(0, num(v.t, 0))), n: clampInt(v.n, 1, 1e15, 6) } : { id: null, t: 0, n: 0 };
  });
  s.deliv = arr(o.deliv).filter(v => v && MATS[v.m]).map(v => ({ m: v.m, n: clampInt(v.n, 1, 1e15, 12), t: Math.min(DELIV_T, Math.max(0, num(v.t, 0))) }));
  s.boxes = arr(o.boxes).filter(v => v && MATS[v.m]).map(v => ({ m: v.m, n: clampInt(v.n, 1, 1e15, 12) }));
  s.queue = arr(o.queue).filter(q => q && TYPE[q.tid] && Array.isArray(q.items)).map(q => {
    const items = q.items.filter(it => Array.isArray(it) && SWEETS[it[0]]).map(it => [it[0], clampInt(it[1], 1, 1e15, 1), clampInt(it[2], 0, 1e15, 0)]);
    return { tid: q.tid, items, pay: items.reduce((a, it) => a + it[1] * it[2], 0), grp: Math.max(1, num(q.grp, 1)), pat: Math.min(PAT, Math.max(1, num(q.pat, PAT))), x: W + 8 };
  }).filter(q => q.items.length);

}

/* ---------- 遊び ---------- */
let S, view = 'uriba', cust = [], exits = [], fx = [], spawnT = 3, sheetSlot = -1, blink = 0, P = 1;
let HH = 176, OFF = 0, BG = {}, runClock = 0, sales = [], staff = [];
const T = { shiire: 1, pati: 1, tenin: 2, reji: 1 };   // 係ごとの、次に動くまでの秒
const HELP = { nyuka: { x: 112, tx: 112, hop: 0, walk: 0 }, chubo: { x: 64, tx: 64, hop: 0, walk: 0 }, reji: { x: 8, tx: 8, hop: 0, walk: 0 } };
const cv = $('scene'), ctx = cv.getContext('2d');
const pf = (r, t) => 1 / (1 + Math.exp((r - t) * 7));
const sround = v => Math.floor(v) + (Math.random() < v - Math.floor(v) ? 1 : 0);
const addFx = (room, x, y, txt, col, coin) => fx.push({ room, x, y, t: 0, txt, col, coin });

/* 売り場：お客さんは棚からお菓子を取って、レジに並ぶ */
function pickType() {
  const sum = TYPES.reduce((a, t) => a + t.w, 0);
  let k = Math.random() * sum;
  for (const t of TYPES) { k -= t.w; if (k < 0) return t; }
  return TYPES[0];
}
function decide(t) {
  let best = null, bestScore = -1;
  const tt = t.t * tol();
  for (const id of ORDER) {
    if (!S.slots.some(s => s.id === id && s.n > 0)) continue;
    const p = pf(S.prices[id] / SWEETS[id].value, tt), ap = t.pref[id] * p;
    const sc = ap * (0.8 + Math.random() * 0.4);
    if (sc > bestScore) { bestScore = sc; best = { id, ap, p }; }
  }
  if (!best) return { sweet: null, slot: -1, outcome: 'none' };
  const list = [];
  S.slots.forEach((s, i) => { if (s.id === best.id && s.n > 0) list.push(i); });
  const outcome = Math.random() < Math.min(0.95, best.ap * 1.15) ? 'buy' : (best.p < 0.45 ? 'pricey' : 'none');
  return { sweet: best.id, slot: list[Math.floor(Math.random() * list.length)], outcome };
}
function spawn() {
  if (cust.length >= 5) return;
  const t = pickType(), d = decide(t), g = geo(), grp = crowd();
  cust.push(Object.assign({
    t, x: -8, y: g.base + 32 + Math.floor(Math.random() * 11), sp: 15 + Math.random() * 6,
    state: 'in', timer: 0, walk: 0, bubble: null, grp, many: 0, items: null,
    tx: d.slot >= 0 ? slotRect(d.slot).cx + Math.round(Math.random() * 6 - 3) : 20 + Math.random() * 88,
  }, d));
}
function resolve(c) {
  c.state = 'react'; c.timer = 1.1;
  if (c.outcome === 'buy') {
    let want = Math.max(1, sround(c.grp * basket())), got = 0;
    const order = [c.slot, ...S.slots.map((_, i) => i).filter(i => i !== c.slot)];
    for (const i of order) {
      if (want <= 0) break;
      const s = S.slots[i];
      if (!s || s.id !== c.sweet || s.n <= 0) continue;
      const k = Math.min(want, s.n);
      s.n -= k; want -= k; got += k;
    }
    if (!got) { c.bubble = 'dots'; return; }
    c.items = [[c.sweet, got, S.prices[c.sweet]]];
    c.bubble = 'heart'; c.many = got;
  } else c.bubble = c.outcome === 'pricey' ? 'drop' : 'dots';
}
function joinQueue(c) {
  S.queue.push({ tid: c.t.id, items: c.items, pay: c.items.reduce((a, it) => a + it[1] * it[2], 0), grp: c.grp, pat: PAT, x: W + 8 });
  if (!S.tips.q) { S.tips.q = 1; if (view !== 'reji') toast('レジにお客さんが並んだ'); }
}
function updateCustomers(dt) {
  for (const c of cust) {
    if (c.state === 'in' || c.state === 'out') {
      c.x += c.sp * dt; c.walk += dt;
      if (c.state === 'in' && c.x >= c.tx) { c.x = c.tx; c.state = 'think'; c.timer = 0.9; c.bubble = 'dots'; }
      else if (c.state === 'out' && c.x > W + 10) { c.gone = true; if (c.items) joinQueue(c); }
    } else {
      c.timer -= dt;
      if (c.timer <= 0) { if (c.state === 'think') resolve(c); else { c.state = 'out'; c.bubble = null; } }
    }
  }
  cust = cust.filter(c => !c.gone);
}

/* 品出し係：絵に出すのは3人まで。棚の前の奥側を歩いて、補充する棚まで行く（お客さんは手前を通る） */
function syncStaff() {
  const n = Math.min(3, S.eq.tenin);
  while (staff.length < n) { const home = 116 - staff.length * 12; staff.push({ x: home, home, state: 'idle', slot: -1, walk: 0, hop: 0, wait: 0 }); }
  staff.length = n;
}
function pickSlot() {
  const C = cap(), busy = new Set(staff.filter(s => s.state === 'go').map(s => s.slot));
  let best = -1, bestFill = 1;
  S.slots.forEach((s, i) => { if (s.id && s.n < C && S.inv[s.id] > 0 && !busy.has(i) && s.n / C < bestFill) { bestFill = s.n / C; best = i; } });
  return best;
}
function fillSlot(i) {
  const C = cap(), s = S.slots[i];
  if (!s || !s.id) return;
  const k = Math.min(C - s.n, S.inv[s.id]);
  if (k <= 0) return;
  s.n += k; S.inv[s.id] -= k;
  const r = slotRect(i);
  addFx('uriba', r.cx, r.plank - 14, '+' + pixNum(k), '#bdf2c8');
}
function restockOne() {
  const i = pickSlot();
  if (i < 0) return;
  const st = staff.find(s => s.state === 'idle');
  if (st) { st.state = 'go'; st.slot = i; }
  else if (S.eq.tenin > staff.length) fillSlot(i);   // 絵に出ていない品出し係は、その場で並べる
}
function updateStaff(dt) {
  for (const st of staff) {
    st.hop = Math.max(0, st.hop - dt);
    if (st.state === 'go' || st.state === 'back') {
      const tx = st.state === 'go' ? slotRect(st.slot).cx : st.home, d = tx - st.x, step = 40 * dt;
      st.walk += dt;
      if (Math.abs(d) <= step) {
        st.x = tx;
        if (st.state === 'go') { fillSlot(st.slot); st.hop = 0.25; st.state = 'work'; st.wait = 0.35; }
        else st.state = 'idle';
      } else st.x += Math.sign(d) * step;
    } else if (st.state === 'work') {
      st.wait -= dt;
      if (st.wait <= 0) st.state = 'back';
    }
  }
}

/* 入荷：注文すると少したって箱が届く。箱を開けると材料が倉庫に入る */
function order(m) {
  const p = boxPrice(m);
  if (S.money < p) return false;
  S.money -= p;
  S.deliv.push({ m, n: boxN(), t: DELIV_T });
  addFx('nyuka', 111, doorTop() + 2, '-' + pixNum(p), '#ffd0dc');
  return true;
}
function updateDeliv(dt) {
  for (const d of S.deliv) d.t -= dt;
  const came = S.deliv.filter(d => d.t <= 0);
  if (!came.length) return;
  S.deliv = S.deliv.filter(d => d.t > 0);
  for (const d of came) S.boxes.push({ m: d.m, n: d.n });
}
function openBox() {
  const b = S.boxes.pop();
  if (!b) return false;
  S.stock[b.m] += b.n;
  const bp = boxPos(S.boxes.length);
  addFx('nyuka', bp.x + 7, bp.y, '+' + pixNum(b.n), '#bdf2c8');
  return true;
}

/* 厨房：オーブンに入れて焼き、焼けたら取り出すと在庫になる */
function syncOvens() { while (S.ovens.length < ovenN()) S.ovens.push({ id: null, t: 0, n: 0 }); }
const canBake = id => RECIPE[id].every(m => S.stock[m] >= batchN());
const isDone = o => o.id && o.t <= 0;
function bake(k, id) {
  const o = S.ovens[k];
  if (!o || o.id || !canBake(id)) return false;
  const n = batchN();
  for (const m of RECIPE[id]) S.stock[m] -= n;
  o.id = id; o.t = BAKE_T; o.n = n;
  return true;
}
function takeOut(k) {
  const o = S.ovens[k];
  if (!o || !isDone(o)) return false;
  S.inv[o.id] += o.n;
  addFx('chubo', ovenX(k) + 13, ovenTop() - 4, '+' + pixNum(o.n), '#bdf2c8');
  o.id = null; o.t = 0; o.n = 0;
  return true;
}

/* レジ：並んだお客さんをお会計。待たせすぎると帰ってしまう */
const atReji = () => S.queue.length > 0 && Math.abs(S.queue[0].x - qx(0)) < 0.5;   // 先頭のお客さんがレジに着いた
function checkout() {
  if (!atReji()) return false;   // 歩いている途中はお会計できない（11/5 しょーくん）
  const q = S.queue.shift();
  S.money += q.pay;
  for (const it of q.items) S.total.sold += it[1];
  S.total.revenue += q.pay;
  sales.push([runClock, q.pay]);
  addFx('reji', 28, FL() - 44, '+' + pixNum(q.pay), '#fff3a0', true);
  exits.push({ t: TYPE[q.tid], x: q.x, y: FL() + 22, bubble: 'heart', walk: 0, sp: 26 });
  hud(true);
  return true;
}
function updateQueue(dt) {
  S.queue.forEach((q, k) => {
    q.pat -= dt;
    const tx = k < QVIS ? qx(k) : W + 8, d = tx - q.x, step = 34 * dt;
    if (Math.abs(d) <= step) q.x = tx; else { q.x += Math.sign(d) * step; q.walk = (q.walk || 0) + dt; }
  });
  const left = S.queue.filter(q => q.pat <= 0);
  if (!left.length) return;
  S.queue = S.queue.filter(q => q.pat > 0);
  for (const q of left) {
    S.total.lost += q.items.reduce((a, it) => a + it[1], 0);
    exits.push({ t: TYPE[q.tid], x: q.x, y: FL() + 22, bubble: 'angry', walk: 0, sp: 30 });
  }
  if (!S.tips.lost) { S.tips.lost = 1; toast('待たせすぎて、お客さんが帰っちゃった'); }
}
function updateExits(dt) {
  for (const e of exits) { e.x += e.sp * dt; e.walk += dt; }
  exits = exits.filter(e => e.x < W + 12);
}

/* 係の人（入荷・厨房・レジ）。売り場の品出し係は上 */
const inUse = () => { const u = ORDER.filter(id => S.slots.some(s => s.id === id)); return u.length ? u : ORDER; };
const poke = (room, tx) => { const h = HELP[room]; if (tx != null) h.tx = tx; h.hop = 0.25; };
function shiireAct() {
  let did = false;
  if (S.boxes.length) did = openBox();
  // ため込まない：棚のお菓子に使う材料で、つぎに焼く分（1回分）が足りないものだけ、1箱ずつ注文する
  const n = batchN(), use = inUse();
  let best = null, bestHave = Infinity;
  for (const m of MORDER) {
    if (!use.some(id => RECIPE[id].includes(m))) continue;
    const have = S.stock[m] + S.deliv.filter(d => d.m === m).reduce((a, d) => a + d.n, 0) + S.boxes.filter(b => b.m === m).reduce((a, b) => a + b.n, 0);
    if (have < n && have < bestHave && S.money >= boxPrice(m)) { bestHave = have; best = m; }
  }
  if (best) did = order(best) || did;
  if (did) poke('nyuka');
}
function patiAct() {
  const done = S.ovens.findIndex(isDone);
  if (done >= 0) { takeOut(done); poke('chubo', ovenX(done) + 13); return; }
  const idle = S.ovens.findIndex(o => !o.id);
  if (idle < 0) return;
  let best = null, bestV = Infinity;
  for (const id of inUse()) {
    if (!canBake(id)) continue;
    const v = S.inv[id] + S.ovens.filter(o => o.id === id).reduce((a, o) => a + o.n, 0);
    if (v >= batchN()) continue;   // 在庫（と焼いている分）が1回分を切ったら焼く
    if (v < bestV) { bestV = v; best = id; }
  }
  if (best && bake(idle, best)) poke('chubo', ovenX(idle) + 13);
}
function staffTick(dt) {
  const n = S.eq;
  if (n.shiire > 0 && (T.shiire -= dt) <= 0) { T.shiire = 3 / n.shiire; shiireAct(); }
  if (n.pati > 0 && (T.pati -= dt) <= 0) { T.pati = 2 / n.pati; patiAct(); }
  if (n.tenin > 0 && (T.tenin -= dt) <= 0) { T.tenin = 5 / n.tenin; restockOne(); }
  if (n.reji > 0 && (T.reji -= dt) <= 0 && checkout()) { T.reji = 1.6 / n.reji; poke('reji'); }   // だれも着いていなければ、着いたらすぐ
}
function updateHelpers(dt) {
  for (const k in HELP) {
    const h = HELP[k], d = h.tx - h.x, step = 40 * dt;
    h.hop = Math.max(0, h.hop - dt);
    if (Math.abs(d) <= step) h.x = h.tx; else { h.x += Math.sign(d) * step; h.walk += dt; }
  }
}

function tick(dt) {
  runClock += dt;
  spawnT -= dt * MPS;
  if (spawnT <= 0) { spawn(); spawnT = Math.max(8, 12 / custMul()) * (0.7 + Math.random() * 0.6); }
  syncOvens(); syncStaff();
  staffTick(dt);
  updateStaff(dt); updateHelpers(dt);
  updateCustomers(dt); updateQueue(dt); updateExits(dt);
  for (const o of S.ovens) if (o.id && o.t > 0) o.t = Math.max(0, o.t - dt);
  updateDeliv(dt);
  for (const f of fx) f.t += dt;
  fx = fx.filter(f => f.t < 0.9);
}

/* ---------- 描く ---------- */
const rect = (col, X, Y, w, h) => { ctx.fillStyle = col; ctx.fillRect(X, Y, w, h); };

// 注文の値札（売り場の値札と見分けるため、うすい黄色に茶色の数字。入るときは小判も）
function orderTag(cx, y, price, dim) {
  const s = pixNum(price), tw = textW(s), coin = tw + 12 <= 23, w = tw + 4 + (coin ? 8 : 0), x = cx - (w >> 1);
  rect('#3a2318', x, y, w, 9); rect(dim ? '#e7dde0' : '#fff3c4', x + 1, y + 1, w - 2, 7);

  digits(ctx, s, x + 2 + (coin ? 8 : 0), y + 2, dim ? '#b8a0a6' : '#6b4426');
}
function drawRack() {
  const RP = rackP(), per = batchN();
  MORDER.forEach((m, k) => {
    const x = rackX(k), full = Math.min(RACK_MAX, Math.floor(S.stock[m] / per)), part = full < RACK_MAX && S.stock[m] % per > 0;
    for (let j = 0; j < full + (part ? 1 : 0); j++) {
      if (j >= full) ctx.globalAlpha = 0.35;
      ctx.drawImage(MSPR[m], x + 2 + (j % 2) * 11, RP - 10 - Math.floor(j / 2) * 9);
      ctx.globalAlpha = 1;
    }
    if (!full && !part) { ctx.globalAlpha = 0.2; ctx.drawImage(MSPR[m], x + 7, RP - 10); ctx.globalAlpha = 1; }   // からっぽ：うすい形だけ
    if (S.deliv.some(d => d.m === m)) ctx.drawImage(MINIBOX, x + 15, RP - 31 - (blink % 0.8 < 0.4 ? 1 : 0));   // とどく途中
    const p = boxPrice(m);

  });
}
function drawCard(k, id) {

  if (k < 0) { toast(S.ovens.some(isDone) ? '焼けたオーブンをタップして取り出す' : 'オーブンがあいていない'); return; }
  if (bake(k, id)) { S.tips.bake = 1; save(); }
  else toast(RECIPE[id].filter(m => S.stock[m] < batchN()).map(m => MATS[m].name).join('と') + 'がたりない。入荷で注文しよう');
}
cv.addEventListener('click', e => {
  const b = cv.getBoundingClientRect();
  const x = (e.clientX - b.left) / b.width * W, yy = (e.clientY - b.top) / b.height * HH;
  if (view === 'uriba') {
    const y = yy - OFF, was = pop.kind;
    closePops();
    for (let i = 0; i < S.slots.length; i++) {
      const r = slotRect(i), s = S.slots[i];
      if (s.id && Math.abs(x - r.cx) <= (textW(pixNum(S.prices[s.id])) >> 1) + 5 && y >= r.plank - 1 && y < r.plank + 12) { openPricer(i); return; }
      if (!was && x >= r.x && x < r.x + r.w && y >= r.y && y < r.plank + 10) { openChooser(i); return; }
    }
  } else if (view === 'nyuka') {
    const RP = rackP();
    if (yy >= RP - 33 && yy < RP + 14) { const k = Math.floor((x - 2) / 25); if (k >= 0 && k < MORDER.length) tapOrder(MORDER[k]); return; }
    if (S.boxes.length && yy > FL() - 30) tapBox();
  } else if (view === 'chubo') {
    const CY = cardY();
    if (yy >= CY - 3 && yy < CY + CARD_H) { const k = ORDER.findIndex((id, j) => x >= pileX(j) && x < pileX(j) + CARD_W); if (k >= 0) { bakeNext(ORDER[k]); return; } }
    for (let k = 0; k < S.ovens.length; k++) {
      const X = ovenX(k), Y = ovenTop();
      if (x >= X - 2 && x < X + 28 && yy >= Y - 12 && yy < Y + 36) { tapOven(k); return; }
    }
  } else {
    if (checkout()) { S.tips.pay = 1; poke('reji'); }
  }
  showHint();
});

/* ---------- お店の帳面（係・設備を買う） ---------- */
const COIN_URL = big(COIN, 2);
function ledRow(id, icon) {
  const b = document.createElement('button');
  b.className = 'led'; b.type = 'button'; b.id = 'led-' + id;
  b.innerHTML = '<img class="ic" alt=""><span><span class="nm"></span><span class="cnt"></span><span class="ef"></span></span><span class="pr"><img alt=""><span></span></span>';
  b.querySelector('.ic').src = big(icon, 3);
  b.querySelector('.pr img').src = COIN_URL;
  return b;
}
const LED = {};
LED.mise = ledRow('mise', ICONS.mise);
LED.mise.classList.add('big');
LED.mise.addEventListener('click', expand);
$('ledList').appendChild(LED.mise);
for (const e of EQUIP) {
  LED[e.id] = ledRow(e.id, ICONS[e.id]);
  LED[e.id].addEventListener('click', () => buyEquip(e.id));
  $('ledList').appendChild(LED[e.id]);
}
const STAFF_IDS = ['shiire', 'pati', 'tenin', 'reji'];
const seen = id => S.eq[id] > 0 || STAFF_IDS.includes(id) || id === 'kanban' || S.total.revenue >= EQ[id].base * 0.4;
function setRow(b, name, cnt, eff, price, can, locked) {
  b.querySelector('.nm').textContent = name;
  b.querySelector('.cnt').textContent = cnt;
  b.querySelector('.ef').textContent = eff;
  b.querySelector('.pr span').textContent = price;
  b.disabled = !can;
  b.classList.toggle('locked', !!locked);
}
function refreshLedger() {
  const nextStage = STAGES[S.stage + 1];
  if (nextStage) {
    LED.mise.hidden = false;
    const lv = nextStage.tiers > STAGES[S.stage].tiers ? '棚' + nextStage.tiers + '段' : '棚1マス2倍';
    setRow(LED.mise, nextStage.name + 'にする', '', lv + '・お客さん×' + (nextStage.cust / STAGES[S.stage].cust).toFixed(1).replace('.0', ''), fmt(nextStage.cost), S.money >= nextStage.cost);
  } else LED.mise.hidden = true;
  let shownLocked = false;
  for (const e of EQUIP) {
    const b = LED[e.id], n = e.id === 'oven' ? 1 + S.eq.oven : S.eq[e.id];
    if (seen(e.id)) {
      b.hidden = false;
      const full = maxed(e.id);
      b.classList.toggle('maxed', full);
      setRow(b, e.name, n ? n + e.unit : '', full ? 'もう置けない' : S.eq[e.id] && e.eff2 ? e.eff2 : e.eff, full ? '' : fmt(equipCost(e.id)), !full && S.money >= equipCost(e.id));
    } else if (!shownLocked) {
      shownLocked = true; b.hidden = false;
      setRow(b, '？？？', '', 'もっと売ると出る', fmt(equipCost(e.id)), false, true);
    } else b.hidden = true;
  }
  $('ledTotal').textContent = 'これまで ' + fmt(S.total.sold) + 'こ・' + fmt(S.total.revenue) + '円' + (S.total.lost ? '・むだ ' + fmt(S.total.lost) + 'こ' : '');
}
function anyAffordable() {
  const ns = STAGES[S.stage + 1];
  if (ns && S.money >= ns.cost) return true;
  return EQUIP.some(e => seen(e.id) && !maxed(e.id) && S.money >= equipCost(e.id));
}
function buyEquip(id) {
  if (maxed(id)) return;
  const c = equipCost(id);
  if (S.money < c) return;
  S.money -= c; S.eq[id]++;
  if (T[id] != null && S.eq[id] === 1) T[id] = 1;
  syncOvens();
  hud(); refreshLedger(); save();
}
function expand() {
  const ns = STAGES[S.stage + 1];
  if (!ns || S.money < ns.cost) return;
  const oldBase = geo().base;
  S.money -= ns.cost; S.stage++;
  while (S.slots.length < ns.tiers * 3) S.slots.push({ id: null, n: 0 });
  fit();
  const dy = geo().base - oldBase;
  for (const c of cust) c.y += dy;
  fx = [];
  closeLedger(); hud(); save();
  toast(ns.name + 'になった');
}
function openLedger() { closePops(); refreshLedger(); $('ledger').hidden = false; syncFoot(); }
function closeLedger() { $('ledger').hidden = true; syncFoot(); }
$('shopBtn').addEventListener('click', () => { if ($('ledger').hidden) openLedger(); else closeLedger(); });
$('ledClose').addEventListener('click', closeLedger);

/* ---------- 動かす ---------- */
function start(data) {
  S = sanitize((data && data.state) || load());
  $('coinImg').src = big(COIN, 3);
  $('shopIcon').src = big(ICONS.mise, 2);
  syncOvens();
  fit();
  new ResizeObserver(fit).observe($('stage'));
  hud(); setView('uriba'); drawTabs();
  let last = performance.now(), slow = 0;
  const frame = now => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    blink += dt;
    if (document.visibilityState === 'visible' && $('ledger').hidden && !pop.kind) tick(dt);   // 帳面・お菓子をえらぶ・値段の吹き出しを開いている間は一時停止（11/4・11/5 しょーくん）
    slow += dt;
    if (slow > 0.3) {
      slow = 0;
      $('rateVal').textContent = fmt(rate());
      $('moneyVal').textContent = fmt(S.money);
      $('shopBtn').classList.toggle('can', anyAffordable());
      if (!$('ledger').hidden) refreshLedger();
      drawTabs(); showHint();
    }
    render();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  setInterval(save, 5000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
  window.addEventListener('pagehide', save);
}
window.claude?.hot?.snapshot?.(() => ({ state: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
