<!doctype html>
<!-- 自動で作るファイル・手で直さない（直すのは src/。node tools/build.mjs で作る） -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="夜は食材モンスターをカードで撃退、朝はひらめいたレシピでお菓子づくり、昼はお店で販売。ドット絵のお菓子屋さんゲーム。">
<meta name="theme-color" content="#1b1530">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>まぜまぜおかし屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 木造のおしゃれなお菓子屋さん（11/17 しょーくん「青は雰囲気とちがう」）：くるみ色の板・クリームの紙・いちご・ミント・キャラメル。
   夜・朝・昼はスマホ1画面に収める（.fit：絵がのびちぢみ、リストだけ中でスクロール）。お店という1つの世界なので明るいテーマに切りかえない */
:root{
  --wood:#4a2f20;      /* 床と壁の板（くるみ） */
  --wood-2:#5e3c28;
  --board:#7a5236;     /* 棚板・パネル */
  --board-2:#8d6142;
  --line:#a67a52;
  --cream:#fff6e8;     /* カードの紙 */
  --cream-2:#f6e4c8;
  --milk:#fff4e4;      /* 板の上の文字 */
  --milk-soft:#e6cfb2;
  --ink:#3a2318;
  --ink-soft:#7a5a4a;
  --strawberry:#e8607a;
  --mint:#6fc7a8;
  --caramel:#e09a48;
  --gold:#f4c24e;
  --ember:#ff8a3d;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;color:var(--milk);font-family:var(--font);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 64px),linear-gradient(var(--wood-2),var(--wood));background-color:var(--wood)}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 8px}
#top{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-block:2px 6px;padding:3px 12px;min-height:28px;border-radius:8px;
  background:linear-gradient(#9a6a45,#7a5236);box-shadow:inset 0 1px 0 rgba(255,230,200,.35),0 2px 0 rgba(0,0,0,.35)}
#top{display:none}
#dayLabel{font-size:14px;font-weight:700;color:var(--milk)}
#money{font-size:16px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 1px 0 rgba(0,0,0,.4)}
#screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#screen>section{position:relative;display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
#screen>section.fit{height:100%;gap:6px;padding-bottom:0}
h1,h2,h3{font-weight:700;margin:0;text-wrap:balance}
h2{font-size:16px;color:var(--gold)}
p{margin:0;line-height:1.5;font-size:13px}
small{font-size:11px;color:var(--milk-soft)}
b{font-weight:700;color:var(--gold)}
.muted{color:var(--milk-soft);font-size:12px}

/* ボタン：クリームの札と、キャラメルの大きなボタン */
button{font-family:var(--font);font-weight:700;font-size:15px;color:var(--ink);background:var(--cream);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.big{width:100%;flex:none;font-size:19px;padding:10px;background:linear-gradient(#ffb06a,var(--caramel) 60%,#c97a2e);color:#3a1c08;border-color:#3a1c08;box-shadow:0 4px 0 #3a1c08}
.sub{background:linear-gradient(#a8784e,#8a5e3c);color:var(--milk);border-color:#3a2318;box-shadow:0 3px 0 #2a170c}
.go{font-size:20px;padding:6px 18px;background:linear-gradient(#ffa25a,var(--ember) 55%,#e0642a);color:#3a1404;border-color:#3a1404;box-shadow:0 4px 0 #3a1404}
.go2{background:linear-gradient(#ff8fa3,var(--strawberry));color:#fff;border-color:#6a1a2a;box-shadow:0 3px 0 #6a1a2a;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.sq{width:44px;padding-inline:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.two>button{flex:1}
.hint{font-size:11px;color:var(--milk-soft)}
.panel{background:linear-gradient(var(--board-2),var(--board));border:2px solid #3a2318;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 1px 0 rgba(255,230,200,.3),0 3px 0 rgba(0,0,0,.3)}
.panel.tight{padding:8px 10px;gap:4px;flex:none}

/* 夜の舞台：ランプの光の木の厨房に、ほのか（右向き）とモンスター。火力でほのかの足もとが光る */
.stage{position:relative;flex:1 1 0;min-height:100px;max-height:calc((min(100vw, 460px) - 32px) * .46);border-radius:14px;overflow:hidden;border:3px solid #3a2318;box-shadow:0 3px 0 rgba(0,0,0,.35);
  background:radial-gradient(60% 70% at 20% 0%,rgba(255,200,120,.35),transparent 70%),repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 38px),linear-gradient(#7a5236,#5a3a26 70%,#4a2f20)}
.st-lamp{position:absolute;left:18%;top:0;width:14px;height:22%;background:linear-gradient(#2a170c,#2a170c) center/2px 100% no-repeat}
.st-lamp::after{content:"";position:absolute;left:50%;bottom:-6px;width:30px;height:16px;translate:-50% 0;border-radius:50% 50% 6px 6px;background:radial-gradient(circle at 50% 80%,#fff2c0,#f4c24e 45%,#a8642a)}
.st-win{position:absolute;left:46%;top:10%;width:20%;aspect-ratio:3/4;border-radius:40% 40% 6px 6px;border:4px solid #3a2318;
  background:radial-gradient(circle at 68% 30%,#fff3c4 0 9%,rgba(255,243,196,.3) 10%,transparent 22%),linear-gradient(#2a2440,#3a2a3a)}
.st-shelf{position:absolute;right:4%;top:14%;width:26%;height:5px;border-radius:2px;background:#3a2318;box-shadow:0 18px 0 #3a2318}
.st-floor{position:absolute;inset:auto 0 0;height:20%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 46px),linear-gradient(#8a5a3a,#6a4228);box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
.glow{position:absolute;left:0;bottom:0;width:44%;height:90%;pointer-events:none;mix-blend-mode:screen;opacity:.25;transition:opacity .25s,filter .25s;
  background:radial-gradient(ellipse 60% 55% at 42% 100%,#ff7a2a,rgba(255,90,30,.35) 45%,transparent 72%)}
.stage[data-z="0"] .glow{opacity:.12;filter:grayscale(.6)}
.stage[data-z="1"] .glow{opacity:.35}.stage[data-z="2"] .glow{opacity:.6}
.stage[data-z="3"] .glow{opacity:.9;filter:saturate(1.3)}.stage[data-z="4"] .glow{opacity:1;filter:saturate(1.6) brightness(1.2)}
.stage.sizzle .glow{animation:sizzle .6s ease-out}
@keyframes sizzle{30%{opacity:1;filter:saturate(1.8) brightness(1.5)}}
.chef{position:absolute;left:1%;bottom:4%;height:88%;max-width:38%;object-fit:contain;object-position:left bottom;transform-origin:center bottom;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));animation:breathe 3.2s ease-in-out infinite}
.chef.flip{transform:scaleX(-1)}
.chef:not(.hi){image-rendering:pixelated}
.chef.act{animation:act .3s ease-out}
@keyframes breathe{50%{translate:0 -2px}}
@keyframes act{40%{translate:6px -3px}}
.mon{position:absolute;right:2%;bottom:14%;width:24%;max-height:66%;object-fit:contain;object-position:bottom;image-rendering:pixelated;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));animation:bob 2.4s ease-in-out infinite}
.mon.hi{image-rendering:auto;width:29%}
.mon.hit{animation:hit .3s}
.mon.flee{animation:flee 1.4s ease-in forwards}
@keyframes bob{50%{translate:0 -4px}}
@keyframes hit{0%{filter:brightness(2.4) drop-shadow(0 6px 6px rgba(0,0,0,.45))}25%{translate:7px 0}50%{translate:-5px 0}75%{translate:3px 0}}
@keyframes flee{to{translate:130% -10%;rotate:20deg;opacity:0}}
.smoke{position:absolute;left:14%;top:18%;width:22%;aspect-ratio:1;border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(circle,rgba(160,150,150,.9),rgba(120,110,110,.4) 50%,transparent 70%)}
.smoke.on{animation:smoke 1s ease-out}
@keyframes smoke{0%{opacity:.95;scale:.6}100%{opacity:0;scale:1.6;translate:0 -30%}}
#floats{position:absolute;inset:0;pointer-events:none}
.ov-top,.ov-heat{position:absolute;left:8px;right:8px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-shadow:1px 1px 0 #2a170c,-1px 1px 0 #2a170c;pointer-events:none}
.ov-top{top:4px;justify-content:space-between}
.ov-top em{font-style:normal;color:var(--caramel)}
.ov-top .score b{font-size:22px;font-variant-numeric:tabular-nums}
.ov-heat{bottom:5px}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:14px;font-weight:700;color:var(--gold);text-shadow:1px 1px 0 #2a170c,-1px 1px 0 #2a170c;white-space:nowrap;pointer-events:none;animation:up .95s ease-out forwards;z-index:3}
.float.koge{color:#e0d6cc;top:-4px}
.stage .float.dmg{left:84%;top:18%;font-size:26px}
@keyframes up{from{opacity:1;translate:0 0}to{opacity:0;translate:0 -24px}}

/* 鉄板の火力（ほのかの固有特性）：弱火・中火・強火・火力マックスの4段 */
.heat-bar{flex:1;max-width:46%;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.heat-bar i{height:8px;background:rgba(42,23,12,.7);border-radius:3px}
.heat-bar i.on.h1{background:#f6d29a}.heat-bar i.on.h2{background:var(--ember)}.heat-bar i.on.h3{background:#e8402a}.heat-bar i.on.h4{background:#ff2a1a;box-shadow:0 0 6px #ff7a2a}
.heat-label{min-width:4.2em;color:#e0d6cc}
.heat-label.h1{color:#f6d29a}.heat-label.h2{color:var(--ember)}.heat-label.h3{color:#ff6a4a}.heat-label.h4{color:#ff4a2a}

/* ノルマ */
.quota{flex:none;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--milk-soft)}
.qbar{flex:1;height:7px;background:rgba(42,23,12,.6);border-radius:4px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(0,0,0,.4)}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--caramel),var(--gold));transition:width .25s}

/* カード（11/17 夜 しょーくん「カードがキモ。シャドバのカードをよく見て」）
   ふち＝レア度の金属（★1 銅・★2 銀・★3 金＋虹の箔）／絵の窓（地の色は種類）／名前のリボン／短い効果の紙／左上にコストの宝石／絵の右下に炎のダメージの紋章／右上に★
   文字や部品の大きさはカードの幅（cqw）で決まるので、手札・大きく見る・調理台のどれでも同じ形。地の色：生地＝クリーム・素材＝キャラメル・ふしぎ＝ミント・道具＝くるみ・フィールド＝炎・焦げ＝すみ・お菓子＝いちご・スペシャル＝金 */
.pc{--g1:#ffd7a0;--g2:#e08a3c;--rim:#e9b57c;--fr:linear-gradient(150deg,#f6cf9e 0%,#a8602a 24%,#f8dab0 46%,#7a3f18 72%,#d99a5a 100%);
  position:relative;display:block;width:100%;height:100%;min-width:0;container-type:inline-size;border-radius:8%/5.7%;isolation:isolate;color:var(--ink);
  background:var(--fr);box-shadow:0 0 0 1px #2a1408,inset 0 0 0 1.5px rgba(255,244,220,.45),inset 0 -2px 0 rgba(42,20,8,.35),0 4px 8px rgba(0,0,0,.45)}
.pc.s2{--rim:#ece6de;--fr:linear-gradient(150deg,#ffffff 0%,#bab4ac 24%,#f7f3ed 46%,#8a837a 72%,#e6e0d8 100%)}
.pc.s3{--rim:#ffe27c;--fr:linear-gradient(150deg,#fff8c8 0%,#d69c1e 22%,#fff3a8 44%,#a66c0a 70%,#ffe27c 100%);
  box-shadow:0 0 0 1px #2a1408,inset 0 0 0 1.5px rgba(255,252,225,.6),0 0 14px rgba(255,210,80,.85),0 4px 8px rgba(0,0,0,.45)}
.pc.k-d{--g1:#fff4d6;--g2:#d9a456}
.pc.k-m{--g1:#ffd9a6;--g2:#d97c34}
.pc.k-f{--g1:#d2f6e4;--g2:#3f9e7e}
.pc.k-t{--g1:#e2bf98;--g2:#5e3a20}
.pc.k-b{--g1:#ffd88e;--g2:#b23a18}
.pc.k-k{--g1:#8a6a5a;--g2:#24150e}
.pc.k-o{--g1:#ffd6df;--g2:#d4547a}
.pc.k-s{--g1:#fff4c0;--g2:#cf9420}
/* ふちのきらめき：★2はときどき光の帯、★3はいつも虹の箔（ふちの上だけ。絵の窓はその上にのる） */
.pc::after{content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 48%,transparent 60%);background-size:260% 100%}
.pc.s2::after{opacity:1;animation:shine 3.6s ease-in-out infinite}
.pc.s3::after{opacity:1;background:linear-gradient(115deg,transparent 12%,rgba(255,160,80,.6) 30%,rgba(255,255,210,.85) 44%,rgba(110,230,190,.55) 58%,rgba(220,140,255,.55) 70%,transparent 86%);background-size:260% 100%;animation:shine 2.4s linear infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
/* 絵の窓 */
.pc-win{position:absolute;left:5.5cqw;right:5.5cqw;top:5.5cqw;bottom:30%;z-index:1;border-radius:4.5cqw;overflow:hidden;
  background:radial-gradient(115% 90% at 50% 36%,var(--g1),var(--g2));box-shadow:inset 0 0 0 1px rgba(42,20,8,.75),inset 0 -8cqw 12cqw rgba(42,20,8,.28)}
.pc-win::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.6),transparent 52%),repeating-conic-gradient(from 0deg at 50% 44%,rgba(255,255,255,.1) 0 5deg,transparent 5deg 15deg)}
.pc-art{position:absolute;inset:5% 5% 7%;display:flex;align-items:center;justify-content:center}
.pc-art img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 1.5cqw 1.5cqw rgba(60,25,5,.5))}
.pc-art img:not(.hi){width:58%;height:auto}
.pc-art img.hi{image-rendering:auto}
.pc-shine{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 45%,transparent 60%);background-size:250% 100%}
.pc.s2 .pc-shine{opacity:1;animation:shine 3.6s ease-in-out infinite}
.pc.s3 .pc-shine{opacity:.9;background:linear-gradient(115deg,transparent 18%,rgba(255,170,90,.4) 34%,rgba(255,250,200,.45) 50%,rgba(210,140,255,.4) 64%,transparent 80%);background-size:250% 100%;mix-blend-mode:overlay;animation:shine 2.4s linear infinite}
/* 名前のリボン（両はしが切れこんだ帯・上下に金の線） */
.pc-name{position:absolute;left:2.5cqw;right:2.5cqw;top:64.5%;height:11%;z-index:3;display:flex;align-items:center;justify-content:center;padding:0 5.5cqw;
  background:linear-gradient(var(--rim) 0 1px,transparent 1px calc(100% - 1px),var(--rim) calc(100% - 1px)),linear-gradient(#6a3c22,#3a1e10 55%,#2a1309);
  clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%)}
.pc-name span{min-width:0;font-size:9.8cqw;letter-spacing:-.02em;font-weight:900;line-height:1;color:#fff4dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #000}
/* 効果の紙（2行まで） */
.pc-text{position:absolute;left:5.5cqw;right:5.5cqw;top:77%;bottom:4.2%;z-index:2;margin:0;display:flex;align-items:center;justify-content:center;padding:0 3cqw;border-radius:3.5cqw;
  background:linear-gradient(#fffaf0,#f0d9b6);box-shadow:inset 0 0 0 1px rgba(90,50,20,.4),inset 0 1.5cqw 0 rgba(255,255,255,.6)}
.pc-text span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:9cqw;font-weight:900;line-height:1.16;text-align:center;color:#4a2414}
.pc-text.none span{font-size:8cqw;font-weight:700;color:#9a7458}
/* コストの宝石（ひし形のキャンディ） */
.pc-cost{position:absolute;left:-2cqw;top:-2cqw;z-index:5;width:26cqw;height:26cqw;display:grid;place-items:center;font-style:normal;font-size:13.5cqw;font-weight:900;line-height:1;color:#fff;-webkit-text-stroke:1cqw #3a1408;paint-order:stroke fill}
.pc-cost::before{content:"";position:absolute;inset:3.5cqw;z-index:-1;transform:rotate(45deg);border-radius:4cqw;background:radial-gradient(circle at 35% 30%,#fff7cc,#f4c24e 45%,#b0700c);box-shadow:0 0 0 1.2cqw #4a2408,0 0 0 2cqw #ffe9b0,0 2px 3px rgba(0,0,0,.45)}
.pc-cost.txt{left:2.5cqw;top:2.5cqw;width:auto;height:15cqw;padding:0 3.5cqw;font-size:8.5cqw;-webkit-text-stroke:.8cqw #3a1408}
.pc-cost.txt::before{inset:0;transform:none;border-radius:8cqw}
.pc:not(.np) .pc-cost{top:25cqw;width:22cqw;height:22cqw;font-size:11.5cqw}
.pc:not(.np) .pc-cost.txt{top:28cqw;width:auto;height:13cqw;font-size:7.5cqw}
/* ★（右上） */
.pc-star{position:absolute;left:0;right:0;top:1.5cqw;z-index:5;text-align:center;font-size:12cqw;line-height:1;letter-spacing:-1.5cqw;color:#ffe066;-webkit-text-stroke:.9cqw #7a4204;paint-order:stroke fill;text-shadow:0 0 2.5cqw rgba(255,220,90,.95)}
/* ダメージの紋章（炎の丸・ふちはレア度の色） */
/* ダメージの紋章：左上に炎の形（しずくを上向きに。右上は手札の重なりでかくれるので左上・11/17 しょーくん）。数字は炎のふくらみのまんなか。コストの宝石はその下へ */
.pc-pow{position:absolute;left:-2cqw;top:-2cqw;z-index:5;width:28cqw;height:28cqw;display:grid;place-items:center;padding-top:14%;isolation:isolate;
  font-size:13cqw;line-height:1;font-weight:900;color:#fff;-webkit-text-stroke:1.1cqw #4a1404;paint-order:stroke fill}
.pc-pow::before{content:"";position:absolute;left:15%;top:24%;z-index:-1;width:70%;height:70%;border-radius:50% 0 50% 50%;transform:rotate(-45deg);
  background:radial-gradient(circle at 62% 38%,#fff2b8 0,#ffc04a 26%,#ff7a24 52%,#c9301a 80%,#7a1a08);box-shadow:0 0 0 1.1cqw #3a1408,0 0 0 2.2cqw var(--rim),.8cqw 1.4cqw 2.4cqw rgba(0,0,0,.5)}
.pc-pow.l4{font-size:10cqw}.pc-pow.l5{font-size:8.5cqw}
.pc.fire{animation:fire .38s}
.pc.born{animation:born .6s ease-out}
@keyframes fire{50%{transform:translateY(-6px) scale(1.07);filter:brightness(1.25) drop-shadow(0 0 8px var(--ember))}}
@keyframes born{0%{transform:scale(.4) rotate(-10deg);filter:brightness(2.2)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
/* 手札などの小さいカードは、重なっても見えるように左よせ（名前・効果）。大きく見るカードはまんなか */
.pc.mini .pc-name{justify-content:flex-start;padding-left:6cqw}
.pc.mini .pc-text{justify-content:flex-start}
.pc.mini .pc-text span{text-align:left}
/* 大きなカード */
.pc.huge{width:min(60vw,240px);height:auto;aspect-ratio:5/7;flex:none}
.ci-name{font-size:15px;font-weight:900;text-align:center;color:var(--ink)}

/* 調理台：左にフィールドの「場」、そのあとにアイコンのタイル6つ（左から順に発動）を1行に。木のカウンターの上 */
.night{--hh:clamp(112px,22vh,168px)}
.tiles{flex:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:9px 8px 8px;border-radius:12px;
  background:linear-gradient(#a8784e,#7a5236);box-shadow:inset 0 2px 0 rgba(255,230,200,.35),inset 0 -3px 0 rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.35)}
.tslot{position:relative;min-width:0;aspect-ratio:5/7;padding:0;border:none;border-radius:10px;background:rgba(42,23,12,.32);box-shadow:inset 0 2px 5px rgba(0,0,0,.45)}
.tslot::after{content:"";position:absolute;inset:30% 22%;border-radius:50%;border:2px dashed rgba(255,240,220,.26);pointer-events:none}
.tslot:has(.pc){background:transparent;box-shadow:none}
.tslot:has(.pc)::after{display:none}
.fslot{background:rgba(90,42,4,.35);box-shadow:inset 0 0 0 1.5px rgba(246,198,90,.55),inset 0 2px 5px rgba(0,0,0,.45)}
.fslot::after{inset:14%;border-radius:8px;border-color:rgba(246,198,90,.45)}
.fslot .ord{color:#3a1c08;background:var(--gold)}
.tslot .ord{position:absolute;left:-5px;top:-6px;z-index:4;width:16px;height:16px;display:grid;place-items:center;border-radius:50%;font-style:normal;font-size:9.5px;font-weight:900;color:#3a1c08;background:var(--cream);box-shadow:0 0 0 1.5px #3a2318}
.tslot.sel .pc{outline:3px solid var(--gold);outline-offset:2px}
.tslot.can .pc{animation:canmix .9s ease-in-out infinite alternate}
@keyframes canmix{from{box-shadow:0 0 0 1px #2a1408,0 0 0 4px rgba(111,199,168,.95)}to{box-shadow:0 0 0 1px #2a1408,0 0 14px 6px rgba(111,199,168,.55)}}
.tslot:active .pc{transform:scale(.94)}
/* タップで置く・まぜる：えらんだカードの行き先を光らせる（put＝置く・can＝まぜる）。何もえらんでいないときは、まぜられるカードに「+」と「まぜ」の目じるし */
.tslot.sel .pc{transform:translateY(-4px)}
.tslot.put{background:rgba(244,194,78,.2);box-shadow:inset 0 0 0 2px rgba(255,214,120,.9)}
.tslot.put::after{border-color:rgba(255,226,160,.95);animation:putpulse .8s ease-in-out infinite alternate}
@keyframes putpulse{from{transform:scale(.8);opacity:.55}to{transform:scale(1.05);opacity:1}}
.tslot.can::before{content:"まぜる";position:absolute;left:50%;bottom:-8px;z-index:5;transform:translateX(-50%);padding:1px 5px;border-radius:7px;font-size:9px;font-weight:900;line-height:1.3;color:#103a2c;background:#8fe0c0;white-space:nowrap;box-shadow:0 0 0 1.5px #1e4a3a;pointer-events:none}
.mx-dot{position:absolute;right:-5px;bottom:-6px;z-index:4;width:16px;height:16px;display:grid;place-items:center;border-radius:50%;font-style:normal;font-size:13px;font-weight:900;line-height:1;color:#103a2c;background:#8fe0c0;box-shadow:0 0 0 1.5px #1e4a3a;animation:dotbob .8s ease-in-out infinite alternate;pointer-events:none}
@keyframes dotbob{to{transform:translateY(-2px)}}
.mixmark{position:absolute;right:4%;top:-5px;z-index:4;padding:1px 6px;border-radius:8px;font-style:normal;font-size:10px;font-weight:900;line-height:1.35;color:#103a2c;background:#8fe0c0;box-shadow:0 0 0 1.5px #1e4a3a,0 2px 0 rgba(0,0,0,.3);pointer-events:none;animation:dotbob .8s ease-in-out infinite alternate}
.handcard.can .pc{animation:canmix .9s ease-in-out infinite alternate}
.handcard.can::after{content:"まぜる";position:absolute;left:50%;top:-8px;z-index:5;transform:translateX(-50%);padding:1px 6px;border-radius:7px;font-size:10px;font-weight:900;line-height:1.35;color:#103a2c;background:#8fe0c0;white-space:nowrap;box-shadow:0 0 0 1.5px #1e4a3a;pointer-events:none}
/* 調理台のタイル：名前と効果の紙はなし。絵の窓を大きく、数字の紋章は右上、★は左下 */
.pc.tile{transition:filter .2s}
.pc.tile .pc-win{left:6cqw;right:6cqw;top:6cqw;bottom:6cqw;border-radius:6cqw}
.pc.tile .pc-art{inset:4%}
.pc.tile .pc-pow{top:-2cqw;left:auto;right:-2cqw;width:42cqw;height:42cqw;font-size:20cqw;-webkit-text-stroke:1.6cqw #4a1404}
.pc.tile .pc-pow.l4{font-size:16cqw}.pc.tile .pc-pow.l5{font-size:13cqw}
.pc.tile .pc-star{left:6cqw;right:auto;top:auto;bottom:7cqw;font-size:17cqw;text-align:left}
.pc.tile:has(.cook) .pc-star{bottom:17cqw}
/* 焼き加減のメーター（9段階）：生は白・半焼けは黄・こんがりはオレンジ・サイコーは金に光る */
.cook{position:absolute;left:9cqw;right:9cqw;bottom:8cqw;z-index:4;height:max(5px,7cqw);border-radius:3px;background:rgba(42,23,12,.6);overflow:hidden;
  box-shadow:0 0 0 1px rgba(42,23,12,.8)}
.cook::after{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--c) / 9 * 100%);background:repeating-linear-gradient(90deg,var(--cc) 0 calc(100% / var(--c) - 1px),transparent 0 calc(100% / var(--c)));transition:width .3s}
.cook.c0{--cc:#fff6e8}.cook.c1{--cc:#ffd75e}.cook.c2{--cc:#f08a3c}.cook.c3{--cc:#ffe680}
.pc.tile.best{box-shadow:0 0 0 1px #2a1408,0 0 0 3px #ffe680,0 0 12px 3px rgba(255,214,90,.9);animation:bestglow 1.2s ease-in-out infinite alternate}
@keyframes bestglow{to{box-shadow:0 0 0 1px #2a1408,0 0 0 3px #fff3c0,0 0 18px 5px rgba(255,214,90,1)}}
.pc.sear{animation:sear .5s ease-out}
@keyframes sear{0%{filter:brightness(1)}30%{filter:brightness(1.9) saturate(1.6);transform:scale(1.12)}100%{filter:none}}
/* 発動：タイルがコンと跳ねて光る。発動しおわったタイルは少し暗く */
.tslot.now{z-index:2}
.tslot.now .pc{transform:translateY(-3px) scale(1.08);box-shadow:0 0 0 1px #2a1408,0 0 0 3px var(--rim),0 0 16px 4px var(--ember)}
.tslot.now::before{content:"";position:absolute;inset:-5px;z-index:3;border-radius:14px;border:2.5px solid #ffe2a0;pointer-events:none;animation:ring .5s ease-out forwards}
.tslot.done:not(.now) .pc{filter:saturate(.5) brightness(.75)}
.pc.kon{animation:kon .42s cubic-bezier(.3,1.5,.5,1)}
@keyframes kon{0%{transform:none}35%{transform:translateY(-11px) scale(1.22) rotate(-5deg)}65%{transform:translateY(1px) scale(.95)}100%{transform:translateY(-3px) scale(1.08)}}
@keyframes ring{from{opacity:1;scale:.8}to{opacity:0;scale:1.4}}

/* バトルの間だけ出る説明：タイル行のすぐ下、手札の上にかぶせる。発動したカードの名前・効果・火加減と、大きなダメージ */
.handwrap{position:relative;flex:none}
.callout{position:absolute;left:0;right:0;top:2px;z-index:6;height:52px;border-radius:12px;isolation:isolate;background:var(--cream);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.35)}
.callout:empty{display:none}
.night .hand{transition:opacity .25s,filter .25s}
.night.busy .hand{opacity:.35;filter:saturate(.5)}
.co-ev{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 12px 0 7px;border-radius:12px}
.co-ev::before{content:"";position:absolute;left:var(--x);top:-8px;translate:-50% 0;border:8px solid transparent;border-top:0;border-bottom-color:var(--cream)}
.co-ev.burnt{background:#d9cfc5}.co-ev.burnt::before{border-bottom-color:#d9cfc5}
.co-ic.pc{flex:none;width:40px;height:40px;border-radius:9px}
.co-ic img{position:absolute;inset:7%;width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(60,25,5,.4))}
.co-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.co-name{font-size:13.5px;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-name em{font-style:normal;font-size:10px;color:#fff;background:var(--strawberry);padding:1px 6px;border-radius:8px;margin-right:4px;vertical-align:1px}
.co-chips{display:flex;gap:4px;overflow:hidden}
.co-chips span{flex:none;font-size:10px;font-weight:700;line-height:1.5;padding:0 7px;border-radius:8px;background:var(--cream-2);color:#8a3a10;white-space:nowrap}
.co-chips .co-z{color:#fff;background:#c08a4a}
.co-z.h1{background:#d8a050!important}.co-z.h2{background:var(--ember)!important}.co-z.h3{background:#e0402a!important}.co-z.h4{background:#c01a10!important}
.co-z.c0{background:#b8a088!important}.co-z.c1{background:#d8a020!important}.co-z.c2{background:#e0782a!important}.co-z.c3,.co-z.best{background:linear-gradient(#ffd75e,#e0a020)!important;color:#5a2a04!important}
.co-z.koge{background:#4a3a32!important}
.co-dmg{position:relative;flex:none;min-width:60px;text-align:right;font-size:30px;line-height:1;font-weight:900;color:#ffe680;-webkit-text-stroke:3px #7a2a04;paint-order:stroke fill;text-shadow:0 3px 0 #5a2004;font-variant-numeric:tabular-nums}
.co-dmg.hot{font-size:36px;color:#fff1a8;text-shadow:0 3px 0 #5a2004,0 0 14px rgba(255,140,40,.9)}
.co-dmg.koge{font-size:17px;color:#f0e8e0;-webkit-text-stroke:3px #3a2a22;text-shadow:none}
.co-dmg.soft{font-size:15px;color:var(--ink);-webkit-text-stroke:0;text-shadow:none}
.co-dmg::before{content:"";position:absolute;right:-6px;top:50%;width:96px;height:96px;margin-top:-48px;z-index:-1;border-radius:50%;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,170,50,.75) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%)}
.co-dmg.soft::before,.co-dmg.koge::before{display:none}
.callout.pop{animation:coflash .45s ease-out}
.callout.pop .co-ev{animation:coin .2s ease-out}
.callout.pop .co-dmg{animation:dmgpop .5s cubic-bezier(.2,1.7,.4,1)}
.callout.pop .co-dmg::before{animation:burst .65s ease-out}
@keyframes coflash{0%{box-shadow:0 3px 0 rgba(0,0,0,.35),0 0 0 3px #ffe2a0,0 0 22px 6px rgba(255,138,61,.8)}}
@keyframes coin{from{opacity:0;transform:translateY(-5px)}}
@keyframes dmgpop{0%{transform:scale(2.7) rotate(-10deg);opacity:0}35%{opacity:1}100%{transform:none}}
@keyframes burst{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.45) rotate(70deg)}}

/* 手札（仕入れ）：扇形に重ねる。枚数で幅を決めて、はしのカードも画面に収める */
.hand{position:relative;flex:none;height:var(--hh);display:flex;justify-content:center;align-items:flex-end;padding:10px 12px 0}
.hand-lbl{position:absolute;left:0;top:0;z-index:5;font-size:11px;font-weight:700;color:#3a1c08;background:var(--gold);padding:2px 9px;border-radius:9px;box-shadow:0 2px 0 #5a2a04}
.handcard{--mid:calc((var(--n) - 1) / 2);--d:calc(var(--k) - var(--mid));position:relative;flex:none;width:min(calc((100% - 6px) / var(--n) + 6px),calc((var(--hh) - 16px) * .72),118px);aspect-ratio:5/7;height:auto;margin:0 -3px;padding:0;border:none;background:transparent;box-shadow:none;
  transform:translateY(calc(var(--d) * var(--d) * 3px)) rotate(calc(var(--d) * 3deg));transform-origin:50% 100%;transition:transform .15s}
.handcard.gone{visibility:hidden}
.handcard.sel,.handcard:active{transform:translateY(-10px) scale(1.05);z-index:3}

/* ★3 のカットイン：ななめの金の帯・ほのかが左から・カードが右から・名前を大きく（--cd がかかる時間） */
.cutin{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden;display:grid;place-items:center;animation:cidim var(--cd) ease-out forwards}
.ci-flash{position:absolute;inset:0;background:#fff6dc;opacity:0;animation:ciflash var(--cd) ease-out forwards}
.ci-band{position:relative;width:100%;height:clamp(150px,30vh,230px);transform:skewY(-8deg) scaleY(0);animation:ciband var(--cd) cubic-bezier(.2,.9,.3,1) forwards;
  background:linear-gradient(90deg,#5a1a04,#d8502a 16%,#ffb048 50%,#d8502a 84%,#5a1a04);box-shadow:0 0 0 3px #ffe7a0,0 0 0 6px #3a1404,0 0 50px rgba(255,160,60,.85)}
.ci-lines{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.32) 0 2px,transparent 2px 23px,rgba(255,240,200,.18) 23px 26px,transparent 26px 61px);animation:cilines .35s linear infinite}
.ci-in{position:absolute;inset:0;max-width:460px;margin:0 auto;transform:skewY(8deg)}
.ci-hero{position:absolute;left:0;bottom:-8%;height:132%;max-width:48%;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 4px 10px rgba(60,10,0,.7));animation:cihero var(--cd) cubic-bezier(.2,.9,.3,1) forwards}
.ci-hero.flip{scale:-1 1}
.ci-card.pc{position:absolute;right:7%;top:6%;width:30%;height:auto;aspect-ratio:1;border-radius:16px;animation:cicard var(--cd) cubic-bezier(.3,1.5,.5,1) forwards}
.ci-card img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(60,25,5,.5))}
.ci-title{position:absolute;right:4%;bottom:6%;max-width:66%;display:flex;flex-direction:column;align-items:flex-end;text-align:right;line-height:1.1;animation:cititle var(--cd) ease-out forwards}
.ci-title small{font-size:13px;font-weight:900;color:#fff;-webkit-text-stroke:3px #5a1a04;paint-order:stroke fill}
.ci-title span{font-size:clamp(20px,6.4vw,28px);font-weight:900;color:#fff1a8;-webkit-text-stroke:4px #5a1a04;paint-order:stroke fill;text-shadow:0 3px 0 #3a1004,0 0 16px rgba(255,200,80,.9)}
@keyframes cidim{0%{background:rgba(24,10,4,0);opacity:1}12%,82%{background:rgba(24,10,4,.6);opacity:1}100%{background:rgba(24,10,4,0);opacity:0}}
@keyframes ciflash{0%{opacity:.95}16%,100%{opacity:0}}
@keyframes ciband{0%{transform:skewY(-8deg) scaleY(0)}12%{transform:skewY(-8deg) scaleY(1.12)}20%,84%{transform:skewY(-8deg) scaleY(1)}100%{transform:skewY(-8deg) scaleY(0)}}
@keyframes cilines{to{background-position:-61px 0}}
@keyframes cihero{0%,8%{translate:-115% 0}28%{translate:3% 0}84%{translate:0 0}100%{translate:-20% 0}}
@keyframes cicard{0%,14%{transform:scale(0) rotate(-40deg)}34%{transform:scale(1.2) rotate(6deg)}46%,100%{transform:scale(1) rotate(0)}}
@keyframes cititle{0%,22%{opacity:0;translate:40px 0}36%,100%{opacity:1;translate:0 0}}

/* 下のボタン列：コインの丸・入れかえ・大きな「焼く！」 */
.bar{position:relative;flex:none;display:flex;align-items:center;gap:8px;min-height:58px}
.orb{flex:none;width:52px;height:52px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;
  background:radial-gradient(circle at 35% 30%,#fff7c8,var(--gold) 50%,#b97a12);box-shadow:0 0 0 2.5px #5a2a04,0 3px 0 #3a1c08}
.orb i{font-style:normal;font-size:9px;font-weight:700;color:#5a2a04}
.orb b{font-size:20px;font-weight:900;color:#3a1c08}
.bar .bar-hint{flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--milk)}
.bar .bar-hint{font-size:11.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bar .bar-hint.free{font-size:12.5px;line-height:1.4}.bar .bar-hint.free b{margin:0 2px;font-size:20px;line-height:1;color:var(--gold)}
.bar .sq{flex:none;width:44px;padding-inline:0}
.bar .pill{flex:none;white-space:nowrap}
.pill{border-radius:999px;padding:9px 16px}
.pill small{font-size:11px;opacity:.85}
.bake{margin-left:auto;min-width:46%;height:52px;border-radius:999px;font-size:22px;letter-spacing:2px;color:#3a1404;border:2.5px solid #3a1404;
  background:linear-gradient(#ffc06a,var(--ember) 55%,#e0582a);box-shadow:0 4px 0 #3a1404,0 0 18px rgba(255,138,61,.45)}

/* タップで大きく見る画面：カード・説明の紙・ボタン（親指の届く下に） */
.viewer{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:rgba(24,12,6,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadein .15s ease-out}
.viewer.soft{background:rgba(24,12,6,.5)}
.vbox{width:min(100%,340px);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0;animation:popin .22s ease-out}
.cinfo{width:min(100%,260px);min-height:0;overflow:auto;padding:7px 12px;border-radius:12px;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;gap:5px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.ci-type{font-size:12px;font-weight:700;color:var(--ink-soft);text-align:center}
.ci-chips{display:flex;flex-wrap:wrap;gap:4px}
.ci-chips span{font-size:11px;font-weight:700;padding:3px 8px;border-radius:9px;background:var(--cream-2);color:#8a3a10}
.ci-fx{font-size:14px;font-weight:700;line-height:1.45}
.ci-dmg{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:700;color:#8a3a10}.ci-dmg b{color:#c4501a;font-size:17px}
.ci-dmg i{width:11px;height:11px;margin:3px 2px 0;border-radius:50% 0 50% 50%;transform:rotate(-45deg);background:radial-gradient(circle at 62% 38%,#ffd36a,#ff7a24 55%,#c9301a)}
.ci-sub{margin-top:-3px;font-size:11px;color:var(--ink-soft);text-align:center}
.cinfo .ci-chips{justify-content:center}.cinfo .ci-chips span{font-size:12px;line-height:1.35}
.ci-cook{font-size:12px;font-weight:700;color:#8a3a10;text-align:center}.ci-cook b{color:#c4501a;font-size:15px}
.ci-recipe{font-size:11px;line-height:1.4;color:var(--ink-soft);text-align:center}
.ci-flavor{font-size:11.5px;font-style:italic;color:var(--ink-soft);line-height:1.45}
.vbtns{width:100%;display:flex;gap:8px;justify-content:center}
.vbtns .pill{flex:1}
.vbtns .sq{flex:none;width:48px;padding-inline:0}
.vhint{font-size:11px;color:var(--milk-soft);text-align:center}
.vbox{position:relative}
.vclose{position:absolute;right:-2px;top:-2px;z-index:5;width:36px;height:36px;padding:0;border-radius:50%;font-size:20px;line-height:1;background:var(--cream);box-shadow:0 2px 0 var(--ink)}
.vbox.result{width:min(78vw,300px);padding:16px;border-radius:16px;background:linear-gradient(var(--board-2),var(--board));border:2px solid #3a2318;box-shadow:0 4px 0 rgba(0,0,0,.35);text-align:center}
.r-round{font-size:13px;color:var(--milk-soft)}
.r-num{font-size:40px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;-webkit-text-stroke:2px #2a170c;paint-order:stroke fill}
.result.ok .r-msg{color:var(--mint)}
.r-msg{font-size:15px;font-weight:700}
.r-gain{font-size:12px;color:var(--milk)}
@keyframes fadein{from{opacity:0}}
@keyframes popin{from{scale:.85;opacity:0}}

/* フィールドをえらぶ */

/* 夜の結果 */
.end{align-items:center;text-align:center;flex:none}
.end.win h2{color:var(--ember)}
.bignum{font-size:32px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.got{display:flex;align-items:center;gap:8px;font-size:15px}
.got img{width:36px;height:36px;object-fit:contain;image-rendering:pixelated}

/* 朝 */
.stockline{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.stockline .fus{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.stockline img,.rm img{width:22px;height:22px;object-fit:contain;image-rendering:pixelated;vertical-align:middle}
.recipes{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 2px 6px}
.recipe{flex:none;display:flex;align-items:center;gap:10px;text-align:left;padding:6px 10px;font-weight:500}
.candy{width:42px;height:42px;object-fit:contain;image-rendering:pixelated;flex:none}
.rbody{display:flex;flex-direction:column;gap:2px;min-width:0}
.rn{font-size:14px;font-weight:700}
.rn em{font-style:normal;font-size:10px;color:#fff;background:var(--strawberry);border-radius:3px;padding:0 4px;margin-left:6px}
.rm{font-size:12px;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.rneed{font-size:11px;color:#2f8a6a}
.tag{font-size:10px;border:1px solid currentColor;border-radius:3px;padding:0 4px;color:#b8541c}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.made{flex:none;flex-direction:row;align-items:flex-start;gap:10px;border-color:var(--gold);padding:8px 10px}
.made .candy{width:54px;height:54px}
.made .tag{color:var(--gold)}

/* 昼 */
.scene-wrap{position:relative;flex:1 1 0;min-height:72px;max-height:calc((min(100vw, 460px) - 32px) / 2);border:3px solid #3a2318;border-radius:12px;overflow:hidden;background:#fbe3d4}
.scene-wrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.shelf{flex:none;display:flex;gap:10px;align-items:flex-start;font-size:12px}
.shelf .lbl{color:var(--milk-soft);flex:none}
#shelfList{display:flex;gap:4px 12px;flex-wrap:wrap}
#shelfList .item{display:flex;align-items:center;gap:4px}
#shelfList img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated}
.log{flex:1;min-height:48px;list-style:none;margin:0;padding:6px 10px;background:rgba(42,23,12,.45);border:2px solid #3a2318;border-radius:10px;display:flex;flex-direction:column;gap:3px;font-size:12px;overflow-y:auto}
.log li{flex:none}
.log li.love{color:var(--gold)}
.log li.no{color:var(--milk-soft)}

/* まとめ */
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:13px}
dt{color:var(--milk-soft)}
dd{margin:0;min-width:0;line-height:1.45}
dd.gold{color:var(--gold);font-size:17px;font-weight:700}
.heartlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.heartlist li{display:flex;gap:10px;align-items:center}
.heartlist li>span:first-child{width:7em}
.hearts{color:var(--strawberry);letter-spacing:2px}
.hearts i{font-style:normal;color:rgba(42,23,12,.5)}
.heartlist em{font-style:normal;font-size:11px;color:var(--gold)}

/* タイトル */
.title{align-items:center;text-align:center;padding-top:6px}
.title h1{font-size:38px;line-height:1.15;color:var(--caramel);text-shadow:0 3px 0 #2a170c}
.hero{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:min(46vh,320px)}
.hero img{max-height:100%;max-width:48%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.howto{list-style:none;margin:0;padding:10px 12px;background:linear-gradient(var(--board-2),var(--board));border:2px solid #3a2318;border-radius:12px;display:flex;flex-direction:column;gap:6px;text-align:left;font-size:13px;line-height:1.5}

/* お知らせ */
#toast{position:absolute;left:50%;top:calc(110px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--cream);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:7px 14px;font-size:14px;font-weight:700;box-shadow:0 3px 0 var(--ink);z-index:20;pointer-events:none;text-align:center}
#toast.show{animation:pop .2s ease-out}
@keyframes pop{from{transform:translate(-50%,-8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* まぜる？の画面：2枚＋できるカード */
.vbox.mixbox{width:min(92vw,340px);padding:14px 12px;border-radius:16px;background:linear-gradient(var(--board-2),var(--board));border:2px solid #3a2318;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.mx-ttl{margin:0;font-size:16px;font-weight:900;color:var(--gold)}
.mx-row{width:100%;display:flex;align-items:center;justify-content:center;gap:4px}
.mx-in{width:24%;aspect-ratio:5/7}
.mx-out{width:31%;aspect-ratio:5/7;border-radius:12px;animation:mxglow 1s ease-in-out infinite alternate}
@keyframes mxglow{from{box-shadow:0 0 0 2px var(--gold)}to{box-shadow:0 0 18px 5px rgba(244,194,78,.7)}}
.mx-op{flex:none;font-size:18px;font-weight:900;color:var(--milk)}
.mx-name{margin:0;font-size:15px;font-weight:900;color:var(--milk);text-align:center}
.mx-fx{margin:0;font-size:12px;line-height:1.45;color:var(--milk-soft);text-align:center}
.mx-flash{margin:0;font-size:12px;font-weight:900;color:#3a1c08;background:var(--gold);padding:3px 10px;border-radius:9px}

/* まぜる演出：まわりが暗くなる → 2枚がシュッと飛び出して、まんなか（--cy）で止まって（ヒットストップ）ガキーン → 火花・光の輪・光の線 → できたカードがくるっと出て、名前の札 → マスへ。.r2/.r3 で★の色 */
.mixfx{position:fixed;inset:0;z-index:38;pointer-events:none;overflow:hidden;--glow:255,236,190;--ray:255,240,205}
.mixfx.r3{--glow:255,200,80;--ray:255,214,110}
.mf-dim{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% var(--cy),rgba(60,24,6,.3) 0,rgba(22,9,3,.78) 72%);animation:mfin .22s ease-out forwards}
.mixfx.land .mf-dim,.mixfx.hit.land .mf-burst,.mixfx.hit.land .mf-name,.mixfx.hit.land .mf-tw{animation:mfout .26s ease-in forwards}
@keyframes mfin{from{opacity:0}to{opacity:1}}
@keyframes mfout{from{opacity:1}to{opacity:0}}
.mf-lines{position:absolute;left:50%;top:var(--cy);width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;opacity:0;
  background:repeating-conic-gradient(rgba(255,240,210,0) 0 4.5deg,rgba(255,240,210,.32) 4.5deg 5.5deg);
  -webkit-mask:radial-gradient(circle,transparent 0 9%,#000 26%);mask:radial-gradient(circle,transparent 0 9%,#000 26%);animation:mflines .45s ease-in forwards}
@keyframes mflines{from{opacity:0;transform:scale(1.5) rotate(-6deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.mixfx.hit .mf-lines{animation:mfout .18s ease-out forwards}
.mf-card{position:fixed;aspect-ratio:5/7;border-radius:12px;will-change:transform;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55))}
.mf-card .pc{width:100%;height:100%}
.mf-card.ghost{filter:blur(1.5px) brightness(1.6)}
.mf-card.g1{opacity:.45}
.mf-card.g2{opacity:.22}
.mixfx.touch .mf-card:not(.ghost):not(.mf-res){filter:brightness(1.7) drop-shadow(0 0 14px rgba(255,244,200,.95))}
.mf-res{z-index:1;overflow:hidden;box-shadow:0 0 0 3px rgb(var(--glow)),0 0 44px 16px rgba(var(--glow),.8)}
.mixfx.r3 .mf-res{box-shadow:0 0 0 3px #ffe08a,0 0 0 6px rgba(255,160,60,.7),0 0 60px 22px rgba(255,190,70,.85)}
.mf-shine{position:absolute;inset:-20%;z-index:3;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.85) 48%,rgba(255,250,225,.4) 54%,transparent 62%);transform:translateX(-120%);animation:mfshine .7s .32s ease-in-out forwards}
@keyframes mfshine{to{transform:translateX(120%)}}
.mf-flash{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% var(--cy),#fff 0,#fff 14%,rgba(255,244,210,.9) 30%,rgba(255,200,120,.35) 55%,rgba(255,200,120,0) 85%)}
.mixfx.hit .mf-flash{animation:mfflash .55s ease-out}
@keyframes mfflash{0%,12%{opacity:1}100%{opacity:0}}
.mf-ring{position:absolute;left:50%;top:var(--cy);width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:7px solid #fff6d0;opacity:0}
.mf-ring.b{border-color:rgb(var(--ray));animation-delay:.1s!important}
.mixfx.hit .mf-ring{animation:mfring .55s ease-out forwards}
@keyframes mfring{from{transform:scale(.3);opacity:1}to{transform:scale(9);opacity:0;border-width:1px}}
.mf-burst{position:absolute;left:50%;top:var(--cy);width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;opacity:0;
  background:repeating-conic-gradient(rgba(var(--ray),.95) 0 5deg,rgba(var(--ray),0) 5deg 15deg);
  -webkit-mask:radial-gradient(circle,transparent 0 12%,#000 24%,transparent 70%);mask:radial-gradient(circle,transparent 0 12%,#000 24%,transparent 70%)}
.mixfx.hit .mf-burst{animation:mfburst 1.3s ease-out forwards}
@keyframes mfburst{0%{opacity:0;transform:scale(.3) rotate(0)}12%{opacity:1;transform:scale(1) rotate(6deg)}100%{opacity:.75;transform:scale(1.15) rotate(40deg)}}
.mf-spark{position:absolute;border-radius:2px;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 8px 2px rgba(255,236,180,.8)}
.mf-spark.st{border-radius:0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.mf-tw{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;opacity:0;background:#fffbe8;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);filter:drop-shadow(0 0 6px #ffe7a0)}
.mixfx.hit .mf-tw{animation:mftw .6s ease-in-out infinite alternate}
@keyframes mftw{from{opacity:.15;transform:scale(.4) rotate(0)}to{opacity:1;transform:scale(1.15) rotate(45deg)}}
.mf-sfx{position:absolute;left:50%;top:calc(var(--cy) - var(--rh) / 2 - 62px);z-index:2;font-size:46px;font-weight:900;font-style:italic;letter-spacing:1px;white-space:nowrap;color:#fff3c0;-webkit-text-stroke:7px #5a2a04;paint-order:stroke fill;text-shadow:0 4px 0 #5a2a04,0 0 18px rgba(255,200,90,.9);opacity:0}
.mixfx.r3 .mf-sfx{color:#ffe08a}
.mixfx.hit .mf-sfx{animation:mfsfx 1s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes mfsfx{0%{opacity:0;transform:translateX(-50%) scale(3) rotate(-8deg)}18%{opacity:1;transform:translateX(-50%) scale(1) rotate(-8deg)}24%{transform:translateX(calc(-50% - 5px)) scale(1.06) rotate(-6deg)}30%{transform:translateX(calc(-50% + 4px)) scale(1) rotate(-9deg)}36%,82%{opacity:1;transform:translateX(-50%) scale(1.04) rotate(-8deg)}100%{opacity:0;transform:translateX(-50%) translateY(-14px) scale(1.04) rotate(-8deg)}}
.mf-name{position:absolute;left:50%;top:calc(var(--cy) + var(--rh) / 2 + 16px);z-index:2;margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;transform:translateX(-50%);opacity:0}
.mixfx.hit .mf-name{animation:mfname .4s .28s cubic-bezier(.2,1.5,.4,1) forwards}
.mf-name small{font-size:15px;line-height:1;letter-spacing:2px;color:var(--gold);-webkit-text-stroke:3px #4a2206;paint-order:stroke fill}
.mf-name span{font-size:22px;font-weight:900;color:#fff8e8;-webkit-text-stroke:5px #4a2206;paint-order:stroke fill}
.mf-name b{order:-1;margin-bottom:3px;padding:2px 10px;border-radius:999px;font-size:13px;color:#103a2c;background:#8fe0c0;box-shadow:0 0 12px 3px rgba(143,224,192,.7)}
@keyframes mfname{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.night.quake2{animation:quake2 .42s linear}
@keyframes quake2{0%,100%{transform:translate(0)}12%{transform:translate(-10px,5px)}26%{transform:translate(9px,-6px)}40%{transform:translate(-7px,4px)}55%{transform:translate(5px,-3px)}70%{transform:translate(-3px,2px)}85%{transform:translate(2px,-1px)}}
.night.quake{animation:quake .32s linear}
@keyframes quake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}

/* ドラッグ：つかんだカード（ghost）・行き先の光（put・swap・can・cant・over）・上の札（dragtip）・下の「ここで うる」 */
[data-drag]{touch-action:none;-webkit-touch-callout:none}
[data-drag] img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
.dragghost{position:fixed;left:0;top:0;z-index:45;aspect-ratio:5/7;pointer-events:none;will-change:transform;transform-origin:50% 80%;transition:scale .14s ease-out;filter:drop-shadow(0 12px 14px rgba(0,0,0,.5))}
.dragghost .pc{width:100%;height:100%}
.dragghost.hot .pc{box-shadow:0 0 0 3px #8fe0c0,0 0 20px 7px rgba(111,199,168,.75)}
.lifted .pc{opacity:.28}
.tslot.swap .pc{outline:2px dashed rgba(255,226,160,.85);outline-offset:2px}
.tslot.over .pc,.handcard.over .pc{transform:scale(1.12)}
.tslot.put.over{background:rgba(244,194,78,.5)}
.tslot.cant .pc,.handcard.cant .pc{filter:grayscale(.7) brightness(.75)}
.handcard.own .pc{box-shadow:0 0 0 2.5px var(--gold),0 0 12px 3px rgba(244,194,78,.5)}
.sellzone{position:absolute;inset:3px 0;z-index:6;display:none;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:2.5px dashed #ffd0a0;background:rgba(110,36,18,.92);color:#fff3e0;font-size:16px;font-weight:900}
.sellzone span{font-size:14px;color:var(--gold)}
.night.drag-own .sellzone{display:flex}
.sellzone.over{background:rgba(190,58,36,.97);transform:scale(1.03)}
.dragtip{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:46;transform:translateX(-50%);width:min(calc(100vw - 24px),400px);min-height:62px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--cream);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.35);pointer-events:none}
.dt-card{flex:none;width:42px;aspect-ratio:5/7}
.dt-card .pc{width:100%;height:100%}
.dt-card .pc-name,.dt-card .pc-text,.dt-card .pc-pow,.dt-card .pc-cost,.dt-card .pc-star{display:none}
.dt-card .pc-win{bottom:5.5cqw}
.dt-body{min-width:0;flex:1}
.dt-main{margin:0;font-size:14px;font-weight:900;line-height:1.3}
.dt-sub{margin:1px 0 0;font-size:12px;font-weight:700;color:#7a4a2a}
.dt-sub em{font-style:normal;color:#b8321e}
.dt-fx{margin:2px 0 0;font-size:11px;line-height:1.35;color:#6a4a3a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dt-flash{display:inline-block;margin:3px 0 0;font-size:11px;font-weight:900;background:var(--gold);color:#3a1c08;padding:1px 8px;border-radius:8px}

/* 夜の画面のあまった高さは手札に：カードの大きさを手札の高さと幅で決める（container の単位） */
.night .stage{flex:1.3 1 0;max-height:calc((min(100vw, 460px) - 32px) * .75)}
.night .chef{height:min(88%,calc((min(100vw, 460px) - 32px) * .4))}
.night .handwrap{flex:1 1 0;min-height:var(--hh);display:flex;flex-direction:column}
.night .handwrap>.hand{flex:1;height:auto;container-type:size;padding-inline:10px}
.night .hand-lbl{display:none}
/* カードの幅：手札の幅に重なり（--ov。枚数が多いと深く）で収まる・高さに収まる・大きすぎない、の小さいほう */
.night .handcard{--w:min(calc((100cqw - 6px) / (var(--n) * (1 - 2 * var(--ov, .1)) + 2 * var(--ov, .1))),calc((100cqh - 24px) * .72),164px);width:var(--w);margin:0 calc(var(--w) * var(--ov, .1) * -1)}
.night .handcard:first-child{margin-left:0}.night .handcard:last-child{margin-right:0}
</style>
</head>

/* ==== 土台：小さな道具・ドット絵・セーブ・お知らせ ==== */
const KEY = 'mazemaze-okashiya', VER = 4;   // v:3 までは前の経営シミュレーション（読まずに新しく始める）
const $ = id => document.getElementById(id);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const REDUCED = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

/* 大きな数字：10万からは「万・億・兆・京」 */
function fmt(n) {
  n = Math.floor(n);
  if (n < 1e5) return n.toLocaleString('ja-JP');
  const units = [[1e16, '京'], [1e12, '兆'], [1e8, '億'], [1e4, '万']];
  for (const [u, s] of units) if (n >= u) {
    const v = n / u;
    return (v >= 1000 ? Math.floor(v).toLocaleString('ja-JP') : v >= 100 ? Math.floor(v) : v >= 10 ? (Math.floor(v * 10) / 10) : (Math.floor(v * 100) / 100)) + s;
  }
  return String(n);
}

/* ---------- ドット絵（前の版から） ---------- */
function fromMap(map, pal) {
  const h = map.length, w = Math.max(...map.map(r => r.length)), c = mk(w, h), x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < map[j].length; i++) {
    const k = map[j][i];
    if (k === '.' || !pal[k]) continue;
    x.fillStyle = pal[k]; x.fillRect(i, j, 1, 1);
  }
  return c;
}
function outline(src, col) {
  const w = src.width, h = src.height, d = src.getContext('2d').getImageData(0, 0, w, h).data;
  const a = (i, j) => (i < 0 || j < 0 || i >= w || j >= h) ? 0 : d[(j * w + i) * 4 + 3];
  const c = mk(w, h), x = c.getContext('2d');
  x.fillStyle = col;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    if (a(i, j)) continue;
    if (a(i - 1, j) || a(i + 1, j) || a(i, j - 1) || a(i, j + 1)) x.fillRect(i, j, 1, 1);
  }
  x.drawImage(src, 0, 0);
  return c;
}
function big(src, s) {
  const c = mk(src.width * s, src.height * s), x = c.getContext('2d');
  x.imageSmoothingEnabled = false; x.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL();
}

/* ---------- 状態とセーブ ---------- */
let S = null;
function newState() {
  return {
    v: VER, day: 1, phase: 'title', money: 0, chef: 'honoka',
    pool: [],                      // お菓子のカード（'o:材料+材料'）。夜の仕入れに出てくる
    recipes: { 'komugi+sato': 0 }, // 知っているレシピ（値はひらめいた日。0 は最初から）
    stock: {},                     // ふしぎな材料の数
    shelf: [],                     // 棚のお菓子 [{ key, n }]
    hearts: {}, regulars: [],      // お客さんのハートと常連さん
    night: null, morning: null, dayRun: null, today: null,
  };
}
function sanitize(o) {
  if (!o || typeof o !== 'object' || o.v !== VER) return null;
  const d = newState();
  for (const k in d) if (o[k] === undefined) o[k] = d[k];
  if (!Array.isArray(o.pool)) o.pool = [];
  if (!Array.isArray(o.shelf)) o.shelf = [];
  if (!Number.isFinite(o.day) || o.day < 1) o.day = 1;
  if (!Number.isFinite(o.money)) o.money = 0;
  /* カードやレシピの形が変わっても読めるように、いまはないカード・材料を落とす（11/17 夕方 バトルの作りかえ） */
  const okKey = k => typeof k === 'string' && k.split('+').length === 2 && k.split('+').every(m => MATS[m]);
  const okCard = c => { try { cardDef(c); return true; } catch (e) { return false; } };
  o.pool = o.pool.filter(okCard);
  for (const k in o.recipes) if (!okKey(k)) delete o.recipes[k];
  if (!Object.keys(o.recipes).length) o.recipes = { 'komugi+sato': 0 };
  o.shelf = o.shelf.filter(s => s && okKey(s.key));
  for (const m in o.stock) if (!MATS[m]) delete o.stock[m];
  if (o.today) for (const k of ['flashes', 'made']) if (Array.isArray(o.today[k])) o.today[k] = o.today[k].filter(okKey);
  if (o.morning && o.morning.cur && !okKey(o.morning.cur)) o.morning.cur = null;
  return o;
}
function load() {
  try { const t = localStorage.getItem(KEY); return t ? sanitize(JSON.parse(t)) : null; } catch (e) { return null; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 保存できない環境ではそのまま遊ぶ */ }
}

/* ---------- お知らせ ---------- */
let toastT = 0;
function toast(msg, ms = 1900) {
  const el = $('toast'); if (!el) return;
  el.textContent = msg; el.hidden = false;

/* ---------- レシピ（生地・素材の★2＝お菓子。朝に作って昼に売れる） ---------- */
const recipeKey = (a, b) => [a, b].sort().join('+');
/* カードの名前は8文字まで（11/17 しょーくん）。長い形の名前は、名前のときだけ短く（noun は絵をさがす名前なのでそのまま） */
const NAME_MAX = 8;
const NOUN_NAME = { 'シュークリーム': 'シュー', 'ブラウニー': 'ショコラ', 'キャンディ': 'ドロップ' };
const nounName = n => NOUN_NAME[n] || n;
function recipeOf(key) {
  const [a, b] = key.split('+'), A = MATS[a], B = MATS[b];
  const main = B.nr > A.nr ? B : A, other = main === A ? B : A;
  return {
    key, mats: [a, b],
    name: a === b ? A.twin || A.adj + nounName(A.noun) : other.adj + nounName(main.noun), noun: main.noun, nr: main.nr,
    tastes: [...new Set([A.taste, B.taste])],
    price: A.value + B.value,
    needs: [a, b].filter(m => MATS[m].fushigi),

}
/* まぜた効果：数は合計、倍率はかけ算（上限あり）、しるしはどちらかにあれば */
function mergeFx(a, b) {
  const o = {};
  for (const k of ['dmg', 'spd', 'nb', 'rally', 'heat', 'sear']) { const v = (a[k] || 0) + (b[k] || 0); if (v) o[k] = v; }
  const nx = (a.next || 1) * (b.next || 1); if (nx > 1) o.next = Math.min(6, nx);
  const ld = Math.max(a.lead || 0, b.lead || 0) + (a.lead && b.lead ? 1 : 0); if (ld) o.lead = ld;
  const fn = (a.fin || 1) * (b.fin || 1); if (fn > 1) o.fin = Math.min(3, fn);
  const sa = Math.max(a.sai || 0, b.sai || 0); if (sa) o.sai = sa;
  const ag = (a.again || 0) + (b.again || 0); if (ag) o.again = Math.min(3, ag);
  for (const k of ['call', 'bitter', 'noburn', 'stop']) if (a[k] || b[k]) o[k] = 1;
  return o;
}

/* ---------- カード ----------
   'm:食材'（生地・素材 ★1）・'t:道具'（★1）・'b:フィールド'・'k:★'（焦げ）
   'o:食材+食材'（生地・素材の★2）・'s:★2|★2'（★3）・'u:道具+道具'（道具の★2）・'w:★2|★2'（道具の★3） */
const CAT_NAME = { dough: '生地', mat: '素材', tool: '道具', burnt: '焦げ', field: 'フィールド' };
const ROLE = { dough: '攻撃', mat: '支援', burnt: '攻撃' };

/* ★3：同じ形どうしは「○○タワー」、ちがう形どうしは2つの形をつなげる（主役の形をうしろに） */
function specialName(r1, r2) {
  if (r1.noun === r2.noun) return nounName(r1.noun) + 'タワー';
  const [x, y] = r1.nr > r2.nr || (r1.nr === r2.nr && r1.noun > r2.noun) ? [r2, r1] : [r1, r2];
  return nounName(x.noun) + nounName(y.noun);
}
function toolSetName(a, b) { return a === b ? 'ダブル' + TOOLS[a].short : TOOLS[a].mini + '＆' + TOOLS[b].mini; }

function cardDef(cid) {
  if (DEFS.has(cid)) return DEFS.get(cid);

  let d;
  const pairFx = r => mergeFx(MATS[r.mats[0]].fx, MATS[r.mats[1]].fx);
  if (k === 'm') { const m = MATS[id]; d = { kind: m.cat === 'dough' ? 'd' : m.fushigi ? 'f' : 'm', cat: m.cat, star: 1, name: m.name, short: m.short, fx: m.fx, mats: [id], cost: m.fushigi ? 4 : 3 }; }
  else if (k === 't') { const t = TOOLS[id]; d = { kind: 't', cat: 'tool', role: t.role, star: 1, name: t.name, short: t.short, fx: t.fx, mats: [], parts: [id], cost: 3 }; }
  else if (k === 'b') { const f = FIELDS[id]; d = { kind: 'b', cat: 'field', star: 1, name: f.name, fx: {}, mats: [], cost: 5 }; }
  else if (k === 'k') { const n = +id; d = { kind: 'k', cat: 'burnt', star: n, name: BURNT[n].name, fx: BURNT[n].fx, mats: [], cost: 0 }; }
  else if (k === 'o') { const r = recipeOf(id); d = { kind: 'o', cat: foodCat(r.mats), star: 2, name: r.name, fx: pairFx(r), mats: r.mats, cost: 6 }; }
  else if (k === 's') {
    const [r1, r2] = id.split('|').map(recipeOf), mats = [...r1.mats, ...r2.mats], cat = foodCat(mats);
    const fx = mergeFx(pairFx(r1), pairFx(r2)); if (cat === 'dough') fx.noburn = 1;
    d = { kind: 's', cat, star: 3, name: specialName(r1, r2), fx, mats, keys: [r1.key, r2.key], cost: 0 };
  }

  else { const [p, q] = id.split('|').map(x => cardDef('u:' + x)); d = { kind: 't', cat: 'tool', role: p.role, star: 3, name: '特製道具セット', fx: mergeFx(p.fx, q.fx), mats: [], parts: [...p.parts, ...q.parts], cost: 0 }; }

  d.role = d.role || ROLE[d.cat] || '';

  d.dough = d.cat === 'dough';
  d.short = d.short || d.name;
  DEFS.set(cid, d);
  return d;
}

const attrsOf = d => d.cat === 'field' ? ['フィールド'] : [CAT_NAME[d.cat], d.role].filter(Boolean);

/* まぜられる組み合わせ（属性で決まる）：生地＋生地・生地＋素材・素材＋素材・道具＋道具・焦げ＋焦げ。同じ★どうしで、★3はまぜられない */
const MIX_OK = { 'dough+dough': 1, 'dough+mat': 1, 'mat+mat': 1, 'tool+tool': 1, 'burnt+burnt': 1 };

function mixCid(a, b) {
  const A = cardDef(a), B = cardDef(b), ids = [a.slice(2), b.slice(2)].sort();
  if (A.cat === 'burnt') return 'k:' + (A.star + 1);
  if (A.cat === 'tool') return A.star === 1 ? 'u:' + ids.join('+') : 'w:' + ids.join('|');
  return A.star === 1 ? 'o:' + recipeKey(A.mats[0], B.mats[0]) : 's:' + ids.join('|');
}

/* カードの効果のことば（短く。生地は焼ける・道具は発動で効く、などビルドの前提は書かない）。ダメージはカードの数字で見せる */
/* 大事な順（カードの紙には先頭の2つだけ。ぜんぶは大きく見る画面で）。焦げない★3には「焦げると」は出さない */
function fxList(fx, star = 1) {
  const m = STAR_MUL[star] || 1, f = v => Math.floor(v * m * 10) / 10, p = [];
  if (fx.lead) p.push(`先頭で×${fx.lead}`);
  if (fx.sai) p.push(`最後：サイコー1枚×${fx.sai + 0.5 * (star - 1)}`);
  if (fx.fin) p.push(`最後：合計×${fx.fin}`);
  if (fx.rally) p.push(`先頭：攻撃ぜんぶ+${f(fx.rally)}`);
  if (fx.next) p.push(`つぎ×${fx.next}`);
  if (fx.nb) p.push(`となり+${f(fx.nb)}`);
  if (fx.again) p.push(`右がもう${fx.again}回`);
  if (fx.stop) p.push('ほかの生地はサイコーで止まる');
  if (fx.noburn) p.push('焦げない');
  if (fx.sear) p.push(`右の生地を焼く+${fx.sear}`);
  if (fx.heat) p.push(`火力${fx.heat > 0 ? '+' : '−'}${Math.abs(fx.heat)}`);
  if (fx.call) p.push('次にフィールドが出る');
  if (fx.bitter && !fx.noburn) p.push('焦げると★2');
  if (fx.spd) p.push(fx.spd > 0 ? '早く焼ける' : 'ゆっくり焼ける');
  return p;
}
function fxText(fx, star = 1) { return fxList(fx, star).join('・'); }

  'シュークリーム': ['..........', '..oooooo..', '.obbllbbo.', 'obbbbbbbbo', 'oooooooooo', 'owwwawwwwo', 'oooooooooo', '.obbbbbbo.', '..oooooo..', '..........'],
};
function candyCanvas(key) {
  const r = recipeOf(key), [a, b] = r.mats, A = MATS[a], B = MATS[b];
  const main = B.nr > A.nr ? B : A, other = main === A ? B : A;
  const acc = a === b ? '#ffffff' : other.col;
  const pal = { o: OL, b: '#c98a4b', l: '#e4b273', a: acc, w: '#fff6ea', c: '#9a5a2a', y: '#f6d36b', d: '#4a2414', W: '#b9cad6' };
  if (main.noun === 'ブラウニー') pal.b = '#6b3a1e';
  if (main.noun === 'クッキー') pal.b = main.col;   // 生地の色のクッキー
  if (main.noun === 'キャンディ' || main.noun === 'ゼリー') pal.a = a === b ? main.col : (other.col === '#fff4f8' ? main.col : other.col);
  return fromMap(CANDY_MAPS[main.noun], pal);
}

/* ★3 スペシャル：お菓子の絵に金のふちと、きらきら */
function specialCanvas(id) {
  const [k1, k2] = id.split('|'), c = mk(14, 14), x = c.getContext('2d');
  x.drawImage(candyCanvas(k2), 4, 1); x.drawImage(candyCanvas(k1), 0, 4);
  const o = outline(c, '#f6c94c'), g = o.getContext('2d');
  g.fillStyle = '#fff6d0'; for (const [a, b] of [[12, 0], [13, 1], [11, 1], [12, 2], [1, 1]]) g.fillRect(a, b, 1, 1);
  return o;
}

/* ---------- ハイグラの絵：ART はビルドが assets/art/*.webp から作る（名前→dataURL）。まだない絵はドット絵の仮の絵 ---------- */
const NOUN_ID = { 'クッキー': 'cookie', 'サブレ': 'sable', 'キャンディ': 'candy', 'カステラ': 'castella', 'ブラウニー': 'brownie', 'ゼリー': 'jelly', 'シュークリーム': 'puff' };
function hiArt(cid) {
  const k = cid[0], id = cid.slice(2);
  if (k === 'm' || k === 't') return ART['card-' + id] || null;
  if (k === 'u' || k === 'w') return ART['card-' + id.split(/[+|]/)[0]] || null;   // 道具の★2・★3は、1つめの道具の絵
  if (k === 'o') {   // 形（noun）ともう1つの材料で絵をさがす（candy-cookie-bata など）。なければ形だけの絵
    const r = recipeOf(id), nid = NOUN_ID[r.noun], other = r.mats.find(m => MATS[m].noun !== r.noun);
    return ART[`candy-${nid}-${other}`] || ART['candy-' + nid] || null;
  }
  if (k === 's') {   // ★3：同じ形どうしは「特製○○タワー」の絵
    const [r1, r2] = id.split('|').map(recipeOf);
    return r1.noun === r2.noun ? ART[`special-${NOUN_ID[r1.noun]}-tower`] || null : null;
  }
  return null;
}

/* ---------- カードの絵（dataURL にして使いまわす） ---------- */
const URLS = new Map();
function cardIconURL(cid) {
  const hi = hiArt(cid); if (hi) return hi;
  if (URLS.has(cid)) return URLS.get(cid);
  const k = cid[0], id = cid.slice(2);
  const src = k === 'o' ? candyCanvas(id) : k === 's' ? specialCanvas(id) : k === 'k' ? ICON['koge' + id] : k === 'u' || k === 'w' ? ICON[id.split(/[+|]/)[0]] : ICON[id];
  const u = big(src, k === 's' ? 3 : 4);
  URLS.set(cid, u);
  return u;
}
const candyURL = key => cardIconURL('o:' + key);
const matURL = id => cardIconURL('m:' + id);

/* ---------- 人（前の版から）：お客さんと、炎のシェフ ほのか ---------- */
function personSprite(t, frame) {
  const top = 3, legH = t.small ? 2 : 3, bodyH = t.h - 7 - legH;
  const c = mk(12, top + t.h + 1), x = c.getContext('2d');
  const r = (col, X, Y, w = 1, h = 1) => { x.fillStyle = col; x.fillRect(X, Y, w, h); };
  const y = top;
  if (t.chef) { r('#ffffff', 4, y - 3, 4); r('#ffffff', 3, y - 2, 6, 2); r('#ffffff', 2, y, 8); r('#e6e1e8', 2, y + 1, 8); r(t.hair, 2, y + 2, 2); r(t.skin, 4, y + 2, 5); r(t.hair, 9, y + 2); }
  else if (t.hat) { r(t.hat, 3, y, 6); r(t.hat, 2, y + 1, 8); r(t.hatDk, 2, y + 2, 9); }
  else { r(t.hair, 3, y, 6); r(t.hair, 2, y + 1, 8); r(t.hair, 2, y + 2, 2); r(t.skin, 4, y + 2, 5); r(t.hair, 9, y + 2); }
  if (t.bun) { r(t.hair, 5, y - 2, 2); r(t.hair, 4, y - 1, 4); }
  if (t.hat) r(t.skin, 3, y + 2, 6);
  r(t.hair, 2, y + 3); r(t.skin, 3, y + 3, 6); r(t.hair, 9, y + 3);
  r(t.skin, 2, y + 4, 8); r(t.skin, 2, y + 5, 8); r(t.skin, 3, y + 6, 6);
  if (t.pony) { r(t.hair, 10, y + 2, 1, 4); r(t.hair, 11, y + 3, 1, 4); r('#ffc94a', 10, y + 2); }
  r('#2b1a12', 4, y + 4); r('#2b1a12', 7, y + 4);
  r('#f08a9a', 3, y + 5); r('#f08a9a', 8, y + 5);
  const bw = t.small ? 6 : 8, bx = t.small ? 3 : 2, yb = y + 7;
  r(t.shirt, bx, yb, bw, bodyH);
  if (t.collar) r(t.collar, 5, yb, 2);
  if (t.apron) { r(t.apron, bx + 1, yb + 2, bw - 2, bodyH - 2); r(t.apron, 4, yb, 1, 2); r(t.apron, 7, yb, 1, 2); }
  r(t.arm, bx - 1, yb, 1, bodyH - 1); r(t.arm, bx + bw, yb, 1, bodyH - 1);
  r(t.skin, bx - 1, yb + bodyH - 1); r(t.skin, bx + bw, yb + bodyH - 1);
  const yl = yb + bodyH, lx = bx + 1, rx = bx + bw - 3;
  const lh = frame === 1 ? legH - 1 : legH, rh = frame === 2 ? legH - 1 : legH;
  r(t.pants, lx, yl, 2, lh - 1); r('#3a2318', lx, yl + lh - 1, 2);
  r(t.pants, rx, yl, 2, rh - 1); r('#3a2318', rx, yl + rh - 1, 2);
  return outline(c, '#2b1a12');
}

function cardTastes(d) { return [...new Set(d.mats.map(m => MATS[m].taste))]; }

function typeLine(d) {

}
/* いまのダメージ（生地は焼き加減の倍率こみ） */
function cardDmg(d, cook) { return d.fx.dmg ? Math.floor(d.fx.dmg * STAR_MUL[d.star] * (d.dough ? cookMul(cook || 0) : 1) * 10) / 10 : 0; }
/* 効果のことば（短く） */
function cardChips(d) { return d.cat === 'field' ? FIELDS[d.cid.slice(2)].chips.slice() : fxList(d.fx, d.star); }

/* カードの形（mini と huge は同じ形で大きさだけちがう） */
function cardFace(cid, cls, opt = {}) {
  const d = cardDef(cid), dmg = cardDmg(d, opt.cook), text = cardChips(d).slice(0, 2).join('・');   // 紙には大事な2つまで
  const cost = opt.cost != null ? `<span class="pc-cost${typeof opt.cost === 'string' ? ' txt' : ''}">${opt.cost}</span>` : '';
  return `<div class="pc ${cls} k-${d.kind} s${d.star}${dmg ? '' : ' np'}${opt.born ? ' born' : ''}">
    <div class="pc-win"><div class="pc-art">${artImg(cid)}</div><i class="pc-shine"></i></div>
    <div class="pc-name"><span>${esc(d.short)}</span></div>
    <p class="pc-text${text ? '' : ' none'}"><span>${esc(text || attrsOf(d).join('・'))}</span></p>
    ${cost}${starGems(d)}${dmg ? powBadge(dmg) : ''}
  </div>`;
}
function cardMini(cid, opt = {}) { return cardFace(cid, 'mini', opt); }
/* 調理台のタイル：同じふちと絵の窓。数字は右上の紋章、★は左下、生地は下に焼き加減のメーター（9段階。サイコーは金に光る） */
function cardTile(cid, opt = {}) {
  const d = cardDef(cid), cook = d.dough ? opt.cook || 0 : null, dmg = cardDmg(d, cook);
  return `<div class="pc tile k-${d.kind} s${d.star}${dmg ? '' : ' np'}${opt.born ? ' born' : ''}${cook >= COOK_MAX ? ' best' : ''}">
    <div class="pc-win"><div class="pc-art">${artImg(cid)}</div><i class="pc-shine"></i></div>
    ${starGems(d)}${dmg ? powBadge(dmg) : ''}
    ${cook != null ? `<i class="cook c${cookStage(cook)}" style="--c:${cook}"></i>` : ''}</div>`;
}
function cardBig(cid, cook) { return cardFace(cid, 'huge', { cook }); }
/* 大きなカードの下：種類と、生地は焼き加減・お菓子は材料だけ（効果はカードに書いてある） */
function cardInfo(cid, cook) {
  const d = cardDef(cid);
  /* カードの名前（8文字まで）→ 種類 → 効果ぜんぶ（1つずつ札で）→ ダメージ・焼き加減 → 材料。★1の長い名前は、どんな材料かの小さな説明に */
  const sub = d.name !== d.short ? `<p class="ci-sub">${esc(d.name)}</p>` : '';
  const fx = cardChips(d), fl = fx.length ? `<p class="ci-chips">${fx.map(t => `<span>${esc(t)}</span>`).join('')}</p>` : '';
  const ck = d.dough ? `<p class="ci-cook">焼き加減 <b>${cook || 0}</b>/${COOK_MAX}　${cookName(cook || 0)}・×${fmtMul(cookMul(cook || 0))}</p>` : '';
  const dm = Math.floor(cardDmg(d, cook)), dl = dm ? `<p class="ci-dmg"><i></i>ダメージ <b>${fmt(dm)}</b></p>` : '';   // 炎の紋章の数字＝ダメージ
  const mats = d.kind === 'o' || d.kind === 's' ? `<p class="ci-recipe">材料：${d.mats.map(m => MATS[m].short).join('＋')}</p>` : '';
  return `<div class="cinfo k-${d.kind}"><p class="ci-name">${esc(d.short)}</p>${sub}<p class="ci-type">${attrsOf(d).join('・')}</p>${fl}${dl}${ck}${mats}</div>`;
}

/* ==== 場面の絵：夜のお店（バトル）と昼のお店（販売）。幅96×高さ48を画面の幅いっぱいにのばす ==== */
const SW = 96, SH = 48, FLOOR = 41;
const scn = { mode: 'night', heat: 2, hit: 0, smoke: 0, flee: 0, cust: [], speed: 1, bg: {}, cv: null, raf: 0, last: 0 };
const CANDY_CV = new Map();
const candyCv = key => { if (!CANDY_CV.has(key)) CANDY_CV.set(key, candyCanvas(key)); return CANDY_CV.get(key); };

function mountScene(mode) {
  scn.cv = $('scene'); scn.mode = mode;
  if (!scn.cv) return;
  scn.cv.width = SW; scn.cv.height = SH;
  if (!scn.raf) scn.raf = requestAnimationFrame(sceneLoop);
}
function sceneLoop(ts) {
  scn.raf = requestAnimationFrame(sceneLoop);
  const cv = scn.cv;
  const dt = Math.min(0.1, (ts - (scn.last || ts)) / 1000); scn.last = ts;
  if (!cv || !cv.isConnected) return;
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  if (scn.mode === 'night') drawNight(g, ts / 1000, dt); else drawDay(g, ts / 1000, dt);
}
function painter(g) { return (col, x, y, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(x, y, w, h); }; }

/* ---------- 夜：窓に月、こわれた扉からモンスター、ほのかとコンロの火 ---------- */
function nightBg() {
  if (scn.bg.night) return scn.bg.night;
  const c = mk(SW, SH), r = painter(c.getContext('2d'));
  r('#241b3d', 0, 0, SW, SH);
  for (let y = 3; y < FLOOR; y += 6) r('#2a2046', 0, y, SW, 1);
  r('#4c3f74', 4, 4, 30, 22); r('#120e26', 6, 6, 26, 18); r('#4c3f74', 18, 6, 2, 18); r('#4c3f74', 6, 14, 26, 2);
  r('#fff3c4', 9, 8, 4, 5); r('#fff3c4', 8, 9, 1, 3); r('#120e26', 11, 8, 2, 3);
  for (const [x, y] of [[25, 8], [29, 18], [9, 21], [23, 21], [14, 17]]) r('#c8b9d9', x, y);
  r('#4c3f74', 74, 6, 20, FLOOR - 6); r('#0c0a18', 76, 8, 16, FLOOR - 8); r('#6b5a3a', 92, 8, 2, FLOOR - 8);
  r('#3a2a2a', 0, FLOOR, SW, SH - FLOOR); r('#4a3434', 0, FLOOR, SW, 1);
  for (let x = 4; x < SW; x += 8) r('#332424', x, FLOOR + 3, 1, SH - FLOOR - 3);
  r('#5a6370', 25, 35, 12, FLOOR - 35); r('#9aa3ad', 26, 34, 10, 1); r('#3a3f48', 25, FLOOR - 1, 12, 1);
  return (scn.bg.night = c);
}
function drawNight(g, t, dt) {
  const r = painter(g);
  g.drawImage(nightBg(), 0, 0);
  const z = zoneOf(scn.heat), fh = [2, 4, 7][z];
  for (let i = 0; i < 8; i++) {
    const h = fh + (Math.sin(t * 13 + i * 1.9) > 0.2 ? 1 : 0);
    r(z === 3 ? '#5a3a26' : '#f0502a', 27 + i, 34 - h, 1, h);
    if (z < 3 && h > 2) r(z === 2 ? '#fff6d0' : '#ffc94a', 27 + i, 34 - Math.ceil(h / 2), 1, Math.ceil(h / 2));
  }
  if (scn.smoke > 0 || z === 3) {
    const k = 1 - Math.max(0, scn.smoke);
    for (let i = 0; i < 3; i++) r('#8a8494', 28 + i * 3 + Math.round(Math.sin(t * 3 + i) * 1), 26 - i * 3 - Math.round(k * 4), 3, 2);
  }
  const hop = scn.hit > 0.15 ? -1 : 0;
  g.drawImage(CHEF_SPR[0], 12, FLOOR - CHEF_SPR[0].height + 1 + hop);
  const N0 = S.night, mon = N0 ? MONSTERS[N0.mon] : MONSTERS[0];
  const M = MON_SPR[mon.id];
  let sx = 50, sy = FLOOR - 32 + Math.round(Math.sin(t * 2.5));
  if (scn.hit > 0) sx += (Math.floor(t * 30) % 2) ? 2 : -2;
  if (scn.flee) sx += Math.min(60, (t - scn.flee) * 40);
  g.drawImage(M, 0, 0, M.width, M.height, sx, sy, M.width * 2, M.height * 2);
  if (scn.hit > 0) {
    const cx = sx + 18, cy = sy + 12;
    for (const [dx, dy] of [[0, -6], [0, 6], [-6, 0], [6, 0], [-4, -4], [4, 4], [4, -4], [-4, 4]]) r('#fff6d0', cx + dx, cy + dy, 2, 2);
  }
  scn.hit = Math.max(0, scn.hit - dt);
  scn.smoke = Math.max(0, scn.smoke - dt * 0.8);
}

/* ---------- 昼：明るいお店、棚のお菓子、歩いてくるお客さん ---------- */
function dayBg() {
  if (scn.bg.day) return scn.bg.day;
  const c = mk(SW, SH), r = painter(c.getContext('2d'));
  r('#fbe3d4', 0, 0, SW, SH);

  r('#ffe27a', 7, 8, 4, 4); r('#ffffff', 19, 9, 6, 2); r('#ffffff', 20, 8, 3, 1);
  r('#c98a4b', 34, 10, 34, 24); r('#8a5a3b', 33, 21, 36, 2); r('#8a5a3b', 33, 32, 36, 2); r('#a8703e', 35, 11, 32, 1);
  r('#8a5a3b', 78, 8, 16, FLOOR - 8); r('#bfe3f0', 81, 11, 10, 8); r('#ffd75e', 89, 24, 2, 2);
  r('#d9b48a', 0, FLOOR, SW, SH - FLOOR); r('#c49a6c', 0, FLOOR, SW, 1);
  for (let x = 6; x < SW; x += 10) r('#c49a6c', x, FLOOR + 3, 1, SH - FLOOR - 3);
  return (scn.bg.day = c);
}
function drawDay(g, t, dt) {
  const r = painter(g);
  g.drawImage(dayBg(), 0, 0);
  const items = S.shelf.filter(s => s.n > 0).slice(0, 6);
  items.forEach((s, i) => g.drawImage(candyCv(s.key), 36 + (i % 3) * 11, i < 3 ? 11 : 22));
  g.drawImage(CHEF_SPR[0], 8, FLOOR - CHEF_SPR[0].height + 1);
  for (const c of scn.cust) {
    const sp = 34 * scn.speed;
    if (c.x !== c.tx) { const d = c.tx - c.x; c.x += Math.sign(d) * Math.min(Math.abs(d), sp * dt); }
    const walking = c.x !== c.tx, spr = CUST_SPR[c.id][walking ? 1 + (Math.floor(t * 6) % 2) : 0];
    const x = Math.round(c.x), y = FLOOR - spr.height + 1;
    g.drawImage(spr, x, y);
    if (c.bub) {
      r('#ffffff', x - 1, y - 14, 14, 12); r('#3a2318', x - 1, y - 14, 14, 1); r('#3a2318', x - 1, y - 3, 14, 1);
      r('#3a2318', x - 2, y - 13, 1, 10); r('#3a2318', x + 13, y - 13, 1, 10); r('#ffffff', x + 4, y - 2, 3, 1);
      if (c.bub === 'heart') { for (const [dx, dy, w] of [[2, 2, 3], [7, 2, 3], [1, 3, 10], [2, 6, 8], [3, 7, 6], [4, 8, 4], [5, 9, 2]]) r('#e0507a', x - 1 + dx, y - 14 + dy - 0, w, dy === 3 ? 3 : 1); }
      else if (c.bub === 'none') { r('#7a5a4a', x + 2, y - 9, 8, 2); }
      else g.drawImage(candyCv(c.bub), x + 1, y - 13);
    }
  }
  scn.cust = scn.cust.filter(c => !(c.gone && c.x === c.tx));
}

/* ---- src/js/night.js ---- */
/* ==== 夜：食材モンスターの襲撃を9ラウンドで撃退する（ゼンゼロのオバケ屋敷の形が土台・仕様は claude/okashi-battle-spec.md） ====
   1ラウンド：仕入れ（毎回3枚・入れかえ・コインで買う）→ 並べる・まぜる → バトル
   バトル：はじめに「焼き」（フィールドがあれば、鉄板の生地がいっせいに火力のぶん焼ける）→ 左から順に発動
   生地は場に残り、ラウンドをまたいで焼けていく（9でサイコー・サイコーのまま焼かれると焦げる）
   鉄板の火力（N.heat 1〜4）はラウンドをまたいで残る。火力カードが発動すると変わり、次のラウンドの焼きに効く
   フィールドも仕入れから。買うと調理台の左の「場」に入る（1つだけ・置きかえOK）。ラウンド1だけ、5まいから3まい えらんで無料
   調理台5マス。画面は night-ui.js */
const SLOTS = 5, HELD_MAX = 3, ROUND1_SHOW = 5, ROUND1_PICKS = 3, SHOP_N = 3, INCOME = 5, QUOTA_BONUS = 2, REROLL = 1;
const SELL = [0, 1, 3, 8];      // うると戻るコイン（★ごと）
const START_HEAT = 2;           // 夜のはじめの鉄板（中火）
const STEP_MS = REDUCED ? 200 : 620;
let N = null;          // S.night（夜のあいだの状態）
let busy = false;      // バトルの間は操作しない

function startNight() {
  S.phase = 'night';
  S.today = { day: S.day, score: 0, beaten: false, drop: null, drops: 0, flashes: [], made: [], sales: 0, served: 0, visitors: 0, newRegulars: [] };
  S.night = {
    mon: (S.day - 1) % MONSTERS.length, field: null, heat: START_HEAT, call: false, stage: 'shop', round: 1, coins: 0, picks: ROUND1_PICKS,
    board: Array(SLOTS).fill(null), shop: [], score: 0, met: 0, burnt: 0,
    flashes: [], held: [], sel: null, view: false, last: null,
  };
  scn.flee = 0; scn.heat = START_HEAT;
  N = S.night; rollShop();
  save(); render();
}
/* 前の形のセーブ（6マス・前のカード）は、その夜をはじめからにする */
function nightOk(n) {
  try {
    if (!n || n.board.length !== SLOTS || !Number.isFinite(n.heat)) return false;
    if (!Array.isArray(n.held)) n.held = [];
    for (const c of [...n.board, ...n.shop, ...n.held]) if (c) cardDef(typeof c === 'string' ? c : c.cid);
    if (n.field && !FIELDS[n.field]) return false;
    return true;
  } catch (e) { return false; }
}

/* ---------- 仕入れ ---------- */
function poolList() {
  const C = CHEFS[S.chef], L = [];
  for (const cid of C.doughs) L.push([cid, 3]);
  for (const cid of C.common) L.push([cid, 2]);
  for (const id of C.fields) if (id !== N.field) L.push(['b:' + id, 1.5]);
  if (N.round >= 3 || N.met > 0) L.push(['m:' + MONSTERS[N.mon].drop, 2]);
  for (const cid of S.pool) L.push([cid, 2]);
  return L;
}
function draw1(L) {
  let tot = 0; for (const [, w] of L) tot += w;
  let x = Math.random() * tot;
  for (const [c, w] of L) if ((x -= w) < 0) return c;
  return L[0][0];
}
function rollShop() {
  const C = CHEFS[S.chef], L = poolList(), out = [];
  if (N.call) {   // よびりん：フィールドをかならず1枚
    const f = C.fields.filter(id => id !== N.field);
    if (f.length) out.push('b:' + pick(f));
    N.call = false;
  }
  if (N.round === 1) {
    const ok = shuffle(S.pool.slice());
    while (out.length < 1 && ok.length) out.push(ok.pop());
    while (out.filter(c => cardDef(c).dough).length < 2) out.push(pick(C.doughs));
  }
  while (out.length < (N.round === 1 ? ROUND1_SHOW : SHOP_N)) {
    let c = draw1(L);
    for (let t = 0; t < 9 && c[0] === 'b' && out.includes(c); t++) c = draw1(L);   // 同じフィールドは1回に1枚まで
    out.push(c);
  }
  N.shop = shuffle(out);
}
/* 大きく見る画面をとじる */
function unsel() { N.sel = null; N.view = false; }
function place(cid, at) {
  const j = at != null && !N.board[at] ? at : N.board.indexOf(null); if (j < 0) return null;
  N.board[j] = cardDef(cid).dough ? { cid, cook: 0 } : { cid }; return { where: 'board', i: j };
}
/* 1ラウンド目は無料の枠・2ラウンド目からはコイン。n まい・cost コインはらえないわけ（はらえるなら空） */
function payNg(n, cost) {
  if (!n) return '';
  if (N.round === 1) return N.picks >= n ? '' : N.picks ? `無料はあと${N.picks}まい` : '3まい えらんだよ。バトルしてみよう';
  return N.coins >= cost ? '' : 'コインがたりない';
}
function pay(n, cost) { if (!n) return; if (N.round === 1) N.picks -= n; else N.coins -= cost; }
/* 仕入れのカードを買う。at があればそのマスに置く（なければあいている左のマス） */
function buy(i, at) {
  const cid = N.shop[i]; if (!cid || busy || N.stage !== 'shop') return;
  const d = cardDef(cid), ng = payNg(1, d.cost);
  if (ng) return toast(ng);
  if (d.cat === 'field') {
    if (N.field) toast('フィールドを入れかえた');
    N.field = cid.slice(2); N.heat = FIELDS[N.field].start;
  } else if (!place(cid, at)) return toast('調理台がいっぱい。うるか、まぜてから買おう');
  pay(1, d.cost); N.shop[i] = null; unsel();
  save(); renderNight();
}
/* 手札にあるカード（まぜてできた・自分のもの）を調理台へ */
function placeHeld(h, at) {
  const c = N.held[h]; if (!c || N.board[at]) return;
  N.board[at] = c; N.held.splice(h, 1); unsel();
  save(); renderNight();
  const t = document.querySelector(`.tslot[data-w="board"][data-i="${at}"] .pc`); if (t) replay(t, 'born');
}
/* うる・もどす（1ラウンド目の★1は「もどす」＝無料の枠がもどる） */
function sellValue(d) { return N.round === 1 && d.star === 1 && d.cat !== 'burnt' ? 0 : SELL[d.star]; }
function sellAt(p) {
  if (busy || N.stage !== 'shop' || !p) return;
  const c = p.where === 'field' ? (N.field ? { cid: 'b:' + N.field } : null) : cardAt(p); if (!c || p.where === 'shop') return;
  const d = cardDef(c.cid), v = sellValue(d);
  if (v) N.coins += v; else N.picks = Math.min(ROUND1_PICKS, N.picks + 1);
  if (p.where === 'field') N.field = null; else if (p.where === 'held') N.held.splice(p.i, 1); else N.board[p.i] = null;
  unsel(); save(); renderNight();
}
function sell() { sellAt(N.sel); }
function reroll() {
  if (busy || N.stage !== 'shop' || N.round === 1) return;
  if (N.coins < REROLL) return toast('コインがたりない');
  N.coins -= REROLL; rollShop(); unsel(); save(); renderNight();
}

/* ---------- まぜる：同じ★で、属性の合うものどうし（cards.js の mixable）。調理台・手札（仕入れ・手持ち）のどれどうしでも、まぜられる（仕入れのカードは買いながら） ---------- */
const canMix = (a, b) => mixable(cardDef(a.cid), cardDef(b.cid));
const asCard = cid => cardDef(cid).dough ? { cid, cook: 0 } : { cid };   // 仕入れの生地は生（焼き加減0）
/* その場所のカード（shop＝仕入れは買う前の形・held＝手持ち・board＝調理台） */
function cardAt(p) {
  if (!p) return null;
  if (p.where === 'shop') return N.shop[p.i] ? asCard(N.shop[p.i]) : null;
  if (p.where === 'held') return N.held[p.i] || null;
  return p.where === 'board' ? N.board[p.i] : null;
}
/* まぜてできるカード。焼き加減は、低いほうを引きつぐ */
function mixResult(a, b) {
  const cid = mixCid(a.cid, b.cid), cooks = [a, b].filter(x => x.cook != null).map(x => x.cook);
  return cardDef(cid).dough ? { cid, cook: cooks.length ? Math.min(...cooks) : 0 } : { cid };
}
/* まぜるときの代金（仕入れのカードの分）と、できたカードの行き先。調理台のカードとまぜたら調理台・手札どうしなら手札（手持ちになる） */
function mixPlan(p, q) {
  const shop = [p, q].filter(x => x.where === 'shop'), cost = shop.reduce((t, x) => t + cardDef(N.shop[x.i]).cost, 0);
  const bd = [q, p].find(x => x.where === 'board'), hd = [p, q].filter(x => x.where === 'held').map(x => x.i);
  const to = bd ? { where: 'board', i: bd.i } : hd.length ? { where: 'held', i: Math.min(...hd) } : { where: 'held', i: N.held.length < HELD_MAX ? N.held.length : -1 };
  return { n: shop.length, cost, to };
}
function mixNg(P) { return P.to.i < 0 ? `手札がいっぱい（手持ちは${HELD_MAX}まいまで）` : payNg(P.n, P.cost); }
/* 調理台のほかのカードとまぜられるか（手札とタイルの「まぜ」の目じるし） */
const mixesWithBoard = (cid, skip) => N.board.some((x, i) => x && i !== skip && mixable(cardDef(cid), cardDef(x.cid)));
/* まぜられる相手の決まり（ドラッグの案内・大きく見る画面） */
function mixRule(d) {
  if (d.cat === 'field') return 'フィールドは まぜられない';
  if (d.star >= 3) return '★3は完成。もう まぜられない';
  return `${d.cat === 'tool' ? '道具' : d.cat === 'burnt' ? '焦げ' : '生地か素材'}の★${d.star}と まぜる`;
}
/* p のカードを q へ落としたら何が起きるか（ドラッグの光と案内・指をはなしたとき）。kind：mix・buy・place・move・sell */
function dropPlan(p, q) {
  const a = p.where === 'field' ? (N.field ? { cid: 'b:' + N.field } : null) : cardAt(p);
  if (!a || !q || (q.where === p.where && q.i === p.i)) return null;
  const d = cardDef(a.cid);
  if (q.where === 'sell') return p.where === 'shop' ? null : { kind: 'sell', v: sellValue(d) };
  if (d.cat === 'field') return q.where === 'field' && p.where === 'shop' ? { kind: 'buy', ng: payNg(1, d.cost), cost: d.cost } : null;
  if (q.where === 'field') return null;
  const b = cardAt(q);
  if (b && canMix(a, b)) { const P = mixPlan(p, q); return { kind: 'mix', P, ng: mixNg(P), r: mixResult(a, b) }; }
  if (q.where !== 'board') return null;

/* 指をはなした所で決める */
function dropCard(p, q, from) {
  const P = dropPlan(p, q); if (!P || busy || N.stage !== 'shop') return false;
  if (P.ng) { toast(P.ng); return false; }
  if (P.kind === 'mix') doMix(p, q, from);
  else if (P.kind === 'buy') buy(p.i, q.where === 'board' ? q.i : undefined);
  else if (P.kind === 'place') placeHeld(p.i, q.i);
  else if (P.kind === 'move') moveTo(p.i, q.i);

}
/* まぜる。2枚がシュッと飛び出してガキーン（mixFx）→ できたカードが調理台か手札へ */
function doMix(p, q, from) {
  const a = cardAt(p), b = cardAt(q);
  if (busy || !a || !b || !canMix(a, b)) return;
  const P = mixPlan(p, q), ng = mixNg(P); if (ng) return toast(ng);

  } else {

  if (d.star === 2 && d.food) {

/* 調理台のカードを、べつのマスへうごかす（カードがあれば入れかえ）。バトルを押すまで、いつでも */
function moveTo(i, j) {
