/* ---------- バトル（関数の名前は bake のまま） ---------- */
const burntOf = d => 'k:' + (d.star >= 2 || d.fx.bitter ? 2 : 1);
/* 生地を add だけ焼く。サイコー（9）のまま焼かれると焦げる（safe なら焦げずにサイコーで止まる） */
function cookStep(c, add, safe) {
  const d = cardDef(c.cid), from = c.cook || 0;
  if (from >= COOK_MAX && !safe) return { from, to: from, burnt: true, cid: burntOf(d) };
  c.cook = Math.min(COOK_MAX, from + Math.max(1, add));

/* 1ラウンドの計算（画面より先に、ぜんぶ決める）。board と heat は finishRound で N に入れる */
function resolveRound() {
  const F = N.field ? FIELDS[N.field] : null, ev = [];
  const board = N.board.map(c => c && { cid: c.cid, cook: c.cook });
  let heat = N.heat, burnt = 0, call = false;
  const stop = () => board.some(c => c && cardDef(c.cid).fx.stop);
  const burn = (i, r) => { if (r.burnt) { board[i] = { cid: r.cid }; burnt++; } };
  // 1. 焼き：バトルのはじめに、鉄板の生地がいっせいに焼ける
  if (F) {
    const list = [], safeAll = stop();
    board.forEach((c, i) => {
      if (!c) return; const d = cardDef(c.cid); if (!d.dough) return;
      const r = cookStep(c, heat + (d.fx.spd || 0), safeAll || d.fx.noburn);
      burn(i, r); list.push({ i, ...r });

  const first = idx[0], last = idx[idx.length - 1];
  const extra = Array(SLOTS).fill(0);
  let pend = 1, total = 0, rally = 0;
  for (const i of idx) {
    const times = 1 + Math.min(3, extra[i]);
    for (let t = 0; t < times; t++) {
      const c = board[i], d = cardDef(c.cid), fx = d.fx, sm = STAR_MUL[d.star];
      const e = { type: 'act', i, cid: c.cid, again: t > 0, dmg: 0, cook: c.cook };
      if (i === first && t === 0 && fx.rally) { rally += fx.rally * sm; e.rally = true; }
      if (fx.heat) { const h0 = heat; heat = Math.max(1, Math.min(HEAT_MAX, heat + fx.heat)); e.heat = [h0, heat]; }
      if (fx.sear && board[i + 1] && cardDef(board[i + 1].cid).dough) {
        const o = board[i + 1], r = cookStep(o, fx.sear, stop() || cardDef(o.cid).fx.noburn);
        burn(i + 1, r); e.sear = { i: i + 1, ...r };

      let dmg = 0;
      if (fx.dmg) {
        let base = fx.dmg * sm;
        if (d.dough) { base *= cookMul(c.cook || 0); if (F && F.best && c.cook >= COOK_MAX) base *= F.best; }
        if (fx.lead && i === first) { base *= fx.lead; e.lead = true; }
        if (fx.sai && i === last) { const n = board.filter(o => o && cardDef(o.cid).dough && o.cook >= COOK_MAX).length; base *= Math.pow(fx.sai + 0.5 * (d.star - 1), n); e.sai = n; }
        for (const j of [i - 1, i + 1]) { const o = board[j]; if (o) { const od = cardDef(o.cid); if (od.fx.nb) base += od.fx.nb * STAR_MUL[od.star]; } }
        base += rally;
        base *= pend; pend = 1;
        dmg = Math.min(DMG_CAP, Math.floor(base));

      if (fx.next) pend *= fx.next;
      total += dmg;
      if (fx.fin && i === last) { const add = Math.floor(total * (fx.fin - 1)); dmg += add; total += add; e.fin = true; }
      total = Math.min(DMG_CAP, total);
      if (fx.again && t === 0 && i + 1 < SLOTS) extra[i + 1] += fx.again;
      if (fx.call) { call = true; e.call = true; }

}
function bake() {
  if (busy || N.stage !== 'shop') return;

  if (N.round === 1 && N.picks > 0 && N.shop.some(Boolean)) return toast(`あと${N.picks}まい えらべるよ`);
  const res = resolveRound();
  busy = true; unsel(); renderNight();
  const q = quota(N.round, S.day);
  let k = 0, run = 0;
  const step = () => {
    if (k >= res.ev.length) return setTimeout(() => finishRound(res), STEP_MS);
    const e = res.ev[k];
    if (e.type === 'act' && !e.again && !e.cut && cardDef(e.cid).star === 3) { e.cut = true; return setTimeout(step, cutIn(e.cid, 'スペシャル発動！')); }

}

}
function nextRound() {
  if (N.stage !== 'roundEnd') return;
  if (N.round >= ROUNDS) return endNight();
  N.coins += INCOME + (N.last.ok ? QUOTA_BONUS : 0);
  N.round++; N.stage = 'shop'; unsel();
  rollShop(); save(); renderNight();
}
function endNight() {
  const hp = nightHP(S.day), beaten = N.score >= hp, drop = MONSTERS[N.mon].drop;
  const drops = N.met + (beaten ? 2 : 0);
  S.stock[drop] = (S.stock[drop] || 0) + drops;
  Object.assign(S.today, { score: N.score, beaten, drop, drops, flashes: N.flashes.slice() });
  N.stage = 'end';
  save(); renderNight();
}

/* まぜる演出（約1.5秒）：まわりが暗く → 2枚がシュッと飛び出して、まんなかで止まって（ヒットストップ）ガキーン → 火花・光 → できたカードがくるっと出て名前の札 → マスへ。終わったら done */

    const keys = [
      { transform: 'translate(0,0) scale(1) rotate(0deg)', easing: 'cubic-bezier(.2,1.6,.4,1)' },
      { transform: `translate(${side * 12}px,-34px) scale(1.18) rotate(${side * 10}deg)`, offset: .3, easing: 'cubic-bezier(.7,0,1,.5)' },
      { transform: `translate(${cx + side * S * 0.95 - f.x}px,${ty}px) scale(${k}) rotate(${side * 16}deg)`, offset: .84 },
      { transform: `translate(${cx + side * S * 0.2 - f.x}px,${ty}px) scale(${k * 1.08},${k * .94}) rotate(${side * 3}deg)` },
    ];
    [2, 1, 0].forEach(g => {
      const el = card(cid, f, f.w, g ? 'ghost g' + g : '');
      el.animate(keys, { duration: FLY, delay: g * 45, fill: 'both' });
      moving.push(el);
    });
  });
  setTimeout(() => ov.classList.add('touch'), FLY);   // ぶつかった所で光って止まる（ヒットストップ）
  /* ガキーン：白く光って、大きくゆれて、光の輪と線と火花。できたカードがくるっと出て、名前の札 */
  let R;
  setTimeout(() => {
    ov.classList.add('hit');
    replay(document.querySelector('.night'), 'quake2');
    heroFor('joy', HOLD + LAND + 300);
    moving.forEach(el => el.animate([{ opacity: el.classList.contains('ghost') ? .4 : 1 }, { opacity: 0 }], { duration: 120, fill: 'forwards' }));
    sparks(cx, cy, star === 3 ? 28 : 20, S * 1.7);
    R = card(cr, { x: cx, y: cy }, RW, 'mf-res');
    R.insertAdjacentHTML('beforeend', '<i class="mf-shine"></i>');
    R.animate([{ transform: 'perspective(700px) rotateY(-110deg) scale(.4)', opacity: 0 },
      { transform: 'perspective(700px) rotateY(14deg) scale(1.2)', opacity: 1, offset: .6 },
      { transform: 'perspective(700px) rotateY(0deg) scale(1)', opacity: 1 }], { duration: 460, easing: 'ease-out', fill: 'forwards' });
  }, HIT);
  /* できたカードが、調理台のマスへ飛んでいく → ついたら小さい火花 */
  setTimeout(() => {
    ov.classList.add('land');
    const t = tc.getBoundingClientRect(), k = tc.offsetWidth / RW;
    R.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${t.left + t.width / 2 - cx}px,${t.top + t.height / 2 - cy}px) scale(${k}) rotate(-6deg)`, opacity: .9 }],
      { duration: LAND, easing: 'cubic-bezier(.5,0,.9,.5)', fill: 'forwards' });
  }, HIT + HOLD);
  setTimeout(() => {
    const t = tc.getBoundingClientRect();
    R.remove(); end(); sparks(t.left + t.width / 2, t.top + t.height / 2, 10, 46);
    setTimeout(() => ov.remove(), 950);
  }, HIT + HOLD + LAND);
}

/* ほのかの立ち絵：バトルは右向きのかまえ。表情の絵は左向きなので左右反転して右向きにする */
const HERO = { battle: ['honoka-battle', false], joy: ['honoka-joy', true], surprise: ['honoka-surprise', true], oops: ['honoka-oops', true] };
function heroPick(k) { const [n, flip] = HERO[k]; return ART[n] ? { src: ART[n], flip } : { src: ART.honoka || big(CHEF_SPR[0], 8), flip: !!ART.honoka }; }
function heroImg(k) { const h = heroPick(k); return `<img class="chef${ART.honoka ? ' hi' : ''}${h.flip ? ' flip' : ''}" id="chef" src="${h.src}" alt="炎のシェフ ほのか">`; }
let heroT = 0;
function heroFor(k, ms) {
  const el = $('chef'); if (!el) return;
  const set = kk => { const h = heroPick(kk); el.src = h.src; el.classList.toggle('flip', h.flip); };
  set(k); clearTimeout(heroT); heroT = setTimeout(() => set('battle'), ms);
}
const MON_URL = {};
const monURL = id => MON_URL[id] || (MON_URL[id] = ART['mon-' + id] || big(MON_SPR[id], 8));
const monIsArt = id => !!ART['mon-' + id];
function heatCells() { return Array.from({ length: HEAT_MAX }, () => '<i></i>').join(''); }

/* ---------- タップで大きく見る画面（カード＋説明＋ボタン）とラウンドの結果 ---------- */
function viewerHTML() {

/* うる（1ラウンド目の★1は「もどす」＝無料の枠がもどる） */

/* 手札：左に手持ち（まぜてできた自分のカード・ふちが金）、右に仕入れ。扇形に並べる。ドラッグで調理台へ・カードどうしをかさねるとまぜる */
function handHTML() {

function barHTML() {

    : `<span class="orb" title="コイン"><i>コイン</i><b>${N.coins}</b></span>
    <button class="pill sub" data-act="reroll" ${N.coins < REROLL ? 'disabled' : ''}>入れかえ <small>${REROLL}</small></button>`;

    <div class="sellzone" data-drop data-w="sell" data-i="0"><b>ここで うる</b><span id="sellv"></span></div>`;

      <div class="ov-heat"><span class="heat-label" id="heatLabel"></span><div class="heat-bar" id="heatBar">${heatCells()}</div></div></div>

/* ---- src/js/drag.js ---- */
/* ==== ドラッグ：手札・調理台・「場」のカードを指でつかんで、はなした所で決まる（決まりは night.js の dropPlan・dropCard）
   置く・うごかす（バトルを押すまでいつでも）・まぜる（カードどうしをかさねる）・うる（下の「ここで うる」）
   指が少ししか動かなければタップ（大きく見る）。つかんでいるあいだ、行き先が光り、上の札に「はなすと どうなるか」を出す ==== */
let DRAG = null, dragEnd = 0;
const DRAG_MIN = 8;

function dragInit(root) {
  root.addEventListener('dragstart', e => e.preventDefault());   // 絵をつかんだときの、ブラウザのドラッグをとめる
  root.addEventListener('pointerdown', e => {
    const el = e.target.closest('[data-drag]');
    if (!el || DRAG || busy || !N || S.phase !== 'night' || N.stage !== 'shop' || (e.pointerType === 'mouse' && e.button !== 0)) return;
    DRAG = { p: { where: el.dataset.w, i: +el.dataset.i }, el, x0: e.clientX, y0: e.clientY, id: e.pointerId, on: false };
  });
  addEventListener('pointermove', e => {
    const D = DRAG; if (!D || e.pointerId !== D.id) return;
    if (!D.on) {
      if (Math.hypot(e.clientX - D.x0, e.clientY - D.y0) < DRAG_MIN) return;
      if (busy || N.stage !== 'shop') { DRAG = null; return; }
      dragBegin(D);
    }
    e.preventDefault();
    dragMove(D, e.clientX, e.clientY);
  }, { passive: false });
  addEventListener('pointerup', e => {
    const D = DRAG; if (!D || e.pointerId !== D.id) return;
    DRAG = null; if (D.on) dragFinish(D);
  });
  addEventListener('pointercancel', e => {
    const D = DRAG; if (!D || e.pointerId !== D.id) return;
    DRAG = null; if (D.on) { dragClean(D); dragEnd = Date.now(); }
  });
}

function dragBegin(D) {
  D.on = true;
  const p = D.p, pc = D.el.querySelector('.pc'), r = pc.getBoundingClientRect();
  D.cid = p.where === 'field' ? 'b:' + N.field : cardAt(p).cid;
  D.w = Math.max(r.width, 78); D.h = D.w * 1.4;
  D.home = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  const g = document.createElement('div');
  g.className = 'dragghost'; g.innerHTML = cardMini(D.cid); g.style.width = D.w + 'px';
  document.body.appendChild(g); D.g = g;
  const tip = document.createElement('div');
  tip.className = 'dragtip'; document.body.appendChild(tip); D.tip = tip;
  D.el.classList.add('lifted');
  const sec = document.querySelector('.night');
  if (sec) { sec.classList.add('dragging'); if (p.where !== 'shop') sec.classList.add('drag-own'); }
  /* 行き先を光らせる：put（置く・うごかす）・swap（入れかえ）・can（まぜる）・cant（まぜられるけど、お金や手札がたりない） */
  D.zones = [...document.querySelectorAll('[data-drop]')].map(z => {
    const q = { where: z.dataset.w, i: +z.dataset.i }, P = dropPlan(p, q);
    if (P) z.classList.add(P.kind === 'mix' ? (P.ng ? 'cant' : 'can') : P.kind === 'sell' ? 'sellok' : P.kind === 'move' && P.swap ? 'swap' : 'put');
    return { z, q, P };
  });
  const v = sellValue(cardDef(D.cid)), sv = $('sellv');
  if (sv) sv.textContent = v ? `+${v}` : '（無料の枠がもどる）';
  /* 調理台の上では、つかんだカードを調理台のマスと同じ大きさに（調理台が見えるように） */
  const tl = document.querySelector('.tiles'), sl = document.querySelector('.tslot');
  D.tiles = tl && tl.getBoundingClientRect(); D.small = sl ? sl.offsetWidth / D.w : 1; D.k = 1;
  D.over = undefined;
}

function dragMove(D, x, y) {
  D.x = x; D.y = y;
  /* 位置は translate・大きさは scale（指の所を中心に小さくなるだけ。transform に translate を書くと scale で位置までずれる） */
  D.g.style.translate = `${x - D.w / 2}px ${y - D.h * 0.8}px`;   // まっすぐ持つ（11/17 しょーくん）
  const k = D.tiles && y > D.tiles.top - 30 && y < D.tiles.bottom + 30 ? D.small : 1.06;
  if (k !== D.k) { D.k = k; D.g.style.scale = k; }
  const hit = document.elementFromPoint(x, y), z = hit && hit.closest('[data-drop]');
  const Z = D.zones.find(o => o.z === z && o.P) || null;
  if (Z === D.over) return;
  if (D.over) D.over.z.classList.remove('over');
  D.over = Z; if (Z) Z.z.classList.add('over');
  D.tip.innerHTML = tipHTML(D.cid, Z && Z.P);
  D.g.classList.toggle('hot', !!(Z && Z.P.kind === 'mix' && !Z.P.ng));
}

/* つかんでいるあいだの札：まぜるならできるカードと効果、ほかは「はなすと どうなるか」 */
function tipHTML(cid, P) {
  const d = cardDef(cid);
  if (P && P.kind === 'mix') {
    const r = cardDef(P.r.cid), flash = !P.ng && r.star === 2 && r.food && S.recipes[P.r.cid.slice(2)] == null;
    const price = P.P.n ? `（${N.round === 1 ? `無料${P.P.n}まい` : `コイン${P.P.cost}`}）` : '';
    return `<span class="dt-card">${cardMini(P.r.cid)}</span><div class="dt-body"><p class="dt-main">${'★'.repeat(r.star)} ${esc(r.name)}</p>
      <p class="dt-sub">${P.ng ? `<em>${esc(P.ng)}</em>` : `はなすと まぜる${price}${P.P.to.where === 'held' ? '・手札へ' : ''}`}</p>
      <p class="dt-fx">${esc(fxText(r.fx, r.star))}</p>${flash ? '<p class="dt-flash">レシピがひらめく！</p>' : ''}</div>`;
  }
  const t = !P ? (d.cat === 'field' ? '左の「場」へ' : mixRule(d))
    : P.kind === 'buy' ? (P.ng ? `<em>${esc(P.ng)}</em>` : `はなすと ${N.round === 1 ? 'えらぶ（無料）' : `買う（コイン${P.cost}）`}`)
    : P.kind === 'place' ? 'はなすと 置く'
    : P.kind === 'move' ? (P.swap ? 'はなすと 入れかえ' : 'はなすと うごかす')
    : P.v ? `はなすと うる（+${P.v}）` : 'はなすと もどす（無料の枠がもどる）';
  return `<span class="dt-card">${cardMini(cid)}</span><div class="dt-body"><p class="dt-main">${esc(d.short)}</p><p class="dt-sub">${t}</p></div>`;
}

function dragFinish(D) {
  const Z = D.over;
  dragEnd = Date.now();
  if (!Z || !Z.P) {   // 行き先がなければ、もとの場所へもどる
    const g = D.g; D.g = null; dragClean(D);
    if (g && D.x != null && g.animate) {
      g.animate([{ translate: g.style.translate, scale: String(D.k) }, { translate: `${D.home.x - D.w / 2}px ${D.home.y - D.h * 0.8}px`, scale: '1', opacity: .4 }], { duration: 160, easing: 'ease-in', fill: 'forwards' });
      setTimeout(() => g.remove(), 170);
    } else if (g) g.remove();
    return;
  }
  const gr = D.g.getBoundingClientRect();
  const from = [{ x: gr.left + gr.width / 2, y: gr.top + gr.height / 2, w: D.w * D.k }, cardSpot(Z.q)];
  dragClean(D);
  if (dropCard(D.p, Z.q, from) && Z.P.kind === 'buy') {
    const t = document.querySelector(Z.q.where === 'board' ? `.tslot[data-w="board"][data-i="${Z.q.i}"] .pc` : '.fslot .pc');
    if (t) replay(t, 'born');
  }
}

function dragClean(D) {
  if (D.g) D.g.remove();
  if (D.tip) D.tip.remove();
  D.el.classList.remove('lifted');
  const sec = document.querySelector('.night'); if (sec) sec.classList.remove('dragging', 'drag-own');
  (D.zones || []).forEach(o => o.z.classList.remove('can', 'cant', 'put', 'swap', 'sellok', 'over'));
}

/* ---- src/js/morning.js ---- */
/* ==== 朝：ひらめいたレシピとふしぎな材料でお菓子を作る → カードにするか、お昼に売るか ==== */
const OVENS = 3, BATCH = 3;   // 朝に焼けるのは3回。1回で3こ（売るとき）

function goMorning() {
  S.phase = 'morning'; S.morning = { ovens: OVENS, cur: null };
  save(); render();
}
function canBake(key) {
  const need = {};
  for (const m of recipeOf(key).needs) need[m] = (need[m] || 0) + 1;
  return Object.keys(need).every(m => (S.stock[m] || 0) >= need[m]);
}
function bakeRecipe(key) {
  const M = S.morning;
  if (!S.recipes[key] && S.recipes[key] !== 0) return;
  if (M.cur) return toast('できたお菓子を先にえらんでね');
  if (M.ovens <= 0) return toast('オーブンはもう使いきったよ');
  if (!canBake(key)) return toast('ふしぎな材料がたりない');
  for (const m of recipeOf(key).needs) S.stock[m]--;
  M.ovens--; M.cur = key; S.today.made.push(key);
  save(); renderMorning();
}
function toCard() {
  const M = S.morning; if (!M.cur) return;
  S.pool.push('o:' + M.cur);
  toast(`${recipeOf(M.cur).name}をカードにした。夜の仕入れに出てくるよ`);
  M.cur = null; save(); renderMorning();
}
function toShelf() {
  const M = S.morning; if (!M.cur) return;
  const s = S.shelf.find(x => x.key === M.cur);
  if (s) s.n += BATCH; else S.shelf.push({ key: M.cur, n: BATCH });
  toast(`${recipeOf(M.cur).name}を棚に並べた`);
  M.cur = null; save(); renderMorning();
}
function tasteTags(r) { return r.tastes.map(t => `<span class="tag">${t}</span>`).join(''); }
function renderMorning() {
  const M = S.morning;
  const keys = Object.keys(S.recipes).sort((a, b) => (S.recipes[b] - S.recipes[a]) || a.localeCompare(b));
  const fus = Object.keys(MATS).filter(m => MATS[m].fushigi && S.stock[m] > 0);
  let cur = '';
  if (M.cur) {
    const r = recipeOf(M.cur), d = cardDef('o:' + M.cur);
    cur = `<div class="panel made"><img class="candy" src="${candyURL(M.cur)}" alt="">
      <div><h2>${esc(r.name)}ができた！</h2><div class="tags">${tasteTags(r)}</div>
      <p>カードにすると：${fxText(d.fx)}</p><p>売ると：1こ ${r.price}円（すきな味のお客さんには倍）</p></div></div>
      <div class="row two"><button data-act="toCard">カードにする</button><button data-act="toShelf">お昼に売る（${BATCH}こ）</button></div>`;
  }
  $('screen').innerHTML = `<section class="morning fit">
    <div class="panel tight"><h2>朝の仕込み</h2><p>ひらめいたレシピでお菓子を作ろう。カードにすると夜の仕入れに出てきて、売るとお金になるよ</p></div>
    <div class="stockline"><span>オーブン あと<b>${M.ovens}</b>回</span>
      <span class="fus">${fus.length ? fus.map(m => `<img src="${matURL(m)}" alt="">${MATS[m].name}×${S.stock[m]}`).join(' ') : 'ふしぎな材料はなし'}</span></div>
    ${fus.some(m => !keys.some(k => recipeOf(k).needs.includes(m))) ? `<p class="muted">${fus.filter(m => !keys.some(k => recipeOf(k).needs.includes(m))).map(m => MATS[m].name).join('・')}のレシピは、夜にそのカードを食材のとなりに置くとひらめくよ</p>` : ''}
    ${cur}
    <div class="recipes">${keys.map(k => {
      const r = recipeOf(k), ok = canBake(k) && M.ovens > 0 && !M.cur;
      return `<button class="recipe" data-act="bakeRecipe" data-key="${k}" ${ok ? '' : 'disabled'}>
        <img class="candy" src="${candyURL(k)}" alt="">
        <span class="rbody"><span class="rn">${esc(r.name)}${S.recipes[k] === S.day ? '<em>NEW</em>' : ''}</span>
        <span class="rm">${r.mats.map(m => `<img src="${matURL(m)}" alt="${MATS[m].name}">`).join('+')} ${tasteTags(r)}</span>
        ${r.needs.length ? `<span class="rneed">${r.needs.map(m => MATS[m].name).join('と')}を使う</span>` : ''}</span></button>`;
    }).join('')}</div>
    <button class="big" data-act="openShop" ${M.cur ? 'disabled' : ''}>お店をあける</button>
  </section>`;
}

/* ---- src/js/day.js ---- */
/* ==== 昼：棚1つでお菓子を売る → 1日のまとめ ====
   お客さんはすきな味が2つ。棚にすきな味のお菓子があれば2倍の値段で買ってハート（3つで常連さん）
   なければ6わりの人がほかのお菓子を買う */
const HEART = '\u2665\uFE0E';   // 絵文字にならないように文字の形で
const CUST_BASE = 6, LIKE_MUL = 2, OTHER_BUY = 0.6;
let dayTimer = 0;

function goDay() {
  S.phase = 'day';
  S.dayRun = { i: 0, total: CUST_BASE + Math.min(4, S.day - 1), log: [], done: false };
  scn.cust = []; scn.speed = 1;
  save(); render();
}
function addLog(text, cls = '') {
  S.dayRun.log.push([text, cls]);
  const ol = $('dayLog');
  if (ol) { const li = document.createElement('li'); li.className = cls; li.textContent = text; ol.prepend(li); }
}
function serve(c) {
  const items = S.shelf.filter(s => s.n > 0), T = S.today;
  T.visitors++;
  if (!items.length) { addLog(`${c.name}：売り切れで帰っちゃった`, 'no'); return 'none'; }
  const liked = items.filter(s => recipeOf(s.key).tastes.some(t => c.likes.includes(t)));
  let s = null, p = 0, love = false;
  if (liked.length) { s = liked.sort((a, b) => recipeOf(b.key).price - recipeOf(a.key).price)[0]; p = recipeOf(s.key).price * LIKE_MUL; love = true; }
  else if (Math.random() < OTHER_BUY) { s = pick(items); p = recipeOf(s.key).price; }
  if (!s) { addLog(`${c.name}：すきな味（${c.likes.join('・')}）がなかった`, 'no'); return 'none'; }
  s.n--; S.shelf = S.shelf.filter(x => x.n > 0);
  S.money += p; T.sales += p; T.served++;
  const name = recipeOf(s.key).name;
  if (love) {
    S.hearts[c.id] = (S.hearts[c.id] || 0) + 1;
    addLog(`${c.name}が${name}を気に入って買った ${p}円 ${HEART}`, 'love');
    if (S.hearts[c.id] === HEARTS_REGULAR && !S.regulars.includes(c.id)) {
      S.regulars.push(c.id); T.newRegulars.push(c.id);
      setTimeout(() => toast(`${c.name}が常連さんになった！`), 300);
    }
  } else addLog(`${c.name}が${name}を買った ${p}円`);
  return love ? 'heart' : s.key;
}
function runCustomers() {
  clearTimeout(dayTimer);
  const R = S.dayRun; if (!R || R.done || S.phase !== 'day') return;
  if (R.i >= R.total) { R.done = true; save(); return renderDay(); }
  const c = pick(CUSTOMERS), sp = () => scn.speed;
  const who = { id: c.id, x: 100, tx: 72 - rand(10), bub: null };
  scn.cust.push(who);
  dayTimer = setTimeout(() => {
    const res = serve(c);
    who.bub = res;
    R.i++; save(); updateDayInfo();
    dayTimer = setTimeout(() => {
      who.bub = null; who.tx = 104; who.gone = true;
      dayTimer = setTimeout(runCustomers, 350 / sp());
    }, 900 / sp());
  }, 1100 / sp());
}
function updateDayInfo() {
  const R = S.dayRun, el = $('dayInfo'); if (!el) return;
  el.innerHTML = `お客さん <b>${R.i}</b>/${R.total}　売上 <b>${fmt(S.today.sales)}</b>円`;
  const sh = $('shelfList');
  if (sh) sh.innerHTML = shelfHTML();
  const m = $('money'); if (m) m.textContent = fmt(S.money) + '円';
}
function shelfHTML() {
  return S.shelf.length ? S.shelf.map(s => `<span class="item"><img src="${candyURL(s.key)}" alt="">${esc(recipeOf(s.key).name)} ×${s.n}</span>`).join('') : '<span class="muted">棚はからっぽ</span>';
}
function toggleFast() {
  scn.speed = scn.speed === 1 ? 3 : 1;
  const b = document.querySelector('[data-act="fast"]'); if (b) b.textContent = scn.speed === 1 ? 'はやおくり' : 'ふつうの速さ';
}
function renderDay() {
  const R = S.dayRun;
  $('screen').innerHTML = `<section class="day fit">
    <div class="scene-wrap"><canvas id="scene" width="${SW}" height="${SH}"></canvas></div>
    <div class="panel tight"><h2>お昼の販売</h2><p id="dayInfo"></p></div>
    <div class="shelf"><span class="lbl">棚</span><div id="shelfList"></div></div>
    <ol class="log" id="dayLog">${R.log.slice().reverse().map(([t, c]) => `<li class="${c}">${esc(t)}</li>`).join('')}</ol>
    ${R.done ? '<button class="big" data-act="toResult">1日のまとめへ</button>' : `<div class="row"><button class="sub" data-act="fast">${scn.speed === 1 ? 'はやおくり' : 'ふつうの速さ'}</button></div>`}
  </section>`;
  mountScene('day'); updateDayInfo();
  if (!R.done && !scn.cust.length) runCustomers();
}

/* ---------- 1日のまとめ ---------- */
function goResult() { clearTimeout(dayTimer); S.phase = 'result'; save(); render(); }
function nextDay() { S.day++; startNight(); }
function renderResult() {
  const T = S.today, mon = MONSTERS[(T.day - 1) % MONSTERS.length];
  const hearts = CUSTOMERS.map(c => `<li><span>${c.name}</span><span class="hearts">${HEART.repeat(Math.min(HEARTS_REGULAR, S.hearts[c.id] || 0))}<i>${HEART.repeat(Math.max(0, HEARTS_REGULAR - (S.hearts[c.id] || 0)))}</i></span>${S.regulars.includes(c.id) ? '<em>常連さん</em>' : ''}</li>`).join('');
  $('screen').innerHTML = `<section class="result">
    <div class="panel"><h2>${T.day}日目のまとめ</h2>
      <dl>
        <dt>夜</dt><dd>${esc(mon.name)}　スコア ${fmt(T.score)}　${T.beaten ? '撃退！' : 'にげられた'}</dd>
        <dt>材料</dt><dd>${T.drop ? `${MATS[T.drop].name} ×${T.drops}` : 'なし'}</dd>
        <dt>ひらめき</dt><dd>${T.flashes.length ? T.flashes.map(k => esc(recipeOf(k).name)).join('、') : 'なし'}</dd>
        <dt>仕込み</dt><dd>${T.made.length ? T.made.map(k => esc(recipeOf(k).name)).join('、') : 'なし'}</dd>
        <dt>お昼</dt><dd>売上 ${fmt(T.sales)}円（${T.served}/${T.visitors}人が買った）</dd>
        <dt>お金</dt><dd class="gold">${fmt(S.money)}円</dd>
      </dl></div>
    <div class="panel"><h2>お客さんのハート</h2><ul class="heartlist">${hearts}</ul>
      <p class="muted">常連さんは、これから仲間になって夜にいっしょに戦えるようになる予定</p></div>
    <button class="big" data-act="nextDay">${S.day + 1}日目の夜へ</button>
  </section>`;
}

/* ---- src/js/main.js ---- */
/* ==== はじまり：画面の切りかえ・タイトル・タップのうけつけ ==== */
const PHASE_NAME = { night: '夜', morning: '朝', day: '昼', result: 'まとめ' };
let resetArm = false;

function renderTop() {
  $('dayLabel').textContent = S.phase === 'title' ? '' : `${S.day}日目　${PHASE_NAME[S.phase] || ''}`;
  $('money').textContent = S.phase === 'title' ? '' : fmt(S.money) + '円';
}
function renderTitle() {
  const saved = load();
  const chef = ART.honoka || big(CHEF_SPR[0], 5), mon = ART['mon-slime'] || big(MON_SPR.slime, 3);
  $('screen').innerHTML = `<section class="title">
    <h1>まぜまぜ<br>おかし屋</h1>
    <div class="hero"><img src="${chef}" alt="炎のシェフ ほのか"><img src="${mon}" alt="ぷるぷるスライム"></div>
    <p>炎のシェフ ほのか（仮）の小さなおかし屋さん。<br>夜になると、食材モンスターがお店をおそいにくる！</p>
    <ul class="howto"><li><b>夜</b>　カードを調理台に並べて、9ラウンドで撃退。食材★1どうしをまぜると★2のお菓子になって、レシピがひらめく</li>
      <li><b>朝</b>　ひらめいたレシピでお菓子づくり。カードにするか、売るか</li>
      <li><b>昼</b>　棚に並べて販売。すきな味だとお客さんが常連さんに</li></ul>
    ${saved && saved.phase !== 'title' ? `<button class="big" data-act="continue">つづきから（${saved.day}日目）</button>
      <button class="sub" data-act="reset">${resetArm ? 'ほんとうに はじめから？（もう一度タップ）' : 'はじめから'}</button>` : '<button class="big" data-act="start">はじめる</button>'}
  </section>`;
}
function render() {
  renderTop();
  if (S.phase === 'night') renderNight();
  else if (S.phase === 'morning') renderMorning();
  else if (S.phase === 'day') renderDay();
  else if (S.phase === 'result') renderResult();
  else renderTitle();
  $('screen').scrollTop = 0;
}

const ACTS = {
  start: () => { S = newState(); startNight(); },
  continue: () => { const s = load(); if (s) { S = s; if (S.phase === 'night' && S.night && S.night.stage === 'roundEnd') busy = false; render(); } },
  reset: () => { if (!resetArm) { resetArm = true; return renderTitle(); } resetArm = false; S = newState(); startNight(); },
  card: el => tapCard(el.dataset.w, +el.dataset.i),
  close: () => closeView(),
  noop: () => {},
  buy: el => buy(+el.dataset.i),
  sell: () => sell(),
  reroll: () => reroll(),
  bake: () => bake(),
  next: () => nextRound(),
  toMorning: () => goMorning(),
  bakeRecipe: el => bakeRecipe(el.dataset.key),
  toCard: () => toCard(),
  toShelf: () => toShelf(),
  openShop: () => goDay(),
  fast: () => toggleFast(),
  toResult: () => goResult(),
  nextDay: () => nextDay(),
};
function boot(data) {
  const s = data && data.S ? sanitize(data.S) : null;
  S = s || newState();
  if (!s) S.phase = 'title';
  $('screen').addEventListener('click', e => {
    if (Date.now() - dragEnd < 350) return;   // ドラッグのあとのクリックは無視
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const f = ACTS[el.dataset.act]; if (f) f(el);
    renderTop();
  });
  dragInit($('screen'));
  render();
}
/* アーティファクトを開いたまま更新されたとき、遊んでいる所から続ける */
try { if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => ({ S })); } catch (e) { /* なくてよい */ }
const H = window.claude && window.claude.hot;
if (H && H.ready) H.ready(boot); else boot(H && H.data ? H.data : {});

})();
</script>
