<!doctype html>
<!-- 自動で作るファイル・手で直さない（直すのは src/。node tools/build.mjs で作る） -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="夜は食材モンスターをカードで撃退、朝はひらめいたレシピでお菓子づくり、昼はお店で販売。ドット絵のお菓子屋さんゲーム。">
<meta name="theme-color" content="#1b1530">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>まぜまぜおかし屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 縦長1画面：上に日付とお金、まん中に今の場面（夜のバトル・朝の仕込み・昼の販売・まとめ）。
   夜・朝・昼はスマホ1画面に収める（.fit：絵がのびちぢみし、リストだけ中でスクロール）。
   夜のお店という1つの世界なので、暗い色だけで作る（明るいテーマに切りかえない） */
:root{
  --night:#1b1530;   /* 夜のお店の壁 */
  --panel:#272042;
  --panel-2:#352b58;
  --line:#4c3f74;
  --milk:#fbf0f4;
  --milk-soft:#c8b9d9;
  --card:#fff3e3;    /* カードの紙 */
  --ink:#3a2318;
  --ink-soft:#7a5a4a;
  --ember:#ff8a3d;   /* ほのかの炎 */
  --ember-dk:#c4521c;
  --gold:#f6c94c;
  --berry:#e0507a;
  --mint:#7fd6c0;
  --steel:#8fb3d9;
  --scene-bg:#241b3d;
  --font:"DotGothic16","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--milk);font-family:var(--font);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 8px}
#top{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:2px 4px;min-height:24px}
#dayLabel{font-size:14px;color:var(--milk-soft)}
#money{font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums}
#screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#screen>section{display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
#screen>section.fit{height:100%;gap:6px;padding-bottom:0}
h1,h2,h3{font-weight:normal;margin:0;text-wrap:balance}
h2{font-size:16px;color:var(--gold)}
p{margin:0;line-height:1.5;font-size:13px}
small{font-size:11px;color:var(--milk-soft)}
b{font-weight:normal;color:var(--gold)}
.muted{color:var(--milk-soft);font-size:12px}

/* ボタン */
button{font-family:var(--font);font-size:15px;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.big{width:100%;flex:none;font-size:19px;padding:10px;background:var(--ember);color:#2b120a;border-color:#2b120a;box-shadow:0 4px 0 #2b120a}
.sub{background:var(--panel-2);color:var(--milk);border-color:var(--line);box-shadow:0 3px 0 #120e22}
.sm{font-size:13px;padding:4px 10px;box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.sub.sm{box-shadow:0 2px 0 #120e22}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.two>button{flex:1}
.hint{font-size:11px;color:var(--milk-soft)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.panel.tight{padding:8px 10px;gap:4px;flex:none}

/* 場面の絵：幅いっぱい（高さが足りないときは小さく） */
.scene-wrap{position:relative;flex:1 1 0;min-height:72px;max-height:calc((min(100vw, 460px) - 32px) / 2);border:2px solid var(--line);border-radius:4px;overflow:hidden;background:var(--scene-bg)}
.day .scene-wrap{background:#fbe3d4}
.scene-wrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
#floats{position:absolute;inset:0;pointer-events:none}
.ov-top,.ov-heat{position:absolute;left:6px;right:6px;display:flex;align-items:center;gap:8px;font-size:12px;text-shadow:1px 1px 0 #120e22,-1px 1px 0 #120e22;pointer-events:none}
.ov-top{top:3px;justify-content:space-between}
.ov-top .score b{font-size:22px;font-variant-numeric:tabular-nums}
.ov-heat{bottom:4px}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:13px;color:var(--gold);text-shadow:1px 1px 0 #1b0f08,-1px 1px 0 #1b0f08;white-space:nowrap;pointer-events:none;animation:up .95s ease-out forwards;z-index:3}
.float.big{left:64%;top:30%;font-size:22px}
.float.koge{color:var(--milk-soft);top:-4px}
@keyframes up{from{opacity:1;translate:0 0}to{opacity:0;translate:0 -24px}}

/* 火力 */
.heat-bar{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.heat-bar i{height:7px;background:rgba(18,14,34,.75);border-radius:1px}
.heat-bar i.on.z0{background:#f3c58a}.heat-bar i.on.z1{background:var(--ember)}.heat-bar i.on.z2{background:#e8402a}.heat-bar i.on.z3{background:#0d0a14;box-shadow:inset 0 0 0 1px var(--milk-soft)}
.heat-label{min-width:4.2em}
.heat-label.z1{color:var(--ember)}.heat-label.z2{color:#ff6a4a}.heat-label.z3{color:var(--milk-soft)}

/* ノルマ */
.quota{flex:none;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--milk-soft)}
.qbar{flex:1;height:6px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--gold);transition:width .25s}

/* カード */
.card{position:relative;min-width:0;width:100%;height:100%;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 2px;text-align:center;overflow:hidden}
.card .band{position:absolute;inset:0 0 auto;height:4px}
.card.k-m .band{background:var(--ember)}.card.k-f .band{background:var(--mint)}.card.k-t .band{background:var(--steel)}.card.k-o .band{background:var(--berry)}
.card.k-s{background:#fff6cf;border-color:#8a5a10}.card.k-s .band{background:var(--gold)}
.card img{width:28px;height:28px;image-rendering:pixelated;flex:none}
.card .nm{font-size:10px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .rk{position:absolute;top:4px;right:2px;font-size:9px;letter-spacing:-1px;color:var(--ember-dk)}
.card.fire{animation:fire .38s}
.card.born{animation:born .5s ease-out}
@keyframes fire{50%{transform:translateY(-5px) scale(1.07);box-shadow:0 0 0 3px var(--ember)}}
@keyframes born{0%{transform:scale(.5);box-shadow:0 0 0 6px var(--gold)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.slot{position:relative;min-width:0;padding:0;background:transparent;border:2px dashed var(--line);border-radius:4px;box-shadow:none;color:var(--milk-soft)}
.slot:has(.card){border:none}
.slot.sel .card,.shopcard.sel .card{outline:3px solid var(--gold);outline-offset:1px}
.slot.can .card{box-shadow:0 0 0 3px var(--mint);animation:glow .9s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 3px rgba(127,214,192,.35)}}
.board{flex:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.board .slot{aspect-ratio:3/4}
.fridge{flex:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;align-items:stretch}
.fridge .lbl{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--steel);border:2px solid var(--steel);border-radius:4px;writing-mode:vertical-rl;letter-spacing:2px}
.fridge .slot{aspect-ratio:1/1;border-color:#3d4f72}
.fridge .card{justify-content:center;padding-top:5px}
.fridge .card .nm{display:none}
.fridge .wallet{grid-column:span 2;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:2px;font-size:12px}
.fridge .wallet b{font-size:20px}
.fieldchip{font-size:11px;color:var(--ember);border:1px solid var(--ember-dk);border-radius:3px;padding:1px 6px;white-space:nowrap}
.shoprow{flex:none;display:flex;gap:6px;min-height:0}
.shop{flex:1;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:5px}
.shopcard{min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:0;background:transparent;border:none;box-shadow:none;color:var(--milk)}
.shopcard .card{height:58px}
.shopcard .card .nm{-webkit-line-clamp:1;font-size:11px}
.shopcard .cost{font-size:11px;color:var(--gold);text-align:center;line-height:1.2}
.soldout{border:2px dashed var(--panel-2);border-radius:4px;min-height:58px}
.reroll{flex:none;width:44px;padding:4px 2px;font-size:12px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.reroll small{color:var(--gold);font-size:12px}
.action{flex:none;display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:6px;height:92px}
.action .info{min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:5px 8px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.action .ttl{font-size:14px}
.action p{font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.action .btns{display:flex;gap:6px;align-items:center;margin-top:auto}
.go{height:100%;padding:4px;font-size:18px;background:var(--ember);color:#2b120a;border-color:#2b120a;box-shadow:0 4px 0 #2b120a}

/* フィールドをえらぶ */
.fields{display:flex;flex-direction:column;gap:6px;min-height:0;overflow-y:auto;flex:none}
.field{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--panel-2);color:var(--milk);border-color:var(--ember-dk);box-shadow:0 3px 0 #120e22;padding:8px 10px}
.field b{font-size:16px;color:var(--ember)}
.field span{font-size:12px;line-height:1.45}

/* 夜の結果 */
.end{align-items:center;text-align:center;flex:none}
.end.win h2{color:var(--ember)}
.bignum{font-size:32px;color:var(--gold);font-variant-numeric:tabular-nums}
.got{display:flex;align-items:center;gap:8px;font-size:15px}
.got img{width:30px;height:30px;image-rendering:pixelated}

/* 朝 */
.stockline{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.stockline .fus{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.stockline img,.rm img{width:20px;height:20px;image-rendering:pixelated;vertical-align:middle}
.recipes{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 2px 6px}
.recipe{flex:none;display:flex;align-items:center;gap:10px;text-align:left;padding:6px 10px}
.candy{width:40px;height:40px;image-rendering:pixelated;flex:none}
.rbody{display:flex;flex-direction:column;gap:2px;min-width:0}
.rn{font-size:14px}
.rn em{font-style:normal;font-size:10px;color:#fff;background:var(--berry);border-radius:2px;padding:0 4px;margin-left:6px}
.rm{font-size:12px;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.rneed{font-size:11px;color:#2f8a78}
.tag{font-size:10px;border:1px solid currentColor;border-radius:2px;padding:0 4px;color:var(--ember-dk)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.made{flex:none;flex-direction:row;align-items:flex-start;gap:10px;border-color:var(--gold);padding:8px 10px}
.made .candy{width:52px;height:52px}
.made .tag{color:var(--ember)}

/* 昼 */
.shelf{flex:none;display:flex;gap:10px;align-items:flex-start;font-size:12px}
.shelf .lbl{color:var(--milk-soft);flex:none}
#shelfList{display:flex;gap:4px 12px;flex-wrap:wrap}
#shelfList .item{display:flex;align-items:center;gap:4px}
#shelfList img{width:22px;height:22px;image-rendering:pixelated}
.log{flex:1;min-height:48px;list-style:none;margin:0;padding:6px 10px;background:var(--panel);border:2px solid var(--line);border-radius:4px;display:flex;flex-direction:column;gap:3px;font-size:12px;overflow-y:auto}
.log li{flex:none}
.log li.love{color:var(--gold)}
.log li.no{color:var(--milk-soft)}

/* まとめ */
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:13px}
dt{color:var(--milk-soft)}
dd{margin:0;min-width:0;line-height:1.45}
dd.gold{color:var(--gold);font-size:17px}
.heartlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.heartlist li{display:flex;gap:10px;align-items:center}
.heartlist li>span:first-child{width:7em}
.hearts{color:var(--berry);letter-spacing:2px}
.hearts i{font-style:normal;color:var(--panel-2)}
.heartlist em{font-style:normal;font-size:11px;color:var(--gold)}

/* タイトル */
.title{align-items:center;text-align:center;padding-top:6px}
.title h1{font-size:38px;line-height:1.15;color:var(--ember);text-shadow:3px 3px 0 #2b120a}
.hero{display:flex;align-items:flex-end;justify-content:center;gap:24px}
.hero img{image-rendering:pixelated;max-width:45%}
.howto{list-style:none;margin:0;padding:10px 12px;background:var(--panel);border:2px solid var(--line);border-radius:4px;display:flex;flex-direction:column;gap:6px;text-align:left;font-size:13px;line-height:1.5}

/* お知らせ（絵の上あたりに出す） */
#toast{position:absolute;left:50%;top:calc(44px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:7px 14px;font-size:14px;box-shadow:0 3px 0 var(--ink);z-index:20;pointer-events:none;text-align:center}
#toast.show{animation:pop .2s ease-out}
@keyframes pop{from{transform:translate(-50%,-8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top"><span id="dayLabel"></span><span id="money"></span></header>
  <main id="screen"></main>
  <div id="toast" role="status" hidden></div>
</div>
<script>
(() => {
'use strict';
/* ---- src/js/core.js ---- */
/* ==== 土台：小さな道具・ドット絵・セーブ・お知らせ ==== */
const KEY = 'mazemaze-okashiya', VER = 4;   // v:3 までは前の経営シミュレーション（読まずに新しく始める）
const $ = id => document.getElementById(id);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const REDUCED = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

/* 大きな数字：10万からは「万・億・兆・京」 */
function fmt(n) {
  n = Math.floor(n);
  if (n < 1e5) return n.toLocaleString('ja-JP');
  const units = [[1e16, '京'], [1e12, '兆'], [1e8, '億'], [1e4, '万']];
  for (const [u, s] of units) if (n >= u) {
    const v = n / u;
    return (v >= 1000 ? Math.floor(v).toLocaleString('ja-JP') : v >= 100 ? Math.floor(v) : v >= 10 ? (Math.floor(v * 10) / 10) : (Math.floor(v * 100) / 100)) + s;
  }
  return String(n);
}

/* ---------- ドット絵（前の版から） ---------- */
function fromMap(map, pal) {
  const h = map.length, w = Math.max(...map.map(r => r.length)), c = mk(w, h), x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < map[j].length; i++) {
    const k = map[j][i];
    if (k === '.' || !pal[k]) continue;
    x.fillStyle = pal[k]; x.fillRect(i, j, 1, 1);
  }
  return c;
}
function outline(src, col) {
  const w = src.width, h = src.height, d = src.getContext('2d').getImageData(0, 0, w, h).data;
  const a = (i, j) => (i < 0 || j < 0 || i >= w || j >= h) ? 0 : d[(j * w + i) * 4 + 3];
  const c = mk(w, h), x = c.getContext('2d');
  x.fillStyle = col;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    if (a(i, j)) continue;
    if (a(i - 1, j) || a(i + 1, j) || a(i, j - 1) || a(i, j + 1)) x.fillRect(i, j, 1, 1);
  }
  x.drawImage(src, 0, 0);
  return c;
}
function big(src, s) {
  const c = mk(src.width * s, src.height * s), x = c.getContext('2d');
  x.imageSmoothingEnabled = false; x.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL();
}

/* ---------- 状態とセーブ ---------- */
let S = null;
function newState() {
  return {
    v: VER, day: 1, phase: 'title', money: 0, chef: 'honoka',
    pool: [],                      // お菓子のカード（'o:材料+材料'）。夜の仕入れに出てくる
    recipes: { 'komugi+sato': 0 }, // 知っているレシピ（値はひらめいた日。0 は最初から）
    stock: {},                     // ふしぎな材料の数
    shelf: [],                     // 棚のお菓子 [{ key, n }]
    hearts: {}, regulars: [],      // お客さんのハートと常連さん
    night: null, morning: null, dayRun: null, today: null,
  };
}
function sanitize(o) {
  if (!o || typeof o !== 'object' || o.v !== VER) return null;
  const d = newState();
  for (const k in d) if (o[k] === undefined) o[k] = d[k];
  if (!Array.isArray(o.pool)) o.pool = [];
  if (!Array.isArray(o.shelf)) o.shelf = [];
  if (!Number.isFinite(o.day) || o.day < 1) o.day = 1;
  if (!Number.isFinite(o.money)) o.money = 0;
  return o;
}
function load() {
  try { const t = localStorage.getItem(KEY); return t ? sanitize(JSON.parse(t)) : null; } catch (e) { return null; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 保存できない環境ではそのまま遊ぶ */ }
}

/* ---------- お知らせ ---------- */
let toastT = 0;
function toast(msg, ms = 1900) {
  const el = $('toast'); if (!el) return;
  el.textContent = msg; el.hidden = false;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, ms);
}

/* ---- src/data/cards.js ---- */
/* ==== データ：材料・道具・フィールド・シェフ・レシピ ====
   fx（カードの動き）：dmg ダメージ／heat 火力を足す／first いちばん左のときだけ火力をさらに足す／set 火力をその数にする
   hd 火力×hd をダメージに足す／kd その夜に焦げた回数×kd をダメージに足す／nb となりの食材のダメージに足す
   next つぎにダメージを出すカードを×next／again 右どなりがもう1回うごく／proof 焦げてもダメージが出る（×6）
   shop 仕入れが+shop枚／coin ラウンドのおわりにコイン+coin
   ★：食材と道具は★1。食材★1＋★1をまぜると★2のお菓子、★2＋★2で★3のスペシャル（STAR_MUL 倍） */

const recipeKey = (a, b) => [a, b].sort().join('+');
function recipeOf(key) {
  const [a, b] = key.split('+'), A = MATS[a], B = MATS[b];
  const main = B.nr > A.nr ? B : A, other = main === A ? B : A;
  return {
    key, mats: [a, b],
    name: a === b ? A.adj + A.noun : other.adj + main.noun, noun: main.noun,
    tastes: [...new Set([A.taste, B.taste])],
    price: A.value + B.value,
    needs: [a, b].filter(m => MATS[m].fushigi),

}
function mergeFx(a, b) {
  const o = {};
  for (const k of ['dmg', 'heat', 'nb', 'hd', 'kd', 'first']) { const v = (a[k] || 0) + (b[k] || 0); if (v) o[k] = v; }
  const nx = (a.next || 1) * (b.next || 1); if (nx > 1) o.next = Math.min(4, nx);
  const ag = (a.again || 0) + (b.again || 0); if (ag) o.again = Math.min(2, ag);
  if (a.set != null || b.set != null) o.set = a.set != null ? a.set : b.set;
  if (a.proof || b.proof) o.proof = 1;
  return o;
}

/* ---------- カード（'m:材料'・'t:道具'・'o:材料+材料'＝★2・'s:お菓子|お菓子'＝★3） ---------- */
function specialName(r1, r2) { return r1.noun === r2.noun ? `特製${r1.noun}タワー` : `特製${r1.noun}＆${r2.noun}`; }
const DEFS = new Map();
function cardDef(cid) {
  if (DEFS.has(cid)) return DEFS.get(cid);
  const k = cid[0], id = cid.slice(2);
  let d;
  const pairFx = r => mergeFx(MATS[r.mats[0]].fx, MATS[r.mats[1]].fx);
  if (k === 'm') { const m = MATS[id]; d = { kind: m.fushigi ? 'f' : 'm', star: 1, food: true, name: m.name, fx: m.fx, mats: [id], cost: m.fushigi ? 4 : 3 }; }
  else if (k === 't') { const t = TOOLS[id]; d = { kind: 't', star: 1, food: false, name: t.name, fx: t.fx, mats: [], cost: 3 }; }
  else if (k === 'o') { const r = recipeOf(id); d = { kind: 'o', star: 2, food: true, name: r.name, fx: pairFx(r), mats: r.mats, cost: 6 }; }
  else { const [r1, r2] = id.split('|').map(recipeOf); const fx = mergeFx(pairFx(r1), pairFx(r2)); fx.proof = 1; d = { kind: 's', star: 3, food: true, name: specialName(r1, r2), fx, mats: [...r1.mats, ...r2.mats], keys: [r1.key, r2.key], cost: 0 }; }
  d.cid = cid;
  DEFS.set(cid, d);
  return d;
}

function fxText(fx, star = 1) {
  const m = STAR_MUL[star] || 1, p = [];
  if (fx.set != null) p.push(`火力を${fx.set}にする`);
  if (fx.first) p.push(`火力+${fx.heat || 0}（いちばん左なら+${(fx.heat || 0) + fx.first}）`);
  else if (fx.heat) p.push(`火力${fx.heat > 0 ? '+' : '−'}${Math.abs(fx.heat)}`);
  if (fx.dmg || fx.hd || fx.kd) {
    const f = v => Math.floor(v * m * 10) / 10;
    let s = `ダメージ${f(fx.dmg || 0)}`;
    if (fx.hd) s += `＋火力×${f(fx.hd)}`;
    if (fx.kd) s += `＋焦げた回数×${f(fx.kd)}`;
    p.push(s);
  }
  if (fx.nb) p.push(`となりの食材のダメージ+${Math.floor(fx.nb * m * 10) / 10}`);
  if (fx.next) p.push(`つぎにダメージを出すカードを×${fx.next}`);
  if (fx.again) p.push(`右どなりがもう${fx.again}回うごく`);
  if (fx.proof) p.push('焦げても平気（焦げると×6）');
  if (fx.shop) p.push(`仕入れが+${fx.shop}枚`);
  if (fx.coin) p.push(`ラウンドのおわりにコイン+${fx.coin}`);
  return p.join('。');
}

/* ==== 場面の絵：夜のお店（バトル）と昼のお店（販売）。幅96×高さ48を画面の幅いっぱいにのばす ==== */
const SW = 96, SH = 48, FLOOR = 41;
const scn = { mode: 'night', heat: 2, hit: 0, smoke: 0, flee: 0, cust: [], speed: 1, bg: {}, cv: null, raf: 0, last: 0 };
const CANDY_CV = new Map();
const candyCv = key => { if (!CANDY_CV.has(key)) CANDY_CV.set(key, candyCanvas(key)); return CANDY_CV.get(key); };

function mountScene(mode) {
  scn.cv = $('scene'); scn.mode = mode;
  if (!scn.cv) return;
  scn.cv.width = SW; scn.cv.height = SH;
  if (!scn.raf) scn.raf = requestAnimationFrame(sceneLoop);
}
function sceneLoop(ts) {
  scn.raf = requestAnimationFrame(sceneLoop);
  const cv = scn.cv;
  const dt = Math.min(0.1, (ts - (scn.last || ts)) / 1000); scn.last = ts;
  if (!cv || !cv.isConnected) return;
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  if (scn.mode === 'night') drawNight(g, ts / 1000, dt); else drawDay(g, ts / 1000, dt);
}
function painter(g) { return (col, x, y, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(x, y, w, h); }; }

/* ---------- 夜：窓に月、こわれた扉からモンスター、ほのかとコンロの火 ---------- */

  r('#4c3f74', 74, 6, 20, FLOOR - 6); r('#0c0a18', 76, 8, 16, FLOOR - 8); r('#6b5a3a', 92, 8, 2, FLOOR - 8);

}
function drawNight(g, t, dt) {
  const r = painter(g);
  g.drawImage(nightBg(), 0, 0);
  const z = zoneOf(scn.heat), fh = [2, 4, 7, 2][z];
  for (let i = 0; i < 8; i++) {

    r(z === 3 ? '#5a3a26' : '#f0502a', 27 + i, 34 - h, 1, h);
    if (z < 3 && h > 2) r(z === 2 ? '#fff6d0' : '#ffc94a', 27 + i, 34 - Math.ceil(h / 2), 1, Math.ceil(h / 2));
  }

  }
  scn.hit = Math.max(0, scn.hit - dt);

      else if (c.bub === 'none') { r('#7a5a4a', x + 2, y - 9, 8, 2); }

  }
  scn.cust = scn.cust.filter(c => !(c.gone && c.x === c.tx));

/* ---- src/js/night.js ---- */
/* ==== 夜：食材モンスターの襲撃を9ラウンドで撃退する（ゼンゼロのオバケ屋敷の形が土台） ====
   1ラウンド：仕入れ（毎回3枚・入れかえ・コインで買う）→ 並べる・まぜる → 焼く（調理台の左から順にうごく）
   ラウンド1だけ、5まいから3まい えらんで無料。食材★1＋★1をまぜると★2のお菓子（レシピがひらめく）、★2＋★2で★3スペシャル
   調理台6マスのカードだけがうごく。冷蔵庫3マスは、まぜる相手をとっておく場所 */
const SLOTS = 6, FRIDGE = 3, ROUND1_SHOW = 5, ROUND1_PICKS = 3, SHOP_N = 3, SHOP_MAX = 5, INCOME = 5, QUOTA_BONUS = 2, REROLL = 1;
const SELL = [0, 1, 3, 8];      // うると戻るコイン（★ごと）
const STEP_MS = REDUCED ? 140 : 420;
let N = null;          // S.night（夜のあいだの状態）
let busy = false;      // 焼いている間は操作しない

function startNight() {
  S.phase = 'night';
  S.today = { day: S.day, score: 0, beaten: false, drop: null, drops: 0, flashes: [], made: [], sales: 0, served: 0, visitors: 0, newRegulars: [] };
  S.night = {
    mon: (S.day - 1) % MONSTERS.length, field: null, stage: 'field', round: 1, coins: 0, picks: ROUND1_PICKS,
    board: Array(SLOTS).fill(null), fridge: Array(FRIDGE).fill(null), shop: [], score: 0, met: 0, burnt: 0,
    flashes: [], sel: null, mixing: false, last: null,
  };
  scn.flee = 0; scn.heat = 2;
  save(); render();
}

/* ---------- 仕入れ ---------- */
const area = w => w === 'board' ? N.board : N.fridge;
const boardFx = k => N.board.reduce((a, b) => a + (b ? (cardDef(b.cid).fx[k] || 0) : 0), 0);
const shopSize = () => N.round === 1 ? ROUND1_SHOW : Math.min(SHOP_MAX, SHOP_N + boardFx('shop'));
function poolList() {
  const L = [];
  for (const cid of CHEFS[S.chef].pool) L.push([cid, cid[0] === 'm' ? 3 : 2]);
  if (N.round >= 3 || N.met > 0) L.push(['m:' + MONSTERS[N.mon].drop, 3]);
  for (const cid of S.pool) L.push([cid, 2]);
  return L;
}
function draw1(L) {
  let tot = 0; for (const [, w] of L) tot += w;
  let x = Math.random() * tot;
  for (const [c, w] of L) if ((x -= w) < 0) return c;
  return L[0][0];
}
function rollShop() {
  const L = poolList(), out = [];
  if (N.round === 1) {
    const ok = shuffle(S.pool.slice());
    while (out.length < 1 && ok.length) out.push(ok.pop());
    const foods = CHEFS[S.chef].pool.filter(c => c[0] === 'm');
    while (out.filter(c => cardDef(c).food).length < 3) out.push(pick(foods));
  }
  while (out.length < shopSize()) out.push(draw1(L));
  N.shop = shuffle(out);
}
function chooseField(id) {
  if (!FIELDS[id]) return;
  N.field = id; N.stage = 'shop'; scn.heat = FIELDS[id].start;
  rollShop(); save(); renderNight();
}
function place(cid) {
  for (const w of ['board', 'fridge']) { const a = area(w), j = a.indexOf(null); if (j >= 0) { a[j] = { cid }; return { where: w, i: j }; } }
  return null;
}
function buy(i) {
  const cid = N.shop[i]; if (!cid || busy || N.stage !== 'shop') return;
  const d = cardDef(cid), free = N.round === 1;
  if (free && N.picks <= 0) return toast('3まい えらんだよ。焼いてみよう');
  if (!free && N.coins < d.cost) return toast('コインがたりない');
  const at = place(cid);
  if (!at) return toast('調理台も冷蔵庫もいっぱい。うるか、まぜてから買おう');
  if (free) N.picks--; else N.coins -= d.cost;
  N.shop[i] = null; N.sel = at; N.mixing = false;
  save(); renderNight();
}
const selCard = () => N.sel && N.sel.where !== 'shop' ? area(N.sel.where)[N.sel.i] : null;
function sell() {
  const c = selCard(); if (!c || busy || N.stage !== 'shop') return;
  const d = cardDef(c.cid);
  if (N.round === 1 && d.star === 1) N.picks = Math.min(ROUND1_PICKS, N.picks + 1);
  else N.coins += SELL[d.star];
  area(N.sel.where)[N.sel.i] = null; N.sel = null; N.mixing = false;
  save(); renderNight();
}
function reroll() {
  if (busy || N.stage !== 'shop' || N.round === 1) return;
  if (N.coins < REROLL) return toast('コインがたりない');
  N.coins -= REROLL; rollShop(); N.sel = null; N.mixing = false; save(); renderNight();
}

/* ---------- まぜる：同じ★の食材どうし ---------- */
function canMix(a, b) { const A = cardDef(a.cid), B = cardDef(b.cid); return A.food && B.food && A.star === B.star && A.star < 3; }
function mixResult(a, b) {
  const A = cardDef(a), B = cardDef(b);
  return A.star === 1 ? 'o:' + recipeKey(A.mats[0], B.mats[0]) : 's:' + [a.slice(2), b.slice(2)].sort().join('|');
}
function partners() {
  const c = selCard(); if (!c) return [];
  const out = [];
  for (const w of ['board', 'fridge']) area(w).forEach((x, i) => { if (x && !(w === N.sel.where && i === N.sel.i) && canMix(c, x)) out.push(w + i); });
  return out;
}
function startMix() {
  if (busy || N.stage !== 'shop' || !selCard()) return;
  if (!partners().length) return toast('まぜられる相手がいない（同じ★の食材どうし）');
  N.mixing = true; renderNight();
}
function doMix(to) {
  const from = N.sel, a = area(from.where)[from.i], b = area(to.where)[to.i];
  const cid = mixResult(a.cid, b.cid), d = cardDef(cid);
  area(to.where)[to.i] = { cid, born: true }; area(from.where)[from.i] = null;
  N.mixing = false; N.sel = { where: to.where, i: to.i };
  if (FIELDS[N.field].mix) N.coins += FIELDS[N.field].mix;
  if (d.star === 2) {
    const key = cid.slice(2);
    if (S.recipes[key] == null) { S.recipes[key] = S.day; N.flashes.push(key); toast('ひらめき！ ' + d.name); }
    else toast(d.name + 'ができた');
  } else toast('スペシャル！ ' + d.name);
  save(); renderNight();
  delete area(to.where)[to.i].born;
}
function tapCard(where, i) {
  if (busy || N.stage !== 'shop') return;
  const s = N.sel, here = area(where)[i], same = s && s.where === where && s.i === i;
  if (N.mixing) {
    if (here && !same && canMix(selCard(), here)) return doMix({ where, i });
    N.mixing = false;
    if (!same) toast('同じ★の食材どうしをえらんでね');
    return renderNight();
  }
  if (s && s.where !== 'shop' && !same) {
    const a = area(s.where), b = area(where);
    [a[s.i], b[i]] = [b[i], a[s.i]];
    N.sel = b[i] ? { where, i } : null;
    save(); return renderNight();
  }
  N.sel = here && !same ? { where, i } : null;
  renderNight();
}
function tapShop(i) {
  if (busy || N.stage !== 'shop' || !N.shop[i]) return;
  const s = N.sel;
  N.mixing = false;
  N.sel = s && s.where === 'shop' && s.i === i ? null : { where: 'shop', i };
  renderNight();
}

/* ---------- 焼く：調理台の左から順にうごく ---------- */
function resolveRound() {
  const F = FIELDS[N.field], ev = [], extra = Array(SLOTS).fill(0);
  let heat = F.start, pend = 1, total = 0, burnt = N.burnt;
  for (let i = 0; i < SLOTS; i++) {
    const b = N.board[i]; if (!b) continue;
    const d = cardDef(b.cid), fx = d.fx, sm = STAR_MUL[d.star];
    const times = 1 + Math.min(3, extra[i]);
    for (let t = 0; t < times; t++) {
      if (fx.set != null) heat = fx.set;
      heat += (fx.heat || 0) + (i === 0 && fx.first ? fx.first : 0);
      if (heat < 0) heat = 0;
      if (F.cap != null && heat > F.cap) heat = F.cap;
      let base = ((fx.dmg || 0) + (fx.hd || 0) * heat + (fx.kd || 0) * burnt) * sm;
      if (d.food) for (const j of [i - 1, i + 1]) {
        const o = j >= 0 && j < SLOTS ? N.board[j] : null;
        if (o) { const od = cardDef(o.cid); if (od.fx.nb) base += od.fx.nb * STAR_MUL[od.star]; }
      }
      let dmg = base;
      if (base > 0) { dmg = base * pend; pend = 1; }
      if (fx.next) pend *= fx.next;
      const z = zoneOf(heat);
      let isBurnt = false;
      if (z === 3) { isBurnt = true; burnt++; dmg = fx.proof ? dmg * 6 : 0; heat = 4; }
      else dmg *= F.mul[z];
      if (F.boost && d.star >= 2) dmg *= F.boost;
      dmg = Math.floor(dmg);
      total += dmg;
      if (fx.again && i + 1 < SLOTS && t === 0) extra[i + 1] += fx.again;
      ev.push({ i, again: t > 0, heat: isBurnt ? 11 : heat, after: heat, dmg, burnt: isBurnt });
    }
  }
  return { ev, total, burnt, start: F.start };
}
function bake() {
  if (busy || N.stage !== 'shop') return;
  if (!N.board.some(Boolean)) return toast('調理台にカードを置いてから焼こう');
  if (N.round === 1 && N.picks > 0 && N.shop.some(Boolean)) return toast(`あと${N.picks}まい えらべるよ`);
  const res = resolveRound();
  busy = true; N.sel = null; N.mixing = false; renderNight();
  setHeat(res.start);
  const q = quota(N.round, S.day);
  let k = 0, run = 0;
  const step = () => {
    if (k >= res.ev.length) return setTimeout(() => finishRound(res), STEP_MS);
    const e = res.ev[k++];
    run += e.dmg;
    showEvent(e, run, q);
    setTimeout(step, STEP_MS);
  };
  setTimeout(step, 200);
}
function setHeat(h) {
  scn.heat = h;
  const bar = $('heatBar'), lab = $('heatLabel'); if (!bar) return;
  const z = zoneOf(h);
  [...bar.children].forEach((c, i) => { c.className = i < Math.min(12, h) ? 'on z' + zoneOf(i + 1) : ''; });
  lab.textContent = `${ZONES[z]} ${Math.min(h, 99)}`;
  lab.className = 'heat-label z' + z;
}
function floatAt(el, text, cls = '') {
  if (!el) return;
  const f = document.createElement('span');
  f.className = 'float ' + cls; f.textContent = text;
  el.appendChild(f); setTimeout(() => f.remove(), 1000);
}
function showEvent(e, run, q) {
  const slot = document.querySelector(`[data-act="card"][data-w="board"][data-i="${e.i}"]`);
  const card = slot && slot.querySelector('.card');
  if (card) { card.classList.remove('fire'); void card.offsetWidth; card.classList.add('fire'); }
  setHeat(e.heat);
  if (e.burnt) { scn.smoke = 1; floatAt(slot, '焦げた', 'koge'); setTimeout(() => setHeat(e.after), STEP_MS / 2); }
  if (e.dmg > 0) { floatAt(slot, (e.again ? 'もう1回 ' : '') + fmt(e.dmg)); scn.hit = 0.3; floatAt($('floats'), fmt(e.dmg), 'big'); }
  $('score').textContent = fmt(N.score + run);
  $('qfill').style.width = Math.min(100, run / q * 100) + '%';
  $('qtext').textContent = `${fmt(run)} / ノルマ ${fmt(q)}`;
}
function finishRound(res) {
  const q = quota(N.round, S.day), ok = res.total >= q;
  N.score += res.total; N.burnt = res.burnt;
  if (ok) N.met++;
  N.last = { round: N.round, total: res.total, q, ok, coin: boardFx('coin') };
  N.stage = 'roundEnd'; busy = false;
  save(); renderNight();
}
function nextRound() {
  if (N.stage !== 'roundEnd') return;
  if (N.round >= ROUNDS) return endNight();
  N.coins += INCOME + (N.last.ok ? QUOTA_BONUS : 0) + N.last.coin;
  N.round++; N.stage = 'shop'; N.sel = null; N.mixing = false;
  scn.heat = FIELDS[N.field].start;
  rollShop(); save(); renderNight();
}
function endNight() {
  const hp = nightHP(S.day), beaten = N.score >= hp, drop = MONSTERS[N.mon].drop;
  const drops = N.met + (beaten ? 2 : 0);
  S.stock[drop] = (S.stock[drop] || 0) + drops;
  Object.assign(S.today, { score: N.score, beaten, drop, drops, flashes: N.flashes.slice() });
  N.stage = 'end';
  if (beaten) scn.flee = performance.now() / 1000;
  save(); renderNight();
}

/* ---------- 画面（スマホ1画面に収める） ---------- */
function cardHTML(cid, extra = '') {
  const d = cardDef(cid);

/* ---- src/js/morning.js ---- */
/* ==== 朝：ひらめいたレシピとふしぎな材料でお菓子を作る → カードにするか、お昼に売るか ==== */
const OVENS = 3, BATCH = 3;   // 朝に焼けるのは3回。1回で3こ（売るとき）

function goMorning() {
  S.phase = 'morning'; S.morning = { ovens: OVENS, cur: null };
  save(); render();
}
function canBake(key) {
  const need = {};
  for (const m of recipeOf(key).needs) need[m] = (need[m] || 0) + 1;
  return Object.keys(need).every(m => (S.stock[m] || 0) >= need[m]);
}
function bakeRecipe(key) {
  const M = S.morning;
  if (!S.recipes[key] && S.recipes[key] !== 0) return;
  if (M.cur) return toast('できたお菓子を先にえらんでね');
  if (M.ovens <= 0) return toast('オーブンはもう使いきったよ');
  if (!canBake(key)) return toast('ふしぎな材料がたりない');
  for (const m of recipeOf(key).needs) S.stock[m]--;
  M.ovens--; M.cur = key; S.today.made.push(key);
  save(); renderMorning();
}
function toCard() {
  const M = S.morning; if (!M.cur) return;
  S.pool.push('o:' + M.cur);
  toast(`${recipeOf(M.cur).name}をカードにした。夜の仕入れに出てくるよ`);
  M.cur = null; save(); renderMorning();
}
function toShelf() {
  const M = S.morning; if (!M.cur) return;
  const s = S.shelf.find(x => x.key === M.cur);
  if (s) s.n += BATCH; else S.shelf.push({ key: M.cur, n: BATCH });
  toast(`${recipeOf(M.cur).name}を棚に並べた`);
  M.cur = null; save(); renderMorning();
}
function tasteTags(r) { return r.tastes.map(t => `<span class="tag">${t}</span>`).join(''); }
function renderMorning() {
  const M = S.morning;
  const keys = Object.keys(S.recipes).sort((a, b) => (S.recipes[b] - S.recipes[a]) || a.localeCompare(b));
  const fus = Object.keys(MATS).filter(m => MATS[m].fushigi && S.stock[m] > 0);
  let cur = '';
  if (M.cur) {
    const r = recipeOf(M.cur), d = cardDef('o:' + M.cur);
    cur = `<div class="panel made"><img class="candy" src="${candyURL(M.cur)}" alt="">
      <div><h2>${esc(r.name)}ができた！</h2><div class="tags">${tasteTags(r)}</div>
      <p>カードにすると：${fxText(d.fx)}</p><p>売ると：1こ ${r.price}円（すきな味のお客さんには倍）</p></div></div>
      <div class="row two"><button data-act="toCard">カードにする</button><button data-act="toShelf">お昼に売る（${BATCH}こ）</button></div>`;
  }
  $('screen').innerHTML = `<section class="morning fit">
    <div class="panel tight"><h2>朝の仕込み</h2><p>ひらめいたレシピでお菓子を作ろう。カードにすると夜の仕入れに出てきて、売るとお金になるよ</p></div>
    <div class="stockline"><span>オーブン あと<b>${M.ovens}</b>回</span>
      <span class="fus">${fus.length ? fus.map(m => `<img src="${matURL(m)}" alt="">${MATS[m].name}×${S.stock[m]}`).join(' ') : 'ふしぎな材料はなし'}</span></div>
    ${fus.some(m => !keys.some(k => recipeOf(k).needs.includes(m))) ? `<p class="muted">${fus.filter(m => !keys.some(k => recipeOf(k).needs.includes(m))).map(m => MATS[m].name).join('・')}のレシピは、夜にそのカードを食材のとなりに置くとひらめくよ</p>` : ''}
    ${cur}
    <div class="recipes">${keys.map(k => {
      const r = recipeOf(k), ok = canBake(k) && M.ovens > 0 && !M.cur;
      return `<button class="recipe" data-act="bakeRecipe" data-key="${k}" ${ok ? '' : 'disabled'}>
        <img class="candy" src="${candyURL(k)}" alt="">
        <span class="rbody"><span class="rn">${esc(r.name)}${S.recipes[k] === S.day ? '<em>NEW</em>' : ''}</span>
        <span class="rm">${r.mats.map(m => `<img src="${matURL(m)}" alt="${MATS[m].name}">`).join('+')} ${tasteTags(r)}</span>
        ${r.needs.length ? `<span class="rneed">${r.needs.map(m => MATS[m].name).join('と')}を使う</span>` : ''}</span></button>`;
    }).join('')}</div>
    <button class="big" data-act="openShop" ${M.cur ? 'disabled' : ''}>お店をあける</button>
  </section>`;
}

/* ---- src/js/day.js ---- */
/* ==== 昼：棚1つでお菓子を売る → 1日のまとめ ====
   お客さんはすきな味が2つ。棚にすきな味のお菓子があれば2倍の値段で買ってハート（3つで常連さん）
   なければ6わりの人がほかのお菓子を買う */
const HEART = '\u2665\uFE0E';   // 絵文字にならないように文字の形で
const CUST_BASE = 6, LIKE_MUL = 2, OTHER_BUY = 0.6;
let dayTimer = 0;

function goDay() {
  S.phase = 'day';
  S.dayRun = { i: 0, total: CUST_BASE + Math.min(4, S.day - 1), log: [], done: false };
  scn.cust = []; scn.speed = 1;
  save(); render();
}
function addLog(text, cls = '') {
  S.dayRun.log.push([text, cls]);
  const ol = $('dayLog');
  if (ol) { const li = document.createElement('li'); li.className = cls; li.textContent = text; ol.prepend(li); }
}
function serve(c) {
  const items = S.shelf.filter(s => s.n > 0), T = S.today;
  T.visitors++;
  if (!items.length) { addLog(`${c.name}：売り切れで帰っちゃった`, 'no'); return 'none'; }
  const liked = items.filter(s => recipeOf(s.key).tastes.some(t => c.likes.includes(t)));
  let s = null, p = 0, love = false;
  if (liked.length) { s = liked.sort((a, b) => recipeOf(b.key).price - recipeOf(a.key).price)[0]; p = recipeOf(s.key).price * LIKE_MUL; love = true; }
  else if (Math.random() < OTHER_BUY) { s = pick(items); p = recipeOf(s.key).price; }
  if (!s) { addLog(`${c.name}：すきな味（${c.likes.join('・')}）がなかった`, 'no'); return 'none'; }
  s.n--; S.shelf = S.shelf.filter(x => x.n > 0);
  S.money += p; T.sales += p; T.served++;
  const name = recipeOf(s.key).name;
  if (love) {
    S.hearts[c.id] = (S.hearts[c.id] || 0) + 1;
    addLog(`${c.name}が${name}を気に入って買った ${p}円 ${HEART}`, 'love');
    if (S.hearts[c.id] === HEARTS_REGULAR && !S.regulars.includes(c.id)) {
      S.regulars.push(c.id); T.newRegulars.push(c.id);
      setTimeout(() => toast(`${c.name}が常連さんになった！`), 300);
    }
  } else addLog(`${c.name}が${name}を買った ${p}円`);
  return love ? 'heart' : s.key;
}
function runCustomers() {
  clearTimeout(dayTimer);
  const R = S.dayRun; if (!R || R.done || S.phase !== 'day') return;
  if (R.i >= R.total) { R.done = true; save(); return renderDay(); }
  const c = pick(CUSTOMERS), sp = () => scn.speed;
  const who = { id: c.id, x: 100, tx: 72 - rand(10), bub: null };
  scn.cust.push(who);
  dayTimer = setTimeout(() => {
    const res = serve(c);
    who.bub = res;
    R.i++; save(); updateDayInfo();
    dayTimer = setTimeout(() => {
      who.bub = null; who.tx = 104; who.gone = true;
      dayTimer = setTimeout(runCustomers, 350 / sp());
    }, 900 / sp());
  }, 1100 / sp());
}
function updateDayInfo() {
  const R = S.dayRun, el = $('dayInfo'); if (!el) return;
  el.innerHTML = `お客さん <b>${R.i}</b>/${R.total}　売上 <b>${fmt(S.today.sales)}</b>円`;
  const sh = $('shelfList');
  if (sh) sh.innerHTML = shelfHTML();
  const m = $('money'); if (m) m.textContent = fmt(S.money) + '円';
}
function shelfHTML() {
  return S.shelf.length ? S.shelf.map(s => `<span class="item"><img src="${candyURL(s.key)}" alt="">${esc(recipeOf(s.key).name)} ×${s.n}</span>`).join('') : '<span class="muted">棚はからっぽ</span>';
}
function toggleFast() {
  scn.speed = scn.speed === 1 ? 3 : 1;
  const b = document.querySelector('[data-act="fast"]'); if (b) b.textContent = scn.speed === 1 ? 'はやおくり' : 'ふつうの速さ';
}
function renderDay() {
  const R = S.dayRun;
  $('screen').innerHTML = `<section class="day fit">
    <div class="scene-wrap"><canvas id="scene" width="${SW}" height="${SH}"></canvas></div>
    <div class="panel tight"><h2>お昼の販売</h2><p id="dayInfo"></p></div>
    <div class="shelf"><span class="lbl">棚</span><div id="shelfList"></div></div>
    <ol class="log" id="dayLog">${R.log.slice().reverse().map(([t, c]) => `<li class="${c}">${esc(t)}</li>`).join('')}</ol>
    ${R.done ? '<button class="big" data-act="toResult">1日のまとめへ</button>' : `<div class="row"><button class="sub" data-act="fast">${scn.speed === 1 ? 'はやおくり' : 'ふつうの速さ'}</button></div>`}
  </section>`;
  mountScene('day'); updateDayInfo();
  if (!R.done && !scn.cust.length) runCustomers();
}

/* ---------- 1日のまとめ ---------- */

function nextDay() { S.day++; startNight(); }
function renderResult() {

  const hearts = CUSTOMERS.map(c => `<li><span>${c.name}</span><span class="hearts">${HEART.repeat(Math.min(HEARTS_REGULAR, S.hearts[c.id] || 0))}<i>${HEART.repeat(Math.max(0, HEARTS_REGULAR - (S.hearts[c.id] || 0)))}</i></span>${S.regulars.includes(c.id) ? '<em>常連さん</em>' : ''}</li>`).join('');

        <dt>ひらめき</dt><dd>${T.flashes.length ? T.flashes.map(k => esc(recipeOf(k).name)).join('、') : 'なし'}</dd>
        <dt>仕込み</dt><dd>${T.made.length ? T.made.map(k => esc(recipeOf(k).name)).join('、') : 'なし'}</dd>
        <dt>お昼</dt><dd>売上 ${fmt(T.sales)}円（${T.served}/${T.visitors}人が買った）</dd>
        <dt>お金</dt><dd class="gold">${fmt(S.money)}円</dd>
      </dl></div>
    <div class="panel"><h2>お客さんのハート</h2><ul class="heartlist">${hearts}</ul>
      <p class="muted">常連さんは、これから仲間になって夜にいっしょに戦えるようになる予定</p></div>

/* ---- src/js/main.js ---- */
/* ==== はじまり：画面の切りかえ・タイトル・タップのうけつけ ==== */
const PHASE_NAME = { night: '夜', morning: '朝', day: '昼', result: 'まとめ' };
let resetArm = false;

function renderTop() {
  $('dayLabel').textContent = S.phase === 'title' ? '' : `${S.day}日目　${PHASE_NAME[S.phase] || ''}`;
  $('money').textContent = S.phase === 'title' ? '' : fmt(S.money) + '円';
}
function renderTitle() {
  const saved = load();
  const chef = big(CHEF_SPR[0], 5), mon = big(MON_SPR.slime, 3);
  $('screen').innerHTML = `<section class="title">
    <h1>まぜまぜ<br>おかし屋</h1>
    <div class="hero"><img src="${chef}" alt="炎のシェフ ほのか"><img src="${mon}" alt="ぷるぷるスライム"></div>
    <p>炎のシェフ ほのか（仮）の小さなおかし屋さん。<br>夜になると、食材モンスターがお店をおそいにくる！</p>
    <ul class="howto"><li><b>夜</b>　カードを調理台に並べて、9ラウンドで撃退。食材★1どうしをまぜると★2のお菓子になって、レシピがひらめく</li>
      <li><b>朝</b>　ひらめいたレシピでお菓子づくり。カードにするか、売るか</li>
      <li><b>昼</b>　棚に並べて販売。すきな味だとお客さんが常連さんに</li></ul>
    ${saved && saved.phase !== 'title' ? `<button class="big" data-act="continue">つづきから（${saved.day}日目）</button>
      <button class="sub" data-act="reset">${resetArm ? 'ほんとうに はじめから？（もう一度タップ）' : 'はじめから'}</button>` : '<button class="big" data-act="start">はじめる</button>'}
  </section>`;
}
function render() {
  renderTop();
  if (S.phase === 'night') renderNight();
  else if (S.phase === 'morning') renderMorning();
  else if (S.phase === 'day') renderDay();
  else if (S.phase === 'result') renderResult();
  else renderTitle();
  $('screen').scrollTop = 0;
}

const ACTS = {
  start: () => { S = newState(); startNight(); },
  continue: () => { const s = load(); if (s) { S = s; if (S.phase === 'night' && S.night && S.night.stage === 'roundEnd') busy = false; render(); } },
  reset: () => { if (!resetArm) { resetArm = true; return renderTitle(); } resetArm = false; S = newState(); startNight(); },
  field: el => chooseField(el.dataset.id),
  card: el => tapCard(el.dataset.w, +el.dataset.i),
  shop: el => tapShop(+el.dataset.i),
  buy: el => buy(+el.dataset.i),
  sell: () => sell(),
  mix: () => startMix(),
  cancelMix: () => { N.mixing = false; renderNight(); },
  reroll: () => reroll(),
  bake: () => bake(),
  next: () => nextRound(),
  toMorning: () => goMorning(),
  bakeRecipe: el => bakeRecipe(el.dataset.key),
  toCard: () => toCard(),
  toShelf: () => toShelf(),
  openShop: () => goDay(),
  fast: () => toggleFast(),
  toResult: () => goResult(),
  nextDay: () => nextDay(),
};
function boot(data) {
  const s = data && data.S ? sanitize(data.S) : null;
  S = s || newState();
  if (!s) S.phase = 'title';
  $('screen').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const f = ACTS[el.dataset.act]; if (f) f(el);
    renderTop();
  });
  render();
